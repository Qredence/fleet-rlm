---
name: ci tests
discover: find tests -type f -name 'test_*.py' -print | sort
run: |
  set -- << test.atoms >>
  if [ "$#" -eq 0 ]; then exit 0; fi
  mkdir -p test-results
  uv run --locked pytest -c pyproject.toml -q -o junit_family=xunit1 --junitxml="<< outputs.junit >>" "$@"
analysis: |
  set -- << test.atoms >>
  if [ "$#" -eq 0 ]; then exit 0; fi
  rm -f .coverage
  uv run --locked coverage run --source=src/fleet_rlm -m pytest -c pyproject.toml -q "$@"
  test_status=$?
  if [ -f .coverage ]; then
    uv run --locked coverage lcov --fail-under=0 -o "<< outputs.lcov >>"
    coverage_status=$?
  else
    coverage_status=1
  fi
  if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
  exit "$coverage_status"
outputs:
  junit: test-results/junit.xml
  lcov: test-results/coverage.lcov
options:
  impact-key: fleet-ci-files-lcov-v1
  test-impact-analysis: true
  dynamic-test-splitting: true
  max-auto-rerun: 1
  full-test-run-paths:
    - pyproject.toml
    - uv.lock
    - Makefile
    - tests/**
    - .circleci/**
    - config/**
    - scripts/**
    - openapi.yaml
    - src/fleet_rlm/bundled_skills/**
    - src/fleet_rlm/sandbox/snapshot-requirements.txt
