---
name: pytest-unit
discover: bash -c 'set -o pipefail; .venv/bin/pytest --collect-only -p no:warnings -m "not deno and not live_llm and not live_daytona and not benchmark and not db" tests/unit tests/contracts 2>/dev/null | tr -d "\\r" | grep "^tests/.*::"'
run: bash -c 'set -f; mkdir -p test-results; .venv/bin/pytest -p no:warnings -m "not deno and not live_llm and not live_daytona and not benchmark and not db" --junit-xml=<< outputs.junit >> << test.atoms >>'
outputs:
  junit: test-results/pytest-unit.xml
options:
  dynamic-test-splitting: false
