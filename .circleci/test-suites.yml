run: bash -c 'set -f; mkdir -p test-results; .venv/bin/pytest -p no:warnings -m "not deno and not live_llm and not live_daytona and not benchmark and not db" --junit-xml=<< outputs.junit >> << test.atoms >>'
outputs:
