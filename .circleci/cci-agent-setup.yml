version: 2.1

workflows:
  cci-agent-setup:
    jobs:
      - cci-agent-setup

jobs:
  cci-agent-setup:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-uv-{{ arch }}-3.12-0.12.21-{{ checksum "uv.lock" }}
      - run:
          name: Install pinned uv
          command: |
            bash .circleci/install-uv.sh
      - run:
          name: Install locked project dependencies
          command: |
            export UV_PYTHON=3.12
            echo 'export UV_PYTHON=3.12' >> "$BASH_ENV"
            uv sync --locked --dev --python 3.12
      - run:
          name: Verify selected Python interpreter
          command: uv run --locked python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - save_cache:
          key: v1-uv-{{ arch }}-3.12-0.12.21-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
