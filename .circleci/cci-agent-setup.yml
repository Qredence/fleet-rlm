version: 2.1

jobs:
  cci-agent-setup:
    docker:
      - image: cimg/python:3.13.13-node
    working_directory: ~/project
    environment:
      UV_LOCKED: "true"
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.12.21/install.sh | sh
            test "$("$HOME/.local/bin/uv" --version | cut -d ' ' -f 2)" = "0.12.21"
            "$HOME/.local/bin/uv" --version
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Provision locked Python dependencies
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv sync --all-extras --dev --locked
      - run:
          name: Provision locked TUI dependencies
          command: |
            corepack enable
            corepack prepare pnpm@12.6.0 --activate
            cd tools/fleet-tui
            pnpm install --frozen-lockfile

workflows:
  cci-agent-setup:
    jobs:
      - cci-agent-setup
