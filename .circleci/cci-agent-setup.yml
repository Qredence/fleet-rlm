version: 2.1

workflows:
  cci-agent-setup:
    jobs:
      - cci-agent-setup

jobs:
  cci-agent-setup:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-uv-{{ arch }}-3.12-0.12.21-{{ checksum "uv.lock" }}
      - run:
          name: Install pinned uv
          command: |
            curl -LsSf https://astral.sh/uv/0.12.21/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install locked project dependencies
          command: uv sync --locked --dev --python 3.12
      - save_cache:
          key: v1-uv-{{ arch }}-3.12-0.12.21-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
