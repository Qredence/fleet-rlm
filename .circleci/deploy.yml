version: 2.1

commands:
  install_uv:
    steps:
      - restore_cache:
          keys:
            - v1-uv-bin-{{ arch }}
      - run:
          name: Install uv (skip if cached)
          command: |
            if [ ! -f "$HOME/.local/bin/uv" ]; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
            fi
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - save_cache:
          key: v1-uv-bin-{{ arch }}
          paths:
            - ~/.local/bin/uv
            - ~/.local/bin/uvx

executors:
  python:
    docker:
      - image: cimg/python:3.13.13-node
    working_directory: ~/project
    environment:
      UV_CACHE_DIR: ~/.cache/uv

jobs:
  deploy-pypi:
    executor: python
    resource_class: small
    environment:
      COMPONENT_NAME: "fleet-rlm"
      ENVIRONMENT_NAME: "pypi"
      TARGET_VERSION: "<< pipeline.deploy.target_version >>"
    steps:
      - checkout
      - install_uv
      - run:
          name: Validate PyPI deploy inputs
          command: |
            test -n "${TARGET_VERSION}" || {
              echo "target_version must be supplied when enabling deploy_pypi" >&2
              exit 1
            }
            test -n "${GITHUB_TOKEN:-}" || {
              echo "GITHUB_TOKEN must be configured in the CircleCI project or context" >&2
              exit 1
            }
            python \<< 'PY'
            import os
            import tomllib

            requested = os.environ["TARGET_VERSION"].removeprefix("v")
            with open("pyproject.toml", "rb") as handle:
                project_version = tomllib.load(handle)["project"]["version"]
            if project_version != requested:
                raise SystemExit(
                    f"target_version {requested!r} does not match pyproject.toml {project_version!r}"
                )
            print(f"Preparing fleet-rlm {project_version} for the PyPI deployment bridge")
            PY
      - run:
          name: Plan release
          command: |
            circleci run release plan \
              --environment-name=${ENVIRONMENT_NAME} \
              --component-name=${COMPONENT_NAME} \
              --target-version=${TARGET_VERSION}
      - run:
          name: Perform deployment
          command: |
            uv run python scripts/circleci_trigger_release.py \
              --version="${TARGET_VERSION}" \
              --repository=Qredence/fleet-rlm \
              --ref=main
          no_output_timeout: 45m
      - run:
          name: Update deployment status to failed
          command: circleci run release update --status=FAILED
          when: on_fail
  cancel-deploy-pypi:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Update planned release to CANCELED
          command: |
            circleci run release update deploy-pypi \
              --status=CANCELED
  deploy-pypi-release:
    type: release
    plan_name: deploy-pypi
    validation:
      enabled: true
      auto_rollback_on_failure: true

workflows:
  deploy:
    jobs:
      - deploy-pypi:
          filters:
            branches:
              only: main
      - deploy-pypi-release:
          requires:
            - deploy-pypi
          filters:
            branches:
              only: main
      - cancel-deploy-pypi:
          requires:
            - deploy-pypi:
              - canceled
