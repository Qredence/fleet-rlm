version: 2.1

executors:
  python:
    docker:
      # The -node variant adds Node.js so openapi-typescript (npx) can run in
      # the same job as the python gates (api-check regenerates TUI types).
      - image: cimg/python:3.13.13-node
    working_directory: ~/project
    environment:
      UV_CACHE_DIR: ~/.cache/uv
  node:
    docker:
      - image: cimg/node:22.23.2@sha256:7c78a95e25876729c2c9cada532b0636fd3ec7dbae922b3d90d83704f4c87639
    working_directory: ~/project

commands:
  install_uv:
    steps:
      - restore_cache:
          keys:
            - v1-uv-bin-{{ arch }}
      - run:
          name: Install uv (skip if cached)
          command: |
            if [ ! -f "$HOME/.local/bin/uv" ]; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
            fi
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - save_cache:
          key: v1-uv-bin-{{ arch }}
          paths:
            - ~/.local/bin/uv
            - ~/.local/bin/uvx

  restore_uv_cache:
    steps:
      - restore_cache:
          keys:
            - v1-uv-py313-{{ arch }}-{{ checksum "uv.lock" }}
            - v1-uv-py313-{{ arch }}-

  save_uv_cache:
    steps:
      - save_cache:
          key: v1-uv-py313-{{ arch }}-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv

  install_python_dependencies:
    steps:
      - install_uv
      - restore_uv_cache
      - run:
          name: Install Python dependencies
          no_output_timeout: 15m
          command: uv sync --all-extras --dev --python 3.13 --verbose

jobs:
  quality:
    executor: python
    resource_class: small
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Release and docs checks
          command: |
            make check-release
            make check-docs
      - run:
          name: Security checks
          command: make check-security
      - run:
          name: API and stream contract checks
          command: |
            make api-check
            make stream-check
      - run:
          name: Python dependency check
          command: uvx deptry . --config pyproject.toml

  lint-typecheck:
    executor: python
    resource_class: small
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Ruff and ty
          command: |
            make lint
            make format-check
            make typecheck

  test-unit:
    executor: python
    resource_class: medium+
    parallelism: 4
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Run unit/contract atom subset (Smarter Testing)
          no_output_timeout: 10m
          command: |
            mkdir -p test-results
            circleci run testsuite "pytest-unit"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results/unit

  test-e2e:
    executor: python
    resource_class: medium+
    parallelism: 2
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Run E2E atom subset (Smarter Testing)
          no_output_timeout: 10m
          command: |
            mkdir -p test-results
            circleci run testsuite "pytest-e2e"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results/e2e

  daytona-coverage:
    executor: python
    resource_class: medium+
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Run Daytona branch coverage gate
          no_output_timeout: 10m
          command: make test-daytona-cov
      - store_artifacts:
          path: .scratch/coverage
          destination: coverage/daytona

  tui:
    executor: node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: |
            corepack enable
            corepack prepare pnpm@10.33.2 --activate
      - run:
          name: Install TUI dependencies
          command: pnpm --dir tools/fleet-tui install --frozen-lockfile
      - run:
          name: TUI lint, type, and tests
          command: |
            pnpm --dir tools/fleet-tui run format:check
            pnpm --dir tools/fleet-tui run lint
            pnpm --dir tools/fleet-tui run typecheck
            pnpm --dir tools/fleet-tui test

workflows:
  ci:
    jobs:
      - quality
      - lint-typecheck
      - test-unit
      - test-e2e
      - daytona-coverage
      - tui
