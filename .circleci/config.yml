version: 2.1

parameters:
  run_ci:
    type: boolean
    default: false
  run_python314:
    type: boolean
    default: false
  run_release:
    type: boolean
    default: false
  run_pypi_recovery:
    type: boolean
    default: false
  skip_testpypi:
    type: boolean
    default: true
  run_draft:
    type: boolean
    default: false
  activate_auto_release:
    type: boolean
    default: false
  release_version:
    type: string
    default: ""
  release_sha:
    type: string
    default: ""

functions:
  setup-github-cli: github.com/circleci-functions/setup-github-cli@v0.3.0

commands:

  install-uv:
    steps:
      - run:
          name: Install pinned uv
          command: |
            bash .circleci/install-uv.sh
  restore-uv-cache:
    parameters:
      python-version:
        type: string
    steps:
      - restore_cache:
          keys:
            - v1-uv-{{ arch }}-<< parameters.python-version >>-0.12.21-{{ checksum "uv.lock" }}
  save-uv-cache:
    parameters:
      python-version:
        type: string
    steps:
      - save_cache:
          key: v1-uv-{{ arch }}-<< parameters.python-version >>-0.12.21-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
  setup-python:
    parameters:
      python-version:
        type: string
      use-workspace-venv:
        type: boolean
        default: false
      persist-venv:
        type: boolean
        default: false
      use-cache:
        type: boolean
        default: true
    steps:
      - checkout
      - install-uv
      - when:
          condition: << parameters.use-workspace-venv >>
          steps:
            - attach_workspace:
                at: .
      - when:
          condition: << parameters.use-cache >>
          steps:
            - restore-uv-cache:
                python-version: << parameters.python-version >>
      - run:
          name: Prepare environment and reuse venv when available
          command: |
            export UV_PYTHON="<< parameters.python-version >>"
            echo 'export UV_PYTHON="<< parameters.python-version >>"' >> "$BASH_ENV"
            # If a workspace-provided .venv exists but with the wrong interpreter, discard it
            if [ -x .venv/bin/python ]; then
              ver=$(.venv/bin/python -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')
              if [ "$ver" != "<< parameters.python-version >>" ]; then
                echo "Existing .venv uses $ver; removing to rebuild for << parameters.python-version >>"
                rm -rf .venv
              else
                echo "Reusing workspace .venv for Python << parameters.python-version >>"
              fi
            fi
            # Create/sync venv only when needed
            if [ ! -x .venv/bin/python ]; then
              uv sync --locked --dev --python << parameters.python-version >>
            fi
      - run:
          name: Verify selected Python interpreter
          command: |
            uv run --locked python -c '
            import sys
            expected = tuple(map(int, "<< parameters.python-version >>".split(".")))
            print(f"Python {sys.version}; executable: {sys.executable}")
            if sys.version_info[:2] != expected:
                raise SystemExit(f"Expected Python {expected}, got {sys.version_info[:2]}")
            '
      - when:
          condition: << parameters.use-cache >>
          steps:
            - save-uv-cache:
                python-version: << parameters.python-version >>
      - when:
          condition: << parameters.persist-venv >>
          steps:
            - persist_to_workspace:
                root: .
                paths:
                  - .venv

  capture-release-metadata:
    parameters:
      notes-script:
        type: string
        default: scripts/release_notes.py
    steps:
      - run:
          name: Capture exact-source notes and locked consumer requirements
          command: |
            mkdir -p release-metadata
            uv export --locked --no-dev --no-emit-project --format requirements.txt --python 3.12 --output-file release-metadata/requirements.txt
            python << parameters.notes-script >> --version "$FLEET_RELEASE_VERSION" \
              --source-sha "$FLEET_RELEASE_SHA" --manifest dist/SHA256SUMS --prepare release-metadata
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - release-metadata
      - store_artifacts:
          path: dist
          destination: release-distributions
      - store_artifacts:
          path: release-metadata
          destination: release-metadata

jobs:
  release-metadata:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - setup-github-cli:
          with:
            version: "2.103.3"
      - checkout:
          method: full
      - run:
          name: Validate PR metadata with trusted main code and a read-only token
          command: |
            set +x
            export PYENV_VERSION=3.12
            # Skip gracefully when GitHub App credentials are unavailable (e.g., forked PRs).
            if [ -z "${FLEET_GITHUB_APP_ID:-}" ] || [ -z "${FLEET_GITHUB_APP_PRIVATE_KEY:-}" ] || [ -z "${FLEET_GITHUB_APP_INSTALLATION_ID:-}" ]; then
              echo "Skipping release-metadata: GitHub App credentials not present in this context."
              exit 0
            fi
            git fetch --no-tags https://github.com/Qredence/fleet-rlm.git main
            git checkout --detach FETCH_HEAD
            GH_TOKEN=$(python3.12 -m scripts.github_app_token --purpose read)
            export GH_TOKEN
            python - \<<'PYCODE'
            import os, re, subprocess
            url = os.environ.get("CIRCLE_PULL_REQUEST", "")
            match = re.fullmatch(r"https://github.com/Qredence/fleet-rlm/pull/([0-9]+)", url, re.I)
            if match is None:
                raise SystemExit("Missing trusted repository PR URL")
            subprocess.run(["python3.12", "-m", "scripts.release_draft", "validate", "--pr", match[1], "--repo", "Qredence/fleet-rlm"], check=True)
            PYCODE

  github-deployment:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    environment:
      FLEET_RELEASE_VERSION: << pipeline.parameters.release_version >>
      FLEET_RELEASE_SHA: << pipeline.parameters.release_sha >>
    steps:
      - setup-github-cli:
          with:
            version: "2.103.3"
      - checkout
      - run:
          name: Create exact-source GitHub deployment
          command: |
            set +x
            export PYENV_VERSION=3.12
            GH_TOKEN=$(python3.12 -m scripts.github_app_token --purpose publish)
            export GH_TOKEN
            python3.12 -m scripts.release_automation deployment-start --version "$FLEET_RELEASE_VERSION" --sha "$FLEET_RELEASE_SHA" --output github-deployment.json
      - run:
          name: Finalize a partially created GitHub deployment
          when: on_fail
          command: |
            set +x
            export PYENV_VERSION=3.12
            if [ -f github-deployment.json ]; then
              GH_TOKEN=$(python3.12 -m scripts.github_app_token --purpose publish)
              export GH_TOKEN
              python3.12 -m scripts.release_automation deployment-status --deployment github-deployment.json --state error --phase "GitHub deployment creation failed before package publication"
            fi
      - persist_to_workspace:
          root: .
          paths:
            - github-deployment.json

  github-deployment-failure:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - setup-github-cli:
          with:
            version: "2.103.3"
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Record failed publication or validation
          command: |
            set +x
            export PYENV_VERSION=3.12
            GH_TOKEN=$(python3.12 -m scripts.github_app_token --purpose publish)
            export GH_TOKEN
            if [ -f github-deployment.json ]; then
              python3.12 -m scripts.release_automation deployment-status --deployment github-deployment.json --state failure --phase "Publication, canary, validation, or GitHub release failed; inspect the linked workflow before recovery"
            fi

  release-draft:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - setup-github-cli:
          with:
            version: "2.103.3"
      - setup-python:
          python-version: "3.12"
          use-workspace-venv: true
      - run:
          name: Update the trusted main changelog draft
          command: |
            set +x
            export PYENV_VERSION=3.12
            GH_TOKEN=$(python3.12 -m scripts.github_app_token --purpose draft)
            export GH_TOKEN
            uv run --locked python -m scripts.release_draft update --sha "$CIRCLE_SHA1" --repo Qredence/fleet-rlm

  static-checks:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - setup-python:
          python-version: "3.12"
          use-workspace-venv: true
      - run:
          name: Lint, formatting, typing, docs, and API contract
          command: make lint format-check typecheck check-docs api-check

  test-python:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    resource_class: medium
    parallelism: 2
    steps:
      - setup-python:
          python-version: << parameters.python-version >>
      - run:
          name: Run full non-live suite split across executors
          command: |
            mkdir -p test-results
            if [ "<< parameters.python-version >>" = "3.11" ]; then
              mkdir -p "coverage-shards/node-${CIRCLE_NODE_INDEX}"
              : > "coverage-shards/node-${CIRCLE_NODE_INDEX}/test-files.txt"
              export FLEET_CI_COVERAGE=1
              set +e
              circleci testsuite run "ci tests" --run-tests=all --analyze-tests=none
              test_status=$?
              printf '%s\n' "$test_status" > "coverage-shards/node-${CIRCLE_NODE_INDEX}/test-status"
              exit 0
            else
              mkdir -p "coverage-shards/node-${CIRCLE_NODE_INDEX}"
              circleci testsuite run "ci tests" --run-tests=all --analyze-tests=none
            fi
      - store_test_results:
          path: test-results/junit
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: coverage-shards
          destination: coverage-shards
      - when:
          condition:
            equal: ["3.11", << parameters.python-version >>]
          steps:
            - persist_to_workspace:
                root: .
                paths:
                  - coverage-shards
      - when:
          condition:
            equal: ["3.11", << parameters.python-version >>]
          steps:
            - run:
                name: Preserve the Python 3.11 test result
                command: |
                  test_status=$(cat "coverage-shards/node-${CIRCLE_NODE_INDEX}/test-status")
                  exit "$test_status"

  coverage-report:
    docker:
      - image: cimg/python:3.11
    resource_class: medium
    steps:
      - setup-python:
          python-version: "3.11"
      - attach_workspace:
          at: .
      - run:
          name: Combine Python 3.11 shard coverage, export XML, and enforce the floor
          command: |
            set +e
            (
              set -eo pipefail
            mkdir -p coverage
            for node in 0 1; do
              shard="coverage-shards/node-${node}"
              test -s "${shard}/test-status"
              test -s "${shard}/test-files.txt"
              find "$shard" -maxdepth 1 -type f -name '.coverage.*' -print -quit | grep -q .
            done
            find tests -type f -name 'test_*.py' -print | LC_ALL=C sort > coverage/expected-tests.txt
            cat coverage-shards/node-0/test-files.txt coverage-shards/node-1/test-files.txt \
              | LC_ALL=C sort -u > coverage/selected-tests.txt
            diff -u coverage/expected-tests.txt coverage/selected-tests.txt
            uv run --locked coverage combine --keep --data-file=coverage/.coverage \
              coverage-shards/node-0 coverage-shards/node-1
            uv run --locked coverage xml --data-file=coverage/.coverage --fail-under=0 -o coverage/coverage.xml
            uv run --locked coverage report --data-file=coverage/.coverage
            )
            status=$?
            printf '%s\n' "$status" > coverage/.status
            exit 0
      - store_artifacts:
          path: coverage
          destination: coverage
      - persist_to_workspace:
          root: .
          paths:
            - coverage/coverage.xml
      - run:
          name: Enforce coverage-report result
          command: |
            status=$(cat coverage/.status 2>/dev/null || exit 1)
            exit "$status"

  list-smarter-tests:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Select Python 3.12 test atoms for dynamic parallelism
          command: circleci testsuite list-tests "ci tests" --key=ci-tests-parallelism-key

  test-python-312:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    parallelism: 2
    steps:
      - setup-python:
          python-version: "3.12"
          use-workspace-venv: true
      - run:
          name: Run impacted Python 3.12 tests or the full main-branch suite
          command: |
            mkdir -p test-results
            set +e
            circleci testsuite run "ci tests"
            status=$?
            printf '%s\n' "$status" > test-results/test-status
            exit 0
      - store_test_results:
          path: test-results/junit
      - store_artifacts:
          path: test-results
          destination: test-results
      - run:
          name: Preserve the Python 3.12 test result
          command: |
            status=$(cat test-results/test-status 2>/dev/null || exit 1)
            exit "$status"

  package-check:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - setup-python:
          python-version: "3.12"
          use-workspace-venv: true
      - run:
          name: Build and verify distributions, then smoke-test the wheel
          command: |
            version=$(uv run --locked python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
            FLEET_RELEASE_VERSION="$version" make build-release
            FLEET_RELEASE_VERSION="$version" make release-smoke
      - store_artifacts:
          path: dist
          destination: distributions

  security:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - setup-python:
          python-version: "3.12"
          use-workspace-venv: true
      - run:
          name: Audit locked runtime and development dependencies
          command: make check-security

  sonarqube:
    docker:
      - image: cimg/base:current
    resource_class: medium
    environment:
      SONAR_SCANNER_VERSION: "8.1.0.6389"
      SONAR_SCANNER_SHA256: "bb8f709f9cb73352f8d1260a3b3c506c0f41146754bc630762c126d795499d0b"
    steps:
      - checkout:
          method: full
      - attach_workspace:
          at: .
      - restore_cache:
          keys:
            - v1-sonar-scanner-{{ arch }}-8.1.0.6389
      - run:
          name: Install or reuse cached SonarScanner CLI
          command: |
            set -euo pipefail
            mkdir -p "$HOME/.cache/sonar"
            SCANNER_DIR="$HOME/.cache/sonar/sonar-scanner-${SONAR_SCANNER_VERSION}-linux-x64"
            if [ ! -x "$SCANNER_DIR/bin/sonar-scanner" ]; then
              echo "Downloading SonarScanner $SONAR_SCANNER_VERSION..."
              tmpdir=$(mktemp -d)
              trap 'rm -rf "$tmpdir"' EXIT
              archive="sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux-x64.zip"
              curl --fail --silent --show-error --location \
                "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/$archive" \
                --output "$tmpdir/$archive"
              printf '%s  %s\n' "$SONAR_SCANNER_SHA256" "$tmpdir/$archive" | sha256sum --check -
              unzip -q "$tmpdir/$archive" -d "$HOME/.cache/sonar"
            else
              echo "Using cached SonarScanner at $SCANNER_DIR"
            fi
            echo "export SCANNER_DIR=\"$SCANNER_DIR\"" >> "$BASH_ENV"
      - run:
          name: Analyze with SonarQube Cloud and require its quality gate
          command: |
            test -n "${SONAR_TOKEN:-}" || { echo "SONAR_TOKEN is required from the SonarCloud context." >&2; exit 1; }
            test -s coverage/coverage.xml
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --unshallow
            fi
            "${SCANNER_DIR}/bin/sonar-scanner"
      - save_cache:
          key: v1-sonar-scanner-{{ arch }}-8.1.0.6389
          paths:
            - ~/.cache/sonar

  quality-gate:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Required aggregate quality status
          command: echo "All CircleCI quality jobs passed."

  validate-release-request:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    environment:
      FLEET_RELEASE_VERSION: << pipeline.parameters.release_version >>
      FLEET_RELEASE_SHA: << pipeline.parameters.release_sha >>
    steps:
      - run:
          name: Validate workflow parameters and release branch
          command: |
            if [ "$CIRCLE_BRANCH" != main ]; then
              echo "Manual CI, Python 3.14, and releases are restricted to main." >&2
              exit 1
            fi
            if [ "<< pipeline.parameters.run_release >>" = true ] && [ "<< pipeline.parameters.run_python314 >>" = true ]; then
              echo "A release and the Python 3.14 probe cannot run together." >&2
              exit 1
            fi
            if [ "<< pipeline.parameters.run_pypi_recovery >>" = true ] && { [ "<< pipeline.parameters.run_release >>" = true ] || [ "<< pipeline.parameters.run_python314 >>" = true ]; }; then
              echo "PyPI recovery cannot run with a new release or the Python 3.14 probe." >&2
              exit 1
            fi
            if [ "<< pipeline.parameters.run_release >>" = true ] && { [ -z "$FLEET_RELEASE_VERSION" ] || [ -z "$FLEET_RELEASE_SHA" ]; }; then
              echo "Release version and source SHA are required." >&2
              exit 1
            fi

  python314-probe:
    docker:
      - image: cimg/python:3.14
    resource_class: medium
    steps:
      - checkout
      - install-uv
      - run:
          name: Probe locked dependencies and tests on Python 3.14 (informational)
          command: |
            set +e
            uv export --locked --all-groups --no-emit-project --format requirements.txt --output-file /tmp/fleet-requirements.txt
            status=$?
            if [ "$status" -eq 0 ]; then
              uv venv --python 3.14 /tmp/fleet-314
              status=$?
            fi
            if [ "$status" -eq 0 ]; then
              uv pip install --python /tmp/fleet-314/bin/python -r /tmp/fleet-requirements.txt
              status=$?
            fi
            if [ "$status" -eq 0 ]; then
              PYTHONPATH=src /tmp/fleet-314/bin/python -m pytest -q
              status=$?
            fi
            if [ "$status" -ne 0 ]; then
              echo "INFO: Python 3.14 probe did not pass (exit $status); this job is informational."
            fi
            exit 0

  release-preflight:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      FLEET_RELEASE_VERSION: << pipeline.parameters.release_version >>
      FLEET_RELEASE_SHA: << pipeline.parameters.release_sha >>
    steps:
      - setup-python:
          python-version: "3.12"
          use-cache: false
      - run:
          name: Validate release version, source SHA, and main branch
          command: |
            make check-release
            uv run --locked python -m scripts.release_automation registry-preflight --version "$FLEET_RELEASE_VERSION"

  validate-pypi-webhook-context:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Require the Smart Deployments webhook credential before publishing
          command: |
            if [ -z "${CIRCLECI_VALIDATION_WEBHOOK_TOKEN:-}" ]; then
              echo "CIRCLECI_VALIDATION_WEBHOOK_TOKEN is required for PyPI release validation." >&2
              exit 1
            fi

  build-release:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      FLEET_RELEASE_VERSION: << pipeline.parameters.release_version >>
      FLEET_RELEASE_SHA: << pipeline.parameters.release_sha >>
    steps:
      - setup-python:
          python-version: "3.12"
          use-cache: false
      - run:
          name: Build, verify, and checksum release distributions once
          command: make build-release
      - capture-release-metadata

  validate-pypi-recovery:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    environment:
      FLEET_RELEASE_VERSION: << pipeline.parameters.release_version >>
      FLEET_RELEASE_SHA: << pipeline.parameters.release_sha >>
    steps:
      - setup-python:
          python-version: "3.12"
          use-cache: false
      - run:
          name: Validate recovery request and published source commit
          command: |
            if [ "$CIRCLE_BRANCH" != main ]; then
              echo "Published PyPI recovery is restricted to main." >&2
              exit 1
            fi
            if [ -z "$FLEET_RELEASE_VERSION" ] || [ -z "$FLEET_RELEASE_SHA" ]; then
              echo "Recovery requires release_version and release_sha." >&2
              exit 1
            fi
            git fetch --no-tags origin "$FLEET_RELEASE_SHA"
            uv run --locked python scripts/release_checks.py recovery-preflight \
              --version "$FLEET_RELEASE_VERSION" \
              --sha "$FLEET_RELEASE_SHA" \
              --branch "$CIRCLE_BRANCH" \
              --pipeline-sha "$CIRCLE_SHA1"

  build-release-recovery:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      UV_PYTHON: "3.12"
      FLEET_RELEASE_VERSION: << pipeline.parameters.release_version >>
      FLEET_RELEASE_SHA: << pipeline.parameters.release_sha >>
    steps:
      - checkout
      - install-uv
      - run:
          name: Rebuild the published source with the current notes extractor
          command: |
            cp scripts/release_notes.py /tmp/fleet-release-notes.py
            git fetch --no-tags origin "$FLEET_RELEASE_SHA"
            git checkout --detach "$FLEET_RELEASE_SHA"
            uv sync --locked --dev --python 3.12
            make build-release
      - capture-release-metadata:
          notes-script: /tmp/fleet-release-notes.py

  plan-pypi-recovery:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    environment:
      FLEET_RELEASE_VERSION: << pipeline.parameters.release_version >>
    steps:
      - checkout
      - run:
          name: Track the canary retry as a separate PyPI deployment
          command: |
            python -m scripts.release_checks plan-deployment --version "$FLEET_RELEASE_VERSION" --plan fleet-rlm-pypi-recovery
            circleci run release update fleet-rlm-pypi-recovery --status=running
      - run:
          name: Mark failed PyPI recovery in CircleCI deployment tracking
          command: circleci run release update fleet-rlm-pypi-recovery --status=FAILED --failure-reason="PyPI recovery planning failed"
          when: on_fail

  publish-testpypi:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      FLEET_SKIP_TESTPYPI: << pipeline.parameters.skip_testpypi >>
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Verify and publish distributions to TestPyPI with OIDC
          command: |
            if [ "$FLEET_SKIP_TESTPYPI" = "true" ]; then
              echo "Skipping TestPyPI for this explicitly requested direct-to-PyPI release."
              exit 0
            fi
            cd dist
            sha256sum -c SHA256SUMS
            python -m pip install --disable-pip-version-check 'twine>=7.0.0,<8'
            TWINE_USERNAME=__token__ TWINE_PASSWORD="${TESTPYPI_API_TOKEN:?Restricted TestPyPI token required}" twine upload --non-interactive --repository testpypi fleet_rlm-*

  smoke-test-testpypi:
    parameters:
      release-version:
        type: string
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      FLEET_RELEASE_VERSION: << parameters.release-version >>
      FLEET_SKIP_TESTPYPI: << pipeline.parameters.skip_testpypi >>
    steps:
      - checkout
      - attach_workspace:
          at: .
      - install-uv
      - run:
          name: Export the locked runtime dependency set
          command: uv export --locked --no-dev --no-emit-project --format requirements.txt --python 3.12 --output-file /tmp/fleet-smoke-requirements.txt
      - run:
          name: Download TestPyPI wheel and verify it matches the built artifact
          command: |
            if [ "$FLEET_SKIP_TESTPYPI" = "true" ]; then
              echo "Skipping TestPyPI download for this explicitly requested direct-to-PyPI release."
              exit 0
            fi
            mkdir -p /tmp/fleet-testpypi
            env PIP_CONFIG_FILE=/dev/null PIP_EXTRA_INDEX_URL= python -m pip download --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --index-url https://test.pypi.org/simple --dest /tmp/fleet-testpypi "fleet-rlm==$FLEET_RELEASE_VERSION"
            built_wheel=$(basename dist/fleet_rlm-"$FLEET_RELEASE_VERSION"-*.whl)
            downloaded_wheel=$(basename /tmp/fleet-testpypi/fleet_rlm-"$FLEET_RELEASE_VERSION"-*.whl)
            expected=$(awk -v file="$built_wheel" '$2 == file {print $1}' dist/SHA256SUMS)
            test -n "$expected"
            printf '%s  %s\n' "$expected" "/tmp/fleet-testpypi/$downloaded_wheel" | sha256sum -c -
      - run:
          name: Smoke-test that exact TestPyPI wheel
          command: |
            if [ "$FLEET_SKIP_TESTPYPI" = "true" ]; then
              echo "No TestPyPI wheel was requested for this release."
              exit 0
            fi
            downloaded_wheel=$(find /tmp/fleet-testpypi -maxdepth 1 -name 'fleet_rlm-*.whl' -print -quit)
            uv run --locked -- python scripts/release_checks.py smoke --version "$FLEET_RELEASE_VERSION" --wheel "$downloaded_wheel" --requirements /tmp/fleet-smoke-requirements.txt

  publish-pypi:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      FLEET_RELEASE_VERSION: << pipeline.parameters.release_version >>
    steps:
      - checkout
      - install-uv
      - attach_workspace:
          at: .
      - run:
          name: Plan the PyPI deployment, publish the verified artifacts, and mark it running
          command: |
            cd dist
            sha256sum -c SHA256SUMS
            if [ -z "${PYPI_API_TOKEN:-}" ]; then
              echo "PYPI_API_TOKEN is required in the restricted PyPI upload context." >&2
              exit 1
            fi
            upload_env=$(mktemp -d)
            trap 'rm -rf "$upload_env"' EXIT
            uv venv --python 3.12 "$upload_env"
            uv pip install --python "$upload_env/bin/python" 'twine>=7.0.0,<8'
            cd ..
            "$upload_env/bin/python" -m scripts.release_checks plan-deployment --version "$FLEET_RELEASE_VERSION" --plan fleet-rlm-pypi
            cd dist
            TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_API_TOKEN" \
              timeout --signal=TERM --kill-after=30s 10m "$upload_env/bin/python" -m twine upload --non-interactive fleet_rlm-*
            circleci run release update fleet-rlm-pypi --status=running
      - run:
          name: Mark failed PyPI publication in CircleCI deployment tracking
          command: circleci run release update fleet-rlm-pypi --status=FAILED --failure-reason="PyPI publication step failed"
          when: on_fail

  pypi-canary:
    parameters:
      release-version:
        type: string
      release-plan-name:
        type: string
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      FLEET_RELEASE_VERSION: << parameters.release-version >>
      FLEET_RELEASE_SHA: << pipeline.parameters.release_sha >>
      FLEET_RELEASE_PLAN: << parameters.release-plan-name >>
      PYTHONUNBUFFERED: "1"
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Prepare and validate the exact PyPI artifact within fifteen minutes
          command: |
            set +e
            mkdir -p canary-results
            timeout --signal=TERM --kill-after=30s 15m bash -eo pipefail -c '
              bash .circleci/install-uv.sh
              export PATH="$HOME/.local/bin:$PATH"
              export UV_PYTHON=3.12
              uv run --locked --python 3.12 python -m scripts.release_checks canary-with-receipt \
                --version "$FLEET_RELEASE_VERSION" --sha "$FLEET_RELEASE_SHA" --plan "$FLEET_RELEASE_PLAN"
            ' 2>&1 | tee canary-results/pypi-canary.log
            status=${PIPESTATUS[0]}
            printf '%s\n' "$status" > canary-results/.status
            exit 0
      - store_artifacts:
          path: canary-results
          destination: pypi-canary
      - run:
          name: Enforce canary preparation result
          command: |
            status=$(cat canary-results/.status 2>/dev/null || exit 1)
            exit "$status"
      - run:
          name: Require matching canary evidence before promotion
          command: |
            python -m scripts.release_checks verify-canary \
              --version "$FLEET_RELEASE_VERSION" --sha "$FLEET_RELEASE_SHA" --plan "$FLEET_RELEASE_PLAN"
      - persist_to_workspace:
          root: .
          paths:
            - canary-results/receipt.json

  fail-pypi-canary:
    parameters:
      release-plan-name:
        type: string
    docker:
      - image: cimg/python:3.12
    resource_class: small
    environment:
      FLEET_RELEASE_VERSION: << pipeline.parameters.release_version >>
      FLEET_RELEASE_SHA: << pipeline.parameters.release_sha >>
      FLEET_RELEASE_PLAN: << parameters.release-plan-name >>
    steps:
      - checkout
      - run:
          name: Record failed or timed-out canary independently of its interpreter
          command: |
            python -m scripts.release_checks finalize-canary \
              --version "$FLEET_RELEASE_VERSION" --sha "$FLEET_RELEASE_SHA" --plan "$FLEET_RELEASE_PLAN"

  cancel-pypi-deployment:
    parameters:
      release-plan-name:
        type: string
    docker:
      - image: cimg/base:current
    resource_class: small
    environment:
      FLEET_RELEASE_PLAN: << parameters.release-plan-name >>
    steps:
      - run:
          name: Record canceled PyPI deployment
          command: circleci run release update "$FLEET_RELEASE_PLAN" --status=CANCELED

  release-validation:
    type: release
    plan_name: fleet-rlm-pypi
    validation: &pypi-validation
      enabled: true
      evaluation_time: 20m
      auto_rollback_on_failure: false
      webhooks:
        - name: pypi_canary
          provider: custom
          data_points:
            component_name: request.component_name
            version: request.version
            project_id: request.project_id
            env: request.env
            signal_name: request.signal_name
            criteria: request.alert_transition
          fail_when: 'criteria == "triggered"'
          max_failures: 1

  release-validation-recovery:
    type: release
    plan_name: fleet-rlm-pypi-recovery
    validation: *pypi-validation

  github-release:
    parameters:
      release-version:
        type: string
      release-sha:
        type: string
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      FLEET_RELEASE_VERSION: << parameters.release-version >>
      FLEET_RELEASE_SHA: << parameters.release-sha >>
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup-github-cli:
          with:
            version: "2.103.3"
      - run:
          name: Publish captured notes and verified assets or verify an exact retry
          command: |
            set +x
            export PYENV_VERSION=3.12
            GH_TOKEN=$(python3.12 -m scripts.github_app_token --purpose publish)
            export GH_TOKEN
            python -m scripts.github_release --version "$FLEET_RELEASE_VERSION" --sha "$FLEET_RELEASE_SHA"
            python3.12 -m scripts.release_automation deployment-status --deployment github-deployment.json --state success --phase "PyPI canary, Smart Deployment validation, and GitHub release completed"

  prep-venv-312:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - setup-python:
          python-version: "3.12"
          persist-venv: true

job-groups:
  publication:
    jobs:
      - validate-release-request:
          filters: pipeline.parameters.run_release or pipeline.parameters.run_python314 or pipeline.parameters.run_ci or pipeline.parameters.run_pypi_recovery
      - validate-pypi-webhook-context:
          context: fleet-pypi-validation-webhook
          filters: pipeline.parameters.run_release or pipeline.parameters.run_pypi_recovery
      - release-preflight:
          filters: pipeline.parameters.run_release
          requires:
            - validate-release-request
            - validate-pypi-webhook-context
      - build-release:
          filters: pipeline.parameters.run_release
          requires:
            - release-preflight
      - publish-testpypi:
          context: fleet-testpypi-upload-token
          filters: pipeline.parameters.run_release
          requires:
            - build-release
      - smoke-test-testpypi:
          release-version: << pipeline.parameters.release_version >>
          filters: pipeline.parameters.run_release
          requires:
            - publish-testpypi
      - github-deployment:
          context: fleet-github-release
          filters: pipeline.parameters.run_release
          requires:
            - smoke-test-testpypi
      - publish-pypi:
          context: fleet-pypi-upload-token
          filters: pipeline.parameters.run_release
          requires:
            - github-deployment
      - release-validation:
          filters: pipeline.parameters.run_release
          requires:
            - publish-pypi
      - pypi-canary:
          release-version: << pipeline.parameters.release_version >>
          release-plan-name: fleet-rlm-pypi
          context: fleet-pypi-validation-webhook
          filters: pipeline.parameters.run_release
          requires:
            - publish-pypi
      - github-release:
          release-version: << pipeline.parameters.release_version >>
          release-sha: << pipeline.parameters.release_sha >>
          context: fleet-github-release
          filters: pipeline.parameters.run_release
          requires:
            - release-validation
            - pypi-canary
      - validate-pypi-recovery:
          filters: pipeline.parameters.run_pypi_recovery
          requires:
            - validate-release-request
      - build-release-recovery:
          filters: pipeline.parameters.run_pypi_recovery
          requires:
            - validate-pypi-recovery
      - github-deployment:
          name: github-deployment-recovery
          context: fleet-github-release
          filters: pipeline.parameters.run_pypi_recovery
          requires:
            - build-release-recovery
      - plan-pypi-recovery:
          filters: pipeline.parameters.run_pypi_recovery
          requires:
            - github-deployment-recovery
            - validate-pypi-webhook-context
      - pypi-canary:
          name: pypi-canary-recovery
          release-version: << pipeline.parameters.release_version >>
          release-plan-name: fleet-rlm-pypi-recovery
          context: fleet-pypi-validation-webhook
          filters: pipeline.parameters.run_pypi_recovery
          requires:
            - build-release-recovery
            - plan-pypi-recovery
      - release-validation-recovery:
          filters: pipeline.parameters.run_pypi_recovery
          requires:
            - plan-pypi-recovery
      - github-release:
          name: github-release-recovery
          release-version: << pipeline.parameters.release_version >>
          release-sha: << pipeline.parameters.release_sha >>
          context: fleet-github-release
          filters: pipeline.parameters.run_pypi_recovery
          requires:
            - release-validation-recovery
            - pypi-canary-recovery
      - fail-pypi-canary:
          name: fail-pypi-canary
          release-plan-name: fleet-rlm-pypi
          context: fleet-pypi-validation-webhook
          filters: pipeline.parameters.run_release
          requires:
            - pypi-canary: [failed]
      - fail-pypi-canary:
          name: fail-pypi-canary-recovery
          release-plan-name: fleet-rlm-pypi-recovery
          context: fleet-pypi-validation-webhook
          filters: pipeline.parameters.run_pypi_recovery
          requires:
            - pypi-canary-recovery: [failed]
      - cancel-pypi-deployment:
          name: cancel-pypi-publication
          release-plan-name: fleet-rlm-pypi
          filters: pipeline.parameters.run_release
          requires:
            - publish-pypi: [canceled]
      - cancel-pypi-deployment:
          name: cancel-pypi-canary
          release-plan-name: fleet-rlm-pypi
          filters: pipeline.parameters.run_release
          requires:
            - pypi-canary: [canceled]
      - cancel-pypi-deployment:
          name: cancel-pypi-recovery
          release-plan-name: fleet-rlm-pypi-recovery
          filters: pipeline.parameters.run_pypi_recovery
          requires:
            - plan-pypi-recovery: [canceled]
      - cancel-pypi-deployment:
          name: cancel-pypi-canary-recovery
          release-plan-name: fleet-rlm-pypi-recovery
          filters: pipeline.parameters.run_pypi_recovery
          requires:
            - pypi-canary-recovery: [canceled]
      - github-deployment-failure:
          name: report-publish-pypi-failure
          context: fleet-github-release
          filters: pipeline.parameters.run_release
          requires:
            - publish-pypi: [failed, canceled]
      - github-deployment-failure:
          name: report-pypi-canary-failure
          context: fleet-github-release
          filters: pipeline.parameters.run_release
          requires:
            - pypi-canary: [failed, canceled]
      - github-deployment-failure:
          name: report-release-validation-failure
          context: fleet-github-release
          filters: pipeline.parameters.run_release
          requires:
            - release-validation: [failed, canceled]
      - github-deployment-failure:
          name: report-github-release-failure
          context: fleet-github-release
          filters: pipeline.parameters.run_release
          requires:
            - github-release: [failed, canceled]
      - github-deployment-failure:
          name: report-plan-pypi-recovery-failure
          context: fleet-github-release
          filters: pipeline.parameters.run_pypi_recovery
          requires:
            - plan-pypi-recovery: [failed, canceled]
      - github-deployment-failure:
          name: report-pypi-canary-recovery-failure
          context: fleet-github-release
          filters: pipeline.parameters.run_pypi_recovery
          requires:
            - pypi-canary-recovery: [failed, canceled]
      - github-deployment-failure:
          name: report-release-validation-recovery-failure
          context: fleet-github-release
          filters: pipeline.parameters.run_pypi_recovery
          requires:
            - release-validation-recovery: [failed, canceled]
      - github-deployment-failure:
          name: report-github-release-recovery-failure
          context: fleet-github-release
          filters: pipeline.parameters.run_pypi_recovery
          requires:
            - github-release-recovery: [failed, canceled]

workflows:
  required-ci:
    jobs:
      - prep-venv-312
      - release-metadata:
          context: fleet-release-metadata
          filters: pipeline.event.name == "pull_request" and pipeline.git.branch == "automation/release-draft"
      - static-checks:
          requires:
            - prep-venv-312
      - test-python:
          name: test-python-<< matrix.python-version >>
          matrix:
            parameters:
              python-version: ["3.11", "3.13"]
      - coverage-report:
          requires:
            - test-python-3.11: terminal
      - list-smarter-tests
      - test-python-312:
          requires:
            - list-smarter-tests
            - prep-venv-312
      - package-check:
          requires:
            - prep-venv-312
      - security:
          requires:
            - prep-venv-312
      - sonarqube:
          context: SonarCloud
          requires:
            - coverage-report
      - quality-gate:
          name: quality
          requires:
            - release-metadata: [success, not_run]
            - static-checks
            - test-python-3.11
            - coverage-report
            - test-python-312
            - test-python-3.13
            - package-check
            - security
            - sonarqube
      - publication:
          serial-group: << pipeline.project.slug >>/pypi-publication
          filters: pipeline.parameters.run_release or pipeline.parameters.run_pypi_recovery
          requires:
            - quality
      - release-draft:
          context: fleet-release-draft
          filters: pipeline.parameters.run_draft and not pipeline.parameters.run_release and not pipeline.parameters.run_pypi_recovery and pipeline.git.branch == "main" and pipeline.event.name == "push"
          requires:
            - quality
            - prep-venv-312

  python314-manual:
    when:
      and:
        - << pipeline.parameters.run_python314 >>
        - equal: ["main", << pipeline.git.branch >>]
    jobs:
      - validate-release-request
      - python314-probe:
          requires:
            - validate-release-request

experimental:
  dynamic-parallelism:
    test-python-312:
      key: ci-tests-parallelism-key
      min: 1
      max: 2
