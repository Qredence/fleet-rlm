version: 2.1

executors:
  python:
    docker:
      - image: cimg/python:3.13.11
    working_directory: ~/project
    environment:
      UV_CACHE_DIR: ~/.cache/uv

commands:
  install_uv:
    steps:
      - restore_cache:
          keys:
            - v1-uv-bin-{{ arch }}
      - run:
          name: Install uv (skip if cached)
          command: |
            if [ ! -f "$HOME/.local/bin/uv" ]; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
            fi
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - save_cache:
          key: v1-uv-bin-{{ arch }}
          paths:
            - ~/.local/bin/uv
            - ~/.local/bin/uvx

  restore_uv_cache:
    steps:
      - restore_cache:
          keys:
            - v1-uv-py313-{{ arch }}-{{ checksum "uv.lock" }}
            - v1-uv-py313-{{ arch }}-

  save_uv_cache:
    steps:
      - save_cache:
          key: v1-uv-py313-{{ arch }}-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv

  install_python_dependencies:
    steps:
      - install_uv
      - restore_uv_cache
      - run:
          name: Install Python dependencies
          no_output_timeout: 15m
          command: uv sync --all-extras --dev --python 3.13 --verbose

jobs:
  quality:
    executor: python
    resource_class: small
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Release and docs checks
          command: |
            make check-release
            make check-docs
      - run:
          name: Security checks
          command: make check-security
      - run:
          name: Python dependency check
          command: uvx deptry . --config pyproject.toml

  lint-typecheck:
    executor: python
    resource_class: small
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Ruff and ty
          command: |
            make lint
            make format-check
            make typecheck

  test-unit:
    executor: python
    resource_class: medium+
    parallelism: 4
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Run unit/contract atom subset (Smarter Testing)
          no_output_timeout: 10m
          command: |
            mkdir -p test-results
            circleci run testsuite "pytest-unit"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results/unit

  test-integration:
    executor: python
    resource_class: medium+
    parallelism: 2
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Run integration/e2e atom subset (Smarter Testing)
          no_output_timeout: 10m
          command: |
            mkdir -p test-results
            circleci run testsuite "pytest-integration"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results/integration

workflows:
  ci:
    jobs:
      - quality
      - lint-typecheck
      - test-unit
      - test-integration
