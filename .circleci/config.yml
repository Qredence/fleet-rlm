version: 2.1

setup: true

orbs:
  path-filtering: circleci/path-filtering@3.0

workflows:
  setup:
    jobs:
      - path-filtering/filter:
          name: detect-changes
          base-revision: main
          config-path: .circleci/continue-config.yml
          resource_class: small
          mapping: |
            backend/.* run-backend true
            frontend/.* run-frontend true
            (\.circleci/.*|Makefile|docker-compose\.yml|\.pre-commit-config\.yaml|\.python-version) run-all true
