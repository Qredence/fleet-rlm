version: 2.1

parameters:
  deploy_pypi:
    type: boolean
    default: false
  release_version:
    type: string
    default: ""

executors:
  python:
    docker:
      # The -node variant adds Node.js so openapi-typescript (npx) can run in
      # the same job as the python gates (api-check regenerates TUI types).
      - image: cimg/python:3.13.13-node
    working_directory: ~/project
    environment:
      UV_CACHE_DIR: ~/.cache/uv
  python-compat:
    parameters:
      image:
        type: string
    docker:
      - image: << parameters.image >>
    working_directory: ~/project
    environment:
      UV_CACHE_DIR: ~/.cache/uv
  node:
    docker:
      - image: cimg/node:22.23.2@sha256:7c78a95e25876729c2c9cada532b0636fd3ec7dbae922b3d90d83704f4c87639
    working_directory: ~/project

commands:
  install_uv:
    steps:
      - restore_cache:
          keys:
            - v1-uv-bin-{{ arch }}
      - run:
          name: Install uv (skip if cached)
          command: |
            if [ ! -f "$HOME/.local/bin/uv" ]; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
            fi
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - save_cache:
          key: v1-uv-bin-{{ arch }}
          paths:
            - ~/.local/bin/uv
            - ~/.local/bin/uvx

  restore_uv_cache:
    parameters:
      python_tag:
        type: string
        default: "py313"
    steps:
      - restore_cache:
          keys:
            - v1-uv-<< parameters.python_tag >>-{{ arch }}-{{ checksum "uv.lock" }}
            - v1-uv-<< parameters.python_tag >>-{{ arch }}-

  save_uv_cache:
    parameters:
      python_tag:
        type: string
        default: "py313"
    steps:
      - save_cache:
          key: v1-uv-<< parameters.python_tag >>-{{ arch }}-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv

  install_python_dependencies:
    parameters:
      python_version:
        type: string
        default: "3.13"
      python_tag:
        type: string
        default: "py313"
    steps:
      - install_uv
      - restore_uv_cache:
          python_tag: << parameters.python_tag >>
      - run:
          name: Install Python dependencies (<< parameters.python_version >>)
          no_output_timeout: 15m
          command: uv sync --all-extras --dev --python << parameters.python_version >> --verbose

jobs:
  quality:
    executor: python
    resource_class: small
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Release and docs checks
          command: |
            make check-release
            make check-docs
      - run:
          name: Security checks
          command: make check-security
      - run:
          name: Install TUI dependencies
          command: |
            corepack enable
            corepack prepare pnpm@10.33.2 --activate
            pnpm --dir tools/fleet-tui install --frozen-lockfile
      - run:
          name: API contract checks
          command: make api-check
      - run:
          name: Stream contract check
          command: make stream-check
      - run:
          name: Python dependency check
          command: uvx deptry . --config pyproject.toml

  lint-typecheck:
    executor: python
    resource_class: small
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Ruff and ty
          command: |
            make lint
            make format-check
            make typecheck

  test-unit:
    executor: python
    resource_class: medium+
    parallelism: 4
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Run unit/contract atom subset (Smarter Testing)
          no_output_timeout: 10m
          command: |
            mkdir -p test-results
            circleci run testsuite "pytest-unit"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results/unit

  test-e2e:
    executor: python
    resource_class: medium+
    parallelism: 2
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Run E2E atom subset (Smarter Testing)
          no_output_timeout: 10m
          command: |
            mkdir -p test-results
            circleci run testsuite "pytest-e2e"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results/e2e

  daytona-coverage:
    executor: python
    resource_class: medium+
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Run Daytona branch coverage gate
          no_output_timeout: 10m
          command: make test-daytona-cov
      - store_artifacts:
          path: .scratch/coverage
          destination: coverage/daytona

  # Opt-in deployment bridge for the existing GitHub Actions PyPI release.
  # Configure GITHUB_TOKEN in a CircleCI project/context with actions:write.
  deploy-pypi:
    executor: python
    resource_class: small
    steps:
      - checkout
      - install_uv
      - run:
          name: Validate PyPI deploy inputs
          command: |
            test -n "<< pipeline.parameters.release_version >>" || {
              echo "release_version must be supplied when enabling deploy_pypi" >&2
              exit 1
            }
            test -n "${GITHUB_TOKEN:-}" || {
              echo "GITHUB_TOKEN must be configured in the CircleCI project or context" >&2
              exit 1
            }
      - run:
          name: Plan a PyPI deploy
          command: |
            circleci run release plan \
              --environment-name="pypi" \
              --component-name="fleet-rlm" \
              --target-version="<< pipeline.parameters.release_version >>"
      - run:
          name: Trigger and wait for GitHub Actions release
          no_output_timeout: 45m
          command: |
            uv run python scripts/circleci_trigger_release.py \
              --version="<< pipeline.parameters.release_version >>" \
              --ref=main
      - run:
          name: Update deploy to SUCCESS
          command: circleci run release update --status=SUCCESS
          when: on_success
      - run:
          name: Update planned deploy to FAILED
          command: circleci run release update --status=FAILED
          when: on_fail

  python-compat:
    parameters:
      python_version:
        type: string
      python_tag:
        type: string
      image:
        type: string
    executor:
      name: python-compat
      image: << parameters.image >>
    resource_class: medium
    steps:
      - checkout
      - install_python_dependencies:
          python_version: << parameters.python_version >>
          python_tag: << parameters.python_tag >>
      - save_uv_cache:
          python_tag: << parameters.python_tag >>
      - run:
          name: Import and package validation
          command: |
            export FLEET_COMPAT_PYTHON=<< parameters.python_version >>
            uv run --python "<< parameters.python_version >>" python - \<<'PY'
            import dspy
            import fleet_rlm
            import os
            import sys

            expected = tuple(int(part) for part in os.environ["FLEET_COMPAT_PYTHON"].split("."))
            assert sys.version_info[:2] == expected, sys.version
            assert dspy.__version__.startswith("3.3."), dspy.__version__
            print("fleet_rlm", fleet_rlm.__version__)
            print("dspy", dspy.__version__)
            PY
      - run:
          name: Unit and contract tests
          no_output_timeout: 15m
          command: |
            env FLEET_DAYTONA_API_KEY= FLEET_OPENAI_API_KEY= FLEET_LLM_BASE_URL= FLEET_DATABASE_URL= \
              uv run --python "<< parameters.python_version >>" pytest \
              tests/unit/backend tests/contracts/backend -q \
              -m "not live_llm and not live_daytona and not benchmark and not db"

  tui:
    executor: node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: |
            corepack enable
            corepack prepare pnpm@10.33.2 --activate
      - run:
          name: Install TUI dependencies
          command: pnpm --dir tools/fleet-tui install --frozen-lockfile
      - run:
          name: TUI lint, type, and tests
          command: |
            pnpm --dir tools/fleet-tui run format:check
            pnpm --dir tools/fleet-tui run lint
            pnpm --dir tools/fleet-tui run typecheck
            pnpm --dir tools/fleet-tui test

workflows:
  ci:
    jobs:
      - quality
      - lint-typecheck
      - test-unit
      - test-e2e
      - daytona-coverage
      - python-compat:
          name: python-compat-311
          python_version: "3.11"
          python_tag: "py311"
          image: cimg/python:3.11.13
      - python-compat:
          name: python-compat-312
          python_version: "3.12"
          python_tag: "py312"
          image: cimg/python:3.12.11
      - python-compat:
          name: python-compat-313
          python_version: "3.13"
          python_tag: "py313"
          image: cimg/python:3.13.13
      - tui

  deploy-pypi:
    when: << pipeline.parameters.deploy_pypi >>
    jobs:
      - deploy-pypi:
          filters:
            branches:
              only: main
