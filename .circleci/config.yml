version: 2.1

parameters:
  deploy_pypi:
    type: boolean
    default: false
  release_version:
    type: string
    default: ""

executors:
  python:
    docker:
      # The -node variant adds Node.js so openapi-typescript (npx) can run in
      # the same job as the python gates (api-check regenerates TUI types).
      - image: cimg/python:3.13.13-node
    working_directory: ~/project
    environment:
      UV_CACHE_DIR: /home/circleci/.cache/uv
      UV_LOCKED: "true"
  python-compat:
    parameters:
      image:
        type: string
    docker:
      - image: << parameters.image >>
    working_directory: ~/project
    environment:
      UV_CACHE_DIR: /home/circleci/.cache/uv
      UV_LOCKED: "true"
  node:
    docker:
      - image: cimg/node:22.23.2@sha256:7c78a95e25876729c2c9cada532b0636fd3ec7dbae922b3d90d83704f4c87639
    working_directory: ~/project

commands:
  install_uv:
    steps:
      - restore_cache:
          keys:
            - v3-uv-bin-0.12.21-{{ arch }}
      - run:
          name: Install uv (skip if cached)
          command: |
            if [ ! -x "$HOME/.local/bin/uv" ] || [ "$("$HOME/.local/bin/uv" --version | cut -d ' ' -f 2)" != "0.12.21" ]; then
              curl -LsSf https://astral.sh/uv/0.12.21/install.sh | sh
            fi
            test "$("$HOME/.local/bin/uv" --version | cut -d ' ' -f 2)" = "0.12.21"
            "$HOME/.local/bin/uv" --version
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

  save_uv_binary_cache:
    steps:
      - save_cache:
          key: v3-uv-bin-0.12.21-{{ arch }}
          paths:
            - ~/.local/bin/uv
            - ~/.local/bin/uvx

  restore_uv_cache:
    parameters:
      python_tag:
        type: string
        default: "py313"
    steps:
      - restore_cache:
          keys:
            - v3-uv-0.12.21-<< parameters.python_tag >>-{{ arch }}-{{ checksum "uv.lock" }}
            - v3-uv-0.12.21-<< parameters.python_tag >>-{{ arch }}-

  save_uv_cache:
    parameters:
      python_tag:
        type: string
        default: "py313"
    steps:
      - save_cache:
          key: v3-uv-0.12.21-<< parameters.python_tag >>-{{ arch }}-{{ checksum "uv.lock" }}
          paths:
            - /home/circleci/.cache/uv

  install_python_dependencies:
    parameters:
      python_version:
        type: string
        default: "3.13"
      python_tag:
        type: string
        default: "py313"
    steps:
      - install_uv
      - restore_uv_cache:
          python_tag: << parameters.python_tag >>
      - run:
          name: Install Python dependencies (<< parameters.python_version >>)
          no_output_timeout: 15m
          command: uv sync --locked --all-extras --dev --python << parameters.python_version >>

  install_tui_dependencies:
    steps:
      - run:
          name: Enable corepack and record TUI runtime versions
          command: |
            corepack enable
            corepack prepare pnpm@12.6.0 --activate
            mkdir -p .scratch
            cd tools/fleet-tui
            { node --version; pnpm --version; } > ../../.scratch/pnpm-runtime
      - restore_cache:
          keys:
            - v2-pnpm-store-{{ arch }}-{{ checksum ".scratch/pnpm-runtime" }}-{{ checksum "tools/fleet-tui/pnpm-lock.yaml" }}
      - run:
          name: Install TUI dependencies
          working_directory: ~/project/tools/fleet-tui
          command: pnpm install --frozen-lockfile --store-dir ../../.scratch/pnpm-store
      - save_cache:
          key: v2-pnpm-store-{{ arch }}-{{ checksum ".scratch/pnpm-runtime" }}-{{ checksum "tools/fleet-tui/pnpm-lock.yaml" }}
          paths:
            - .scratch/pnpm-store

jobs:
  quality:
    executor: python
    resource_class: small
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_binary_cache
      - save_uv_cache
      - run:
          name: Release and docs checks
          no_output_timeout: 5m
          command: |
            make check-release
            make check-docs
      - run:
          name: Security checks
          no_output_timeout: 10m
          command: make check-security
      - install_tui_dependencies
      - run:
          name: API contract checks
          no_output_timeout: 5m
          command: make api-check
      - run:
          name: Stream contract check
          no_output_timeout: 5m
          command: make stream-check
      - run:
          name: Ownership and dependency boundary checks
          command: |
            make check-codebase-tree
            make check-dependency-boundaries
      - run:
          name: Python dependency check
          command: make check-deps

  lint-typecheck:
    executor: python
    resource_class: small
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Ruff and ty
          command: |
            make lint
            make format-check
            make typecheck

  test-unit:
    executor: python
    resource_class: medium
    parallelism: 4
    steps:
      - checkout
      - install_python_dependencies
      - save_uv_cache
      - run:
          name: Run unit/contract atom subset (Smarter Testing)
          no_output_timeout: 10m
          command: |
            mkdir -p test-results
            circleci testsuite run "pytest-unit"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results/unit
      - persist_to_workspace:
          root: .scratch/coverage
          paths:
            - ".coverage.*"

  # Combines the per-shard coverage data produced by test-unit and enforces
  # the repository coverage floor (75%) once, instead of re-running the whole
  # offline suite serially in a dedicated container for the same measurement.
  coverage-gate:
    executor: python
    resource_class: small
    steps:
      - checkout
      - install_uv
      - run:
          name: Install locked coverage tooling only
          command: |
            COVERAGE_VERSION=$(python -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "coverage"))')
            uv venv .scratch/coverage-venv --python 3.13
            uv pip install --python .scratch/coverage-venv/bin/python "coverage==$COVERAGE_VERSION"
      - attach_workspace:
          at: .scratch/coverage
      - run:
          name: Combine shard coverage and enforce floor
          no_output_timeout: 5m
          command: |
            .scratch/coverage-venv/bin/coverage combine --rcfile=pyproject.toml --keep .scratch/coverage
            .scratch/coverage-venv/bin/coverage report --rcfile=pyproject.toml --show-missing > coverage-report.txt || {
              cat coverage-report.txt
              exit 1
            }
            tail -5 coverage-report.txt
      - store_artifacts:
          path: coverage-report.txt
          destination: coverage/combined-report.txt

  # Opt-in deployment bridge for the existing GitHub Actions PyPI release.
  # Configure GITHUB_TOKEN in a CircleCI project/context with actions:write.
  deploy-pypi:
    executor: python
    resource_class: small
    steps:
      - checkout
      - install_uv
      - run:
          name: Validate PyPI deploy inputs
          command: |
            test -n "<< pipeline.parameters.release_version >>" || {
              echo "release_version must be supplied when enabling deploy_pypi" >&2
              exit 1
            }
            export RELEASE_VERSION="<< pipeline.parameters.release_version >>"
            python - \<<'PY'
            import os
            import tomllib

            requested = os.environ["RELEASE_VERSION"].removeprefix("v")
            with open("pyproject.toml", "rb") as handle:
                project_version = tomllib.load(handle)["project"]["version"]
            if project_version != requested:
                raise SystemExit(
                    f"release_version {requested!r} does not match pyproject.toml {project_version!r}"
                )
            print(f"Preparing fleet-rlm {project_version} for the PyPI deployment bridge")
            PY
      - run:
          name: Plan a PyPI deploy
          command: |
            circleci run release plan pypi-publish \
              --environment-name="pypi" \
              --component-name="fleet-rlm" \
              --target-version="<< pipeline.parameters.release_version >>"
      - run:
          name: Mark PyPI publish as running
          command: circleci run release update pypi-publish --status=RUNNING
      - run:
          name: Trigger and wait for GitHub Actions release
          no_output_timeout: 45m
          command: |
            uv run --no-project python scripts/circleci_trigger_release.py \
              --version="<< pipeline.parameters.release_version >>" \
              --repository=Qredence/fleet-rlm \
              --ref=main \
              --expected-sha="$(git rev-parse HEAD)"
      - run:
          name: Update deploy to SUCCESS
          command: circleci run release update pypi-publish --status=SUCCESS
          when: on_success
      - run:
          name: Update planned deploy to FAILED
          command: circleci run release update pypi-publish --status=FAILED
          when: on_fail

  cancel-deploy-pypi:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Update planned PyPI publish to CANCELED
          command: circleci run release update pypi-publish --status=CANCELED

  python-compat:
    parameters:
      python_version:
        type: string
      python_tag:
        type: string
      image:
        type: string
    executor:
      name: python-compat
      image: << parameters.image >>
    resource_class: medium
    steps:
      - checkout
      - install_python_dependencies:
          python_version: << parameters.python_version >>
          python_tag: << parameters.python_tag >>
      - save_uv_cache:
          python_tag: << parameters.python_tag >>
      - run:
          name: Import and package validation
          command: |
            export FLEET_COMPAT_PYTHON=<< parameters.python_version >>
            uv run --python "<< parameters.python_version >>" python - \<<'PY'
            import dspy
            import fleet_rlm
            import os
            import sys

            expected = tuple(int(part) for part in os.environ["FLEET_COMPAT_PYTHON"].split("."))
            assert sys.version_info[:2] == expected, sys.version
            assert dspy.__version__ == "3.4.0", dspy.__version__
            print("fleet_rlm", fleet_rlm.__version__)
            print("dspy", dspy.__version__)
            PY
      - run:
          name: Unit and contract tests
          no_output_timeout: 15m
          command: |
            mkdir -p test-results
            circleci testsuite run "pytest-compat"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results/compat

  tui:
    executor: node
    resource_class: small
    steps:
      - checkout
      - install_tui_dependencies
      - run:
          name: TUI lint, type, and tests
          working_directory: ~/project/tools/fleet-tui
          command: |
            pnpm run format:check
            pnpm run lint
            pnpm run typecheck
            pnpm test

workflows:
  ci:
    jobs:
      - quality
      - lint-typecheck
      - test-unit
      - coverage-gate:
          requires:
            - test-unit
      - python-compat:
          name: python-compat-311
          python_version: "3.11"
          python_tag: "py311"
          image: cimg/python:3.11.13
      - python-compat:
          name: python-compat-312
          python_version: "3.12"
          python_tag: "py312"
          image: cimg/python:3.12.11
      - python-compat:
          name: python-compat-313
          python_version: "3.13"
          python_tag: "py313"
          image: cimg/python:3.13.13
      - tui
      - deploy-pypi:
          requires:
            - quality
            - lint-typecheck
            - test-unit
            - coverage-gate
            - python-compat-311
            - python-compat-312
            - python-compat-313
            - tui
          filters: pipeline.parameters.deploy_pypi and pipeline.git.branch == "main"
      - cancel-deploy-pypi:
          requires:
            - deploy-pypi:
                - canceled
          filters: pipeline.parameters.deploy_pypi and pipeline.git.branch == "main"
