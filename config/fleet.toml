# Fleet non-secret process defaults. Environment/.env override this file.
# Values are a provisional baseline, not performance-tuned defaults.
# Credentials: DATABRICKS_TOKEN, FLEET_DAYTONA_API_KEY,
# FLEET_TYPESAFE_API_KEY and FLEET_DATABASE_URL belong in .env/environment.
[config]
schema_version = 3

[runtime]
execution_mode = "hybrid"
turn_timeout_seconds = 900
max_llm_calls_per_turn = 150
max_agent_depth = 3
max_child_sandboxes = 8
max_active_children = 4
max_active_sessions = 64
linked_children = true

# Native lm15 is fixed. Omitted max_tokens/temperature remain provider-controlled.
[llm.root]
model = "openai/system.ai.deepseek-v4-1-flash"
num_retries = 3
cache = false

[llm.sub]
model = "openai/system.ai.deepseek-v4-1-flash"
num_retries = 3
cache = false

[llm.reflection]
model = "openai/system.ai.deepseek-v4-1-flash"
num_retries = 3
cache = false

[gateway]
# host/base_url may be set here or via DATABRICKS_HOST/FLEET_LLM_BASE_URL.

[decision]
model = "jev-1.14.0"

[daytona]
snapshot = "fleet-rlm-base"
auto_stop_minutes = 30
shared_notes_subpath = "shared/learned-notes"
# Set org_id/volume_id here or FLEET_DAYTONA_ORG_ID/FLEET_DAYTONA_VOLUME_ID.
# The historical volume_name = "fleet-rlm-architecture" was NOT a Volume ID.

[storage]
max_upload_bytes = 25000000
compiled_program_dir = ".fleet/compiled"
local_skills_dir = ".fleet/skills"

[mlflow]
tracking_uri = "sqlite:///mlflow.db"
experiment_name = "fleet-rlm-production"
# Keep evaluation traces separate; set eval_experiment_name when evaluating.

[evaluation]
# Omitted judge_model uses the validated environment override or built-in default.
# Verify an accessible judge endpoint before running judge-based evaluation.

[server]
host = "127.0.0.1"
port = 8000
allow_non_loopback_bind = false
