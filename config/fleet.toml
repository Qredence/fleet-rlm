[config]
schema_version = 1
default_profile = "daytona-recursive"

[defaults.application]
name = "fleet-rlm"

[defaults.runtime]
environment = "daytona"
live_enabled = true
turn_timeout_seconds = 1800
max_active_daytona_leases = 8
heartbeat_seconds = 10
stale_after_seconds = 60

# Root and Sub both run the Modal-hosted GLM-5.3-Flash. Z.AI's chat completion
# API reference (docs.z.ai/api-reference/llm/chat-completion) documents a
# maximum output length of 128K tokens for GLM-5.3-Flash (and recommends at
# least 1024), so both roles use the documented 131,072-token output ceiling;
# it sits well inside the endpoint's 1,048,576-token context for any Fleet
# prompt, and Fleet's character-level output caps bound what is retained.
[defaults.llm.root]
model = "openai/zai-org/GLM-5.3-Flash"
api_key_env = "FLEET_MODAL_API_KEY"
base_url_env = "FLEET_MODAL_BASE_URL"
max_tokens = 131072
timeout_seconds = 300
cache = false

[defaults.llm.sub]
model = "openai/zai-org/GLM-5.3-Flash"
api_key_env = "FLEET_MODAL_API_KEY"
base_url_env = "FLEET_MODAL_BASE_URL"
max_tokens = 131072
timeout_seconds = 90
temperature = 0
cache = false

# Recursive harness limits: one native child level (depth is a fixed
# execution invariant, not a policy knob) with four reserved child calls per
# Turn, a 50,000-character delegated prompt bound, and at most five child
# workers concurrently.
[defaults.rlm]
max_iters = 20
max_llm_calls = 50
max_output_chars = 10000
max_execution_output_chars = 4000
execution_timeout_s = 300
wrap_up_seconds = 300
recursion_enabled = true
recursion_max_calls = 4
recursion_max_prompt_chars = 50000
recursion_child_max_iters = 8
recursion_child_max_llm_calls = 12
recursion_child_max_output_chars = 4000
recursion_max_parallel_children = 5
autonomous_memory_categories = []
verbose = true

[defaults.storage]
data_root = ".fleet_rlm"
max_upload_bytes = 10485760
max_url_bytes = 10485760
max_artifact_bytes = 10485760
database_url_env = "FLEET_DATABASE_URL"

[defaults.daytona]
api_key_env = "FLEET_DAYTONA_API_KEY"
snapshot = "fleet-rlm-python313-v5"
volume_name = "fleet-volume"
volume_mount_path = "/home/daytona/fleet"

[defaults.logging]
level = "INFO"

[defaults.mlflow]
tracing_enabled = true
tracking_uri = "http://127.0.0.1:5001"
experiment_name = "fleet-rlm"
expose_trace_id = true
async_logging = true
trace_sampling_ratio = 1.0
trace_content_max_chars = 10000

[defaults.posthog]
enabled = true
project_token_env = "POSTHOG_PROJECT_TOKEN"
host = "https://eu.i.posthog.com"

# The committed policy is [defaults] itself: recursive child RLMs (one native
# depth), DSPy verbose host logging, local MLflow tracing, and the Root/Sub
# model pair above. The profile table stays empty because the schema requires
# at least one profile; everything a profile would override already lives in
# [defaults].
[profiles.daytona-recursive]
