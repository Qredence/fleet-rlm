[config]
schema_version = 1
default_profile = "daytona-recursive"

[defaults.application]
name = "fleet-rlm"

[defaults.runtime]
environment = "daytona"
live_enabled = true
turn_timeout_seconds = 1800
max_active_daytona_leases = 8
heartbeat_seconds = 10
stale_after_seconds = 60

# Shared provider and baseline role limits.
[defaults.llm.root]
model = "openai/zai-org/GLM-5.3-Flash"
api_key_env = "FLEET_MODAL_API_KEY"
base_url_env = "FLEET_MODAL_BASE_URL"
max_tokens = 8000
cache = false

[defaults.llm.sub]
model = "openai/zai-org/GLM-5.3-Flash"
api_key_env = "FLEET_MODAL_API_KEY"
base_url_env = "FLEET_MODAL_BASE_URL"
max_tokens = 8000
cache = false

[defaults.rlm]
max_iters = 20
max_llm_calls = 50
max_output_chars = 10000
max_execution_output_chars = 4000
execution_timeout_s = 300
wrap_up_seconds = 300
recursion_enabled = true
recursion_max_calls = 4
recursion_max_prompt_chars = 50000
recursion_child_max_iters = 8
recursion_child_max_llm_calls = 12
recursion_child_max_output_chars = 4000
recursion_max_parallel_children = 5
autonomous_memory_categories = []
verbose = true

[defaults.storage]
data_root = ".fleet_rlm"
max_upload_bytes = 10485760
max_url_bytes = 10485760
max_artifact_bytes = 10485760
database_url_env = "FLEET_DATABASE_URL"

[defaults.daytona]
api_key_env = "FLEET_DAYTONA_API_KEY"
snapshot = "fleet-rlm-python313-v5"
volume_name = "fleet-volume"
volume_mount_path = "/home/daytona/fleet"

[defaults.logging]
level = "INFO"

[defaults.mlflow]
tracing_enabled = true
expose_trace_id = true
async_logging = true
trace_sampling_ratio = 1.0
trace_content_max_chars = 10000

[defaults.posthog]
enabled = true
project_token_env = "POSTHOG_PROJECT_TOKEN"
host = "https://eu.i.posthog.com"

[profiles.daytona.llm.root]
max_tokens = 16000
reasoning_effort = "low"

[profiles.daytona.llm.sub]
max_tokens = 16000
reasoning_effort = "low"

[profiles.daytona.mlflow]
tracking_uri = "http://127.0.0.1:5001"
experiment_name = "fleet-rlm"

[profiles.daytona-recursive.llm.root]
max_tokens = 32768
timeout_seconds = 300

[profiles.daytona-recursive.llm.sub]
max_tokens = 4000
timeout_seconds = 90
temperature = 0

[profiles.daytona-recursive.mlflow]
tracking_uri = "http://127.0.0.1:5001"
experiment_name = "fleet-rlm"

[profiles.daytona-recursive.rlm]
recursion_enabled = true

[profiles.daytona-managed.llm.root]
reasoning_effort = "low"
cache = true

[profiles.daytona-managed.llm.sub]
temperature = 0
reasoning_effort = "low"
cache = true

[profiles.daytona-managed.mlflow]
tracing_enabled = true
tracking_uri = "databricks"
experiment_name_env = "FLEET_MLFLOW_EXPERIMENT_NAME"
trace_catalog_env = "FLEET_MLFLOW_TRACE_CATALOG"
trace_schema_env = "FLEET_MLFLOW_TRACE_SCHEMA"
trace_table_prefix_env = "FLEET_MLFLOW_TRACE_TABLE_PREFIX"
tracing_sql_warehouse_id_env = "FLEET_MLFLOW_TRACING_SQL_WAREHOUSE_ID"

# Prime Oolong benchmark profile.
[profiles.daytona-bench.mlflow]
tracing_enabled = false

[profiles.daytona-bench.posthog]
enabled = false

[profiles.daytona-bench.rlm]
verbose = false

# Same benchmark with a 40-iteration RLM loop.
[profiles.daytona-bench-40.mlflow]
tracing_enabled = false

[profiles.daytona-bench-40.posthog]
enabled = false

[profiles.daytona-bench-40.rlm]
max_iters = 40
