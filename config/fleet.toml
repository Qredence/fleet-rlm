[config]
schema_version = 1
# The committed policy is [defaults] itself; profiles override only deployment-specific values.
default_profile = "daytona-recursive"

[defaults.application]
name = "fleet-rlm"

[defaults.runtime]
variant = "legacy"
environment = "daytona"
live_enabled = true
turn_timeout_seconds = 1800
max_active_daytona_leases = 8
heartbeat_seconds = 10
stale_after_seconds = 60

# Root and Sub use the selected Databricks Unity AI Gateway Chat Completions
# endpoint. Keep the deliberately bounded 16,384-token role limit; Fleet's
# character-level output caps independently bound retained output.
[defaults.llm.root]
model = "databricks-deepseek-v4-flash-0731"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_LLM_BASE_URL"
max_tokens = 16384
timeout_seconds = 300
num_retries = 1
cache = false

[defaults.llm.sub]
model = "databricks-deepseek-v4-flash-0731"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_LLM_BASE_URL"
max_tokens = 16384
timeout_seconds = 90
temperature = 0
num_retries = 1
cache = false

# Recursive child RLMs are opt-in. P4.6 (2026-09-12) disabled them by default
# after the 144-trial ablation failed the retain gates. Native llm_query
# remains the semantic delegation path. Depth is a fixed execution invariant
# (not a policy knob) when an explicit profile re-enables recursion.
[defaults.rlm]
max_iters = 12
max_llm_calls = 32
max_provider_attempts = 2048
max_tool_calls = 256
max_output_chars = 6000
max_execution_output_chars = 4000
max_execution_output_bytes = 2000000
execution_timeout_s = 300
wrap_up_seconds = 300
finalization_attempts = 2
recursion_enabled = false
recursion_max_calls = 4
recursion_max_prompt_chars = 50000
recursion_child_max_iters = 8
recursion_child_max_llm_calls = 12
recursion_child_max_output_chars = 4000
recursion_max_parallel_children = 4
autonomous_memory_categories = []
verbose = true

[defaults.storage]
data_root = ".fleet_rlm"
max_upload_bytes = 10485760
max_url_bytes = 10485760
max_artifact_bytes = 10485760
database_url_env = "FLEET_DATABASE_URL"

[defaults.daytona]
api_key_env = "FLEET_DAYTONA_API_KEY"
snapshot_env = "FLEET_DAYTONA_SNAPSHOT"
child_snapshot_env = "FLEET_DAYTONA_CHILD_SNAPSHOT"
org_id_env = "FLEET_DAYTONA_ORG_ID"
volume_name = "fleet-volume"
volume_mount_path = "/home/daytona/fleet"
warm_pool_enabled = false
warm_pool_size = 0
# Set only when an operator has chosen the provider target for an explicit capacity campaign.
warm_pool_region = ""

[defaults.logging]
level = "INFO"

[defaults.mlflow]
tracing_enabled = true
tracking_uri = "http://127.0.0.1:5001"
experiment_name = "fleet-rlm"
experiment_purpose = "runtime"
expose_trace_id = true
async_logging = true
trace_sampling_ratio = 1.0
trace_content_max_chars = 10000
trace_content_enabled = true
trace_export_queue_size = 128
trace_export_workers = 2
trace_export_retry_seconds = 10
http_request_timeout_seconds = 10
trace_shutdown_seconds = 5.0

[defaults.posthog]
enabled = true
project_token_env = "POSTHOG_PROJECT_TOKEN"
host = "https://eu.i.posthog.com"

# The local/disposable profile inherits the complete default policy: native
# DSPy RLM with llm_query only, DSPy verbose host logging, local MLflow tracing,
# and the Root/Sub model pair above. Fleet child RLMs stay available when an
# explicit profile sets rlm.recursion_enabled. The managed profile below
# overrides only the production database contract.
[profiles.daytona-recursive]

# Explicit, non-default policy for the retained Phase 4 four-arm certification.
# It preserves the configured provider model and deterministic child decoding,
# while making every admitted trial small enough for the US$50 fail-closed
# envelope. Operators must select it explicitly; it is not a production default.
[profiles.phase4-campaign.llm.root]
max_tokens = 1024
temperature = 0
num_retries = 0
timeout_seconds = 90

[profiles.phase4-campaign.llm.sub]
max_tokens = 512
num_retries = 0
temperature = 0

[profiles.phase4-campaign.rlm]
max_iters = 6
max_llm_calls = 8
max_provider_attempts = 8
execution_timeout_s = 90
wrap_up_seconds = 30
recursion_enabled = true
recursion_max_calls = 4
recursion_child_max_iters = 4
recursion_child_max_llm_calls = 4
recursion_child_max_output_chars = 2000
recursion_max_parallel_children = 4

[profiles.phase4-campaign.runtime]
# The Turn's root lease consumes one permit; leave room for all four
# concurrent recursive child leases used by the campaign arms.
max_active_daytona_leases = 5
turn_timeout_seconds = 90

# Arm A: direct-answer baseline without Fleet recursion. Tight Root budgets
# approximate the historical direct-DSPy ablation on identical API transport.
[profiles.phase4-campaign-a.llm.root]
max_tokens = 1024
temperature = 0
num_retries = 0
timeout_seconds = 90

[profiles.phase4-campaign-a.llm.sub]
max_tokens = 512
num_retries = 0
temperature = 0

[profiles.phase4-campaign-a.rlm]
max_iters = 2
max_llm_calls = 2
max_provider_attempts = 2
execution_timeout_s = 90
wrap_up_seconds = 30
recursion_enabled = false

[profiles.phase4-campaign-a.runtime]
max_active_daytona_leases = 1
turn_timeout_seconds = 90

# Arm B: native RLM with llm_query only and no Fleet recursion. The Root
# budget matches the campaign profile so the arm comparison isolates
# recursive delegation rather than the iteration allowance.
[profiles.phase4-campaign-b.llm.root]
max_tokens = 1024
temperature = 0
num_retries = 0
timeout_seconds = 90

[profiles.phase4-campaign-b.llm.sub]
max_tokens = 512
num_retries = 0
temperature = 0

[profiles.phase4-campaign-b.rlm]
max_iters = 6
max_llm_calls = 8
max_provider_attempts = 8
execution_timeout_s = 90
wrap_up_seconds = 30
recursion_enabled = false

[profiles.phase4-campaign-b.runtime]
max_active_daytona_leases = 1
turn_timeout_seconds = 90

# Explicit managed-production profile. Keep the local/disposable profile above
# as the default until the Lakebase maintenance-window rehearsal and native
# containment gates are complete; operators select this profile by changing
# [config] default_profile in the deployment artifact.
[profiles.daytona-managed.storage]
database_url_env = "FLEET_DATABASE_URL"
