[config]
schema_version = 1

[defaults.application]
name = "fleet-rlm"

[defaults.runtime]
turn_timeout_seconds = 1800
max_active_daytona_leases = 8
heartbeat_seconds = 10
stale_after_seconds = 60

[defaults.llm.root]
model = 'openai/deepseek-v4-flash-free'
api_key_env = "FLEET_LLM_API_KEY"
cache = true
num_retries = 3

[defaults.llm.sub]
model = 'openai/deepseek-v4-flash-free'
api_key_env = "FLEET_LLM_API_KEY"
cache = true
num_retries = 3

[defaults.rlm]
max_iterations = 20
max_llm_calls = 50
max_output_chars = 10000
verbose = true

[defaults.storage]
data_root = ".fleet_rlm"
max_upload_bytes = 10485760
max_artifact_bytes = 10485760
database_url_env = "FLEET_DATABASE_URL"

[defaults.daytona]
api_key_env = "FLEET_DAYTONA_API_KEY"
volume_name = "fleet-volume"
volume_mount_path = "/home/daytona/fleet"

[defaults.logging]
level = "INFO"

[profiles.local-deno.runtime]
environment = "deno"

[profiles.daytona.runtime]
environment = "daytona"

[profiles.daytona.daytona]
snapshot = "fleet-rlm-python313-v4"

[profiles.daytona.llm.root]
model = "uscentral.default.deepseek-v4-flash"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
cache = true
num_retries = 3

[profiles.daytona.llm.sub]
model = "uscentral.default.deepseek-v4-flash"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
cache = true
num_retries = 3

[profiles.daytona.mlflow]
tracing_enabled = true
tracking_uri = "databricks"
experiment_name_env = "FLEET_MLFLOW_EXPERIMENT_NAME"
trace_catalog_env = "FLEET_MLFLOW_TRACE_CATALOG"
trace_schema_env = "FLEET_MLFLOW_TRACE_SCHEMA"
trace_table_prefix_env = "FLEET_MLFLOW_TRACE_TABLE_PREFIX"
tracing_sql_warehouse_id_env = "FLEET_MLFLOW_TRACING_SQL_WAREHOUSE_ID"

# Databricks-hosted profile: AI Gateway routes both roles through the unified
# /ai-gateway/openai/v1 endpoint. Set DATABRICKS_TOKEN in .env or process env.
[profiles.databricks-daytona.runtime]
environment = "daytona"

[profiles.databricks-daytona.daytona]
snapshot = "fleet-rlm-python313-v4"

# DeepSeek is used for both live RLM roles because it supports Fleet's native
# structured action contract. Frontier models remain offline-GEPA only.
[profiles.databricks-daytona.llm.root]
model = "uscentral.default.deepseek-v4-flash"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
cache = true
num_retries = 3

# Bounded semantic analysis sub model.
[profiles.databricks-daytona.llm.sub]
model = "uscentral.default.deepseek-v4-flash"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
cache = true
num_retries = 3

[profiles.databricks-daytona.mlflow]
tracing_enabled = true
tracking_uri = "databricks"
experiment_name_env = "FLEET_MLFLOW_EXPERIMENT_NAME"
trace_catalog_env = "FLEET_MLFLOW_TRACE_CATALOG"
trace_schema_env = "FLEET_MLFLOW_TRACE_SCHEMA"
trace_table_prefix_env = "FLEET_MLFLOW_TRACE_TABLE_PREFIX"
tracing_sql_warehouse_id_env = "FLEET_MLFLOW_TRACING_SQL_WAREHOUSE_ID"
