[config]
schema_version = 1
default_profile = "daytona"

[defaults.application]
name = "fleet-rlm"

[defaults.runtime]
turn_timeout_seconds = 1800
max_active_daytona_leases = 8
heartbeat_seconds = 10
stale_after_seconds = 60

[defaults.llm.root]
model = 'openai/deepseek-v4-flash-free'
api_key_env = "FLEET_LLM_API_KEY"
cache = true
num_retries = 3

[defaults.llm.sub]
model = 'openai/deepseek-v4-flash-free'
api_key_env = "FLEET_LLM_API_KEY"
cache = true
num_retries = 3

[defaults.rlm]
max_iterations = 20
max_llm_calls = 50
max_output_chars = 10000
max_execution_output_chars = 4000
execution_timeout_s = 120
verbose = true

[defaults.storage]
data_root = ".fleet_rlm"
max_upload_bytes = 10485760
max_artifact_bytes = 10485760
database_url_env = "FLEET_DATABASE_URL"

[defaults.daytona]
api_key_env = "FLEET_DAYTONA_API_KEY"
snapshot = "fleet-rlm-python313-v4"
volume_name = "fleet-volume"
volume_mount_path = "/home/daytona/fleet"

[defaults.logging]
level = "INFO"

[profiles.local-deno.runtime]
environment = "deno"

[profiles.daytona.runtime]
environment = "daytona"

[profiles.daytona.llm.root]
model = "uscentral.default.inkling"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
max_tokens = 8000
reasoning_effort = "none"

[profiles.daytona.llm.sub]
model = "uscentral.ai_gateway.databricks-qwen35-122b-a10b"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
max_tokens = 8000
temperature = 0
reasoning_effort = "none"

[profiles.daytona.mlflow]
tracing_enabled = true
tracking_uri = "http://127.0.0.1:5001"
experiment_name = "fleet-rlm"

# Official Oolong benchmark profiles: cache must be disabled because multiple
# questions reuse one context window.  MLflow is intentionally omitted.
[profiles.daytona-bench.runtime]
environment = "daytona"

[profiles.daytona-bench.llm.root]
model = "databricks-qwen35-122b-a10b"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
max_tokens = 8000
cache = false

[profiles.daytona-bench.llm.sub]
model = "databricks-qwen35-122b-a10b"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
max_tokens = 8000
cache = false

[profiles.daytona-bench-40.runtime]
environment = "daytona"

[profiles.daytona-bench-40.llm.root]
model = "databricks-qwen35-122b-a10b"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
max_tokens = 8000
cache = false

[profiles.daytona-bench-40.llm.sub]
model = "databricks-qwen35-122b-a10b"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
max_tokens = 8000
cache = false

[profiles.daytona-bench-40.rlm]
max_iterations = 40
