[config]
schema_version = 1
default_profile = "daytona-recursive"

[defaults.application]
name = "fleet-rlm"

[defaults.runtime]
# Explicit live commands are enabled by default; set this to false to fail
# closed without constructing provider or Daytona clients.
live_enabled = true
turn_timeout_seconds = 1800
max_active_daytona_leases = 8
heartbeat_seconds = 10
stale_after_seconds = 60

# Each profile supplies a provider base URL, API-key environment reference, and
# provider-native model id for the OpenAI-compatible Chat Completion request.

[defaults.rlm]
max_iters = 20
max_llm_calls = 50
max_output_chars = 10000
max_execution_output_chars = 4000
# Sub-LLM cells can stream for minutes; a shorter read-timeout failed the
# whole Turn as an infrastructure error before slow completions finished.
execution_timeout_s = 300
recursion_enabled = true
recursion_max_calls = 4
recursion_max_prompt_chars = 50000
recursion_child_max_iters = 8
recursion_child_max_llm_calls = 12
recursion_child_max_output_chars = 4000
recursion_max_parallel_children = 5
# Root-only Memory Candidate category allowlist; empty disables autonomous proposals.
autonomous_memory_categories = []
verbose = true

[defaults.storage]
data_root = ".fleet_rlm"
max_upload_bytes = 10485760
max_url_bytes = 10485760
max_artifact_bytes = 10485760
database_url_env = "FLEET_DATABASE_URL"

[defaults.daytona]
api_key_env = "FLEET_DAYTONA_API_KEY"
snapshot = "fleet-rlm-python313-v5"
volume_name = "fleet-volume"
volume_mount_path = "/home/daytona/fleet"

[defaults.logging]
level = "INFO"

[defaults.mlflow]
# MLflow 3.15 keeps trace export off the Turn critical path. The sampler is
# explicit policy so an ambient MLFLOW_TRACE_SAMPLING_RATIO cannot override it.
tracing_enabled = true
expose_trace_id = true
async_logging = true
trace_sampling_ratio = 1.0
trace_content_max_chars = 10000

[defaults.posthog]
# PostHog product analytics for project 15008, hosted on the EU ingestion
# endpoint. The project token is resolved from the named environment variable;
# analytics stay disabled when it is absent and never block startup.
enabled = true
project_token_env = "POSTHOG_PROJECT_TOKEN"
host = "https://eu.i.posthog.com"

[profiles.daytona.runtime]
environment = "daytona"

# Databricks Foundation Model endpoint routed through the OpenAI-compatible
# Chat Completion gateway. The endpoint name is the model id sent to the gateway.
[profiles.daytona.llm.root]
model = "databricks-deepseek-v4-flash-0731"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
max_tokens = 16000
# Streaming turns re-enter identical action prompts on retries/repeated steps;
# a cache hit yields zero streamify deltas and reads as a frozen stream.
cache = false
reasoning_effort = "low"

[profiles.daytona.llm.sub]
model = "databricks-deepseek-v4-flash-0731"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
max_tokens = 16000
temperature = 0
cache = false
reasoning_effort = "low"

[profiles.daytona.mlflow]
tracing_enabled = true
tracking_uri = "http://127.0.0.1:5001"
experiment_name = "fleet-rlm"

[profiles.daytona-recursive.runtime]
environment = "daytona"

# Selected interactive recursive profile routed through the Modal-hosted
# GLM-5.3-Flash vLLM endpoint. The `openai/` prefix keeps DSPy on the explicit
# OpenAI-compatible custom-base-URL path; the provider prefix is stripped and
# `zai-org/GLM-5.3-Flash` is the model id sent to the gateway. The endpoint has
# no reasoning-effort surface, so the override stays unset for both roles.
[profiles.daytona-recursive.llm.root]
model = "openai/zai-org/GLM-5.3-Flash"
api_key_env = "FLEET_MODAL_API_KEY"
base_url_env = "FLEET_MODAL_BASE_URL"
# Reasoning-heavy completions can consume the entire budget before any JSON
# output text is emitted (finish_reason=length, empty completion). Keep
# headroom; FleetJSONAdapter bounds the remaining truncation risk.
max_tokens = 32768
cache = false

[profiles.daytona-recursive.llm.sub]
model = "openai/zai-org/GLM-5.3-Flash"
api_key_env = "FLEET_MODAL_API_KEY"
base_url_env = "FLEET_MODAL_BASE_URL"
# Bounded Sub-LLM output keeps repetition-loop degeneration from consuming the
# per-cell execution timeout observed on the previous Databricks endpoint.
max_tokens = 4000
temperature = 0
cache = false

[profiles.daytona-recursive.mlflow]
tracing_enabled = true
tracking_uri = "http://127.0.0.1:5001"
experiment_name = "fleet-rlm"

[profiles.daytona-recursive.rlm]
recursion_enabled = true

# Managed Lakebase/MLflow policy. Select with
# [config] default_profile = "daytona-managed" after populating the
# environment variables named below. The database URL continues to come from
# defaults.storage.database_url_env = "FLEET_DATABASE_URL".
[profiles.daytona-managed.runtime]
environment = "daytona"

[profiles.daytona-managed.llm.root]
model = "databricks-deepseek-v4-flash-0731"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
max_tokens = 8000
reasoning_effort = "low"

[profiles.daytona-managed.llm.sub]
model = "databricks-deepseek-v4-flash-0731"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
max_tokens = 8000
temperature = 0
reasoning_effort = "low"

[profiles.daytona-managed.mlflow]
tracing_enabled = true
tracking_uri = "databricks"
experiment_name_env = "FLEET_MLFLOW_EXPERIMENT_NAME"
trace_catalog_env = "FLEET_MLFLOW_TRACE_CATALOG"
trace_schema_env = "FLEET_MLFLOW_TRACE_SCHEMA"
trace_table_prefix_env = "FLEET_MLFLOW_TRACE_TABLE_PREFIX"
tracing_sql_warehouse_id_env = "FLEET_MLFLOW_TRACING_SQL_WAREHOUSE_ID"

# Prime Oolong mechanics profile: cache is disabled because multiple questions
# reuse one context window. MLflow is intentionally omitted.
[profiles.daytona-bench.runtime]
environment = "daytona"

[profiles.daytona-bench.llm.root]
model = "databricks-deepseek-v4-flash-0731"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
max_tokens = 8000
cache = false

[profiles.daytona-bench.llm.sub]
model = "databricks-deepseek-v4-flash-0731"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
max_tokens = 8000
cache = false

# Benchmarks must stay traceless; override the on-by-default global below.
[profiles.daytona-bench.mlflow]
tracing_enabled = false

# Benchmarks must also stay analytics-free.
[profiles.daytona-bench.posthog]
enabled = false

[profiles.daytona-bench.rlm]
# Keep host logs free of model-generated execution output; live SSE remains
# bounded and is the operator-facing execution surface.
verbose = false

[profiles.daytona-bench-40.runtime]
environment = "daytona"

[profiles.daytona-bench-40.llm.root]
model = "databricks-deepseek-v4-flash-0731"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
max_tokens = 8000
cache = false

[profiles.daytona-bench-40.llm.sub]
model = "databricks-deepseek-v4-flash-0731"
api_key_env = "DATABRICKS_TOKEN"
base_url_env = "FLEET_DATABRICKS_AI_GATEWAY_BASE_URL"
max_tokens = 8000
cache = false

# Benchmarks must stay traceless; override the on-by-default global below.
[profiles.daytona-bench-40.mlflow]
tracing_enabled = false

# Benchmarks must also stay analytics-free.
[profiles.daytona-bench-40.posthog]
enabled = false

[profiles.daytona-bench-40.rlm]
max_iters = 40
