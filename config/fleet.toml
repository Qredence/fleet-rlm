[config]
schema_version = 1

[defaults.application]
name = "fleet-rlm"

[defaults.runtime]
turn_timeout_seconds = 1800
max_active_daytona_leases = 8
heartbeat_seconds = 10
stale_after_seconds = 60

[defaults.llm.root]
model = 'openai/deepseek-v4-flash-free'
api_key_env = "FLEET_LLM_API_KEY"
cache = true
num_retries = 3

[defaults.llm.sub]
model = 'openai/deepseek-v4-flash-free'
api_key_env = "FLEET_LLM_API_KEY"
cache = true
num_retries = 3

[defaults.rlm]
max_iterations = 20
max_llm_calls = 50
max_output_chars = 10000
verbose = true

[defaults.storage]
data_root = ".fleet_rlm"
max_upload_bytes = 10485760
max_artifact_bytes = 10485760

[defaults.daytona]
volume_name = "rlm-volume-dspy"
volume_mount_path = "/home/daytona/fleet"

[defaults.logging]
level = "INFO"

[profiles.local-deno.runtime]
environment = "daytona"

[profiles.daytona.runtime]
environment = "daytona"

[profiles.daytona.daytona]
snapshot = "fleet-rlm-python313-v3"

# Databricks-hosted profile: AI Gateway routes both roles through the unified
# /ai-gateway/openai/v1 endpoint.  Set DATABRICKS_TOKEN in .env or process env.
[profiles.databricks-daytona.runtime]
environment = "daytona"

[profiles.databricks-daytona.daytona]
snapshot = "fleet-rlm-python313-v3"

# Fast-tier root: nemotron-3-ultra-free via MPS deepseek-v4-flash-free / opencode.ai/zen.
# Frontier models (claude-opus-4-8, gpt-5-6-sol) are reserved for offline GEPA;
# build_lm_for_tier(LMTier.FRONTIER, ...) handles them explicitly.
[profiles.databricks-daytona.llm.root]
model = "uscentral.default.nemotron-3-ultra-free"
api_key_env = "DATABRICKS_TOKEN"
base_url = "https://8259565402437752.2.gcp.databricks.com/ai-gateway/openai/v1"
cache = true
num_retries = 3

# Fast tier: bounded semantic analysis sub model.
[profiles.databricks-daytona.llm.sub]
model = "uscentral.default.deepseek-v4-flash"
api_key_env = "DATABRICKS_TOKEN"
base_url = "https://8259565402437752.2.gcp.databricks.com/ai-gateway/openai/v1"
cache = true
num_retries = 3
