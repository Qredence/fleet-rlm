name: Live + Benchmark Tests
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  live-and-benchmark:
    name: Live + Benchmark
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run live_llm and benchmark tests (opt-in)
        env:
          RLM_LIVE_TESTS: "1"
        run: uv run pytest -q -m "live_llm or benchmark"
