name: Live Backend Tests
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  live-backend:
    name: Live Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run canonical live backend tests
        env:
          FLEET_LIVE: "1"
          FLEET_DAYTONA_API_KEY: ${{ secrets.FLEET_DAYTONA_API_KEY }}
          FLEET_OPENCODE_GO_API_KEY: ${{ secrets.FLEET_OPENCODE_GO_API_KEY }}
          FLEET_OPENCODE_GO_BASE_URL: ${{ vars.FLEET_OPENCODE_GO_BASE_URL }}
        run: uv run pytest tests/live/backend -q
