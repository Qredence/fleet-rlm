name: Live + Benchmark Tests
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  live-and-benchmark:
    name: Live + Benchmark
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run live_llm and benchmark tests (opt-in)
        env:
          RLM_LIVE_TESTS: "1"
        run: uv run pytest -q -m "live_llm or benchmark"
