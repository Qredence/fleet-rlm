name: Live Backend Tests
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  live-backend:
    name: Live Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run canonical live backend tests
        env:
          FLEET_LIVE: "1"
          FLEET_DAYTONA_API_KEY: ${{ secrets.FLEET_DAYTONA_API_KEY }}
          FLEET_OPENCODE_GO_API_KEY: ${{ secrets.FLEET_OPENCODE_GO_API_KEY }}
          FLEET_OPENCODE_GO_BASE_URL: ${{ vars.FLEET_OPENCODE_GO_BASE_URL }}
        run: uv run pytest tests/live/backend -q
