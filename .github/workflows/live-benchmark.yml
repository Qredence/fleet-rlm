name: Live Daytona Canaries
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  live-backend:
    name: Live Daytona MVP + durability canaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run the canonical live Daytona canaries
        env:
          FLEET_LIVE: "1"
          FLEET_DAYTONA_API_KEY: ${{ secrets.FLEET_DAYTONA_API_KEY }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          FLEET_LLM_BASE_URL: ${{ secrets.FLEET_LLM_BASE_URL }}
        run: |
          uv run pytest \
            tests/live/backend/test_fleet_rlm_daytona_mvp.py \
            tests/live/backend/test_attachment_artifact_durability.py \
            -q -n 0 --timeout=900
