name: MLflow Smoke

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  mlflow-harness:
    name: Live trace + MLflow verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Start MLflow tracking server
        run: |
          make mlflow-server &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5001/health; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5001/health || exit 1

      - name: Start API server
        env:
          MLFLOW_ENABLED: "true"
          MLFLOW_TRACKING_URI: http://127.0.0.1:5001
          MLFLOW_EXPERIMENT: fleet-rlm
          APP_ENV: local
        run: |
          uv run fleet-rlm serve-api --port 8000 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health || exit 1

      - name: Run live trace harness with MLflow verification
        env:
          MLFLOW_ENABLED: "true"
          MLFLOW_TRACKING_URI: http://127.0.0.1:5001
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          uv run python scripts/validate_rlm_e2e_trace.py \
            --server-url http://127.0.0.1:8000 \
            --require-mlflow-trace-id \
            --verify-mlflow
