name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0 or v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    outputs:
      normalized_version: ${{ steps.version.outputs.normalized_version }}
      tag_version: ${{ steps.version.outputs.tag_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev --python 3.12

      - name: Normalize and validate version against pyproject.toml
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          NORMALIZED_VERSION="$(uv run python scripts/validate_release.py version --requested "$INPUT_VERSION")"
          TAG_VERSION="v${NORMALIZED_VERSION}"

          TOML_VERSION="$NORMALIZED_VERSION"

          echo "normalized_version=$NORMALIZED_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

          echo "✅ Version $TOML_VERSION matches workflow input '$INPUT_VERSION'"

      - name: Release hygiene checks
        run: |
          uv run python scripts/validate_release.py hygiene
          uv run python scripts/validate_release.py metadata

      - name: Security checks
        run: |
          # TODO: Remove this ignore once Pygments ships a patched release for
          # GHSA-5239-wwwm-4pmq / CVE-2026-4539.
          # TODO: Remove the pip ignore once the uvx pip-audit runtime no longer
          # pulls pip 26.0.1 / CVE-2026-3219.
          # TODO: Remove the DiskCache ignore once upstream ships a patched release
          # or DSPy removes the transitive dependency.
          uvx pip-audit --ignore-vuln GHSA-5239-wwwm-4pmq --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2025-69872
          uvx bandit -q -r src/fleet_rlm -x tests -lll

      - name: Lint with Ruff
        run: |
          uv run ruff check src tests scripts migrations
          uv run ruff format --check src tests scripts migrations

      - name: Type-check with ty
        run: uv run ty check src

      - name: Run tests
        env:
          FLEET_MLFLOW_TRACING_ENABLED: "false"
        run: >
          uv run pytest -q
          -m "not packaging"
          --timeout=120
          --timeout-method=thread

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Clean previous builds
        run: rm -rf dist build

      - name: Build distributions
        env:
          FLEET_RLM_UI_BUILD_DONE: "1"
        run: uv build

      - name: Verify packaged backend assets
        env:
          FLEET_RLM_UI_BUILD_DONE: "1"
        run: uv run python scripts/validate_release.py wheel

      - name: Verify distributions
        run: uvx twine check --strict dist/*.whl dist/*.tar.gz

      - name: Record content-addressed artifact identity
        run: uv run python scripts/validate_release.py artifacts --output dist/artifact-manifest.json

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload distributions
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  package-gate:
    name: Package and Release Gate
    runs-on: ubuntu-latest
    needs: [preflight, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev --python 3.12

      - name: Download the single build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify artifact identity and strict metadata
        run: |
          uv run python scripts/validate_release.py verify-artifacts \
            --manifest dist/artifact-manifest.json --dist-dir dist
          uvx twine check --strict dist/*.whl dist/*.tar.gz
          uv run python scripts/validate_release.py wheel --dist-dir dist
          uv run python scripts/validate_release.py metadata
          git diff --check

      - name: Run installed-package contract tests
        env:
          FLEET_RELEASE_DIST: ${{ github.workspace }}/dist
        run: uv run pytest tests/unit/backend/packaging -q -n 0

  check-pypi-availability:
    name: Check PyPI Package Name
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check if package exists on PyPI
        run: |
          STATUS_CODE=$(curl --fail-with-body -sS -o /dev/null -w "%{http_code}\n" https://pypi.org/pypi/fleet-rlm/json || STATUS_CODE="000")
          echo "Status code: $STATUS_CODE"
          if [ "$STATUS_CODE" = "404" ]; then
            echo "✅ Package name 'fleet-rlm' is available on PyPI"
          elif [ "$STATUS_CODE" = "000" ]; then
            echo "::error::PyPI availability check failed"
            exit 1
          else
            echo "⚠️  Package 'fleet-rlm' already exists on PyPI. Version conflicts may occur."
          fi

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build, package-gate, check-pypi-availability, preflight]
    environment:
      name: testpypi
      url: https://test.pypi.org/project/fleet-rlm/
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify artifact identity before TestPyPI upload
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("dist")
          manifest = json.loads((root / "artifact-manifest.json").read_text())
          unsigned = {k: v for k, v in manifest.items() if k != "manifest_sha256"}
          digest = hashlib.sha256(json.dumps(unsigned, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          assert manifest["manifest_sha256"] == digest
          for item in manifest["artifacts"]:
              assert hashlib.sha256((root / item["filename"]).read_bytes()).hexdigest() == item["sha256"]
          print("artifact identity matches the single build output")
          PY

      - name: Prepare TestPyPI distributions
        run: |
          mkdir -p publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publish-dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke-test-testpypi:
    name: Smoke Test Built Artifact
    runs-on: ubuntu-latest
    needs: [publish-testpypi, package-gate, preflight]
    steps:
      - name: Checkout code for the non-secret runtime policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify artifact identity before installed-byte smoke
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("dist")
          manifest = json.loads((root / "artifact-manifest.json").read_text())
          unsigned = {k: v for k, v in manifest.items() if k != "manifest_sha256"}
          assert manifest["manifest_sha256"] == hashlib.sha256(
              json.dumps(unsigned, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          for item in manifest["artifacts"]:
              assert hashlib.sha256((root / item["filename"]).read_bytes()).hexdigest() == item["sha256"]
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install built wheel
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl

      - name: Test Python import
        run: |
          python -c "import fleet_rlm; print(f'✅ Package version: {fleet_rlm.__version__}')"

      - name: Smoke test installed CLI entry points and bundled assets
        run: |
          command -v fleet
          command -v fleet-rlm
          fleet --help
          fleet-rlm --help
          python - <<'PY'
          from importlib import resources

          package = resources.files("fleet_rlm")
          assert (package / "py.typed").is_file()
          assert (package / "daytona" / "snapshot-requirements.txt").is_file()
          assert (package / "skills" / "bundled" / "dspy-rlm" / "SKILL.md").is_file()
          print("installed package assets are readable")
          PY

      - name: Smoke test installed backend API
        run: python scripts/release_smoke.py --expected-version "${{ needs.preflight.outputs.normalized_version }}"

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, package-gate, check-pypi-availability, smoke-test-testpypi, preflight]
    if: ${{ needs.build.result == 'success' && needs.package-gate.result == 'success' && needs.check-pypi-availability.result == 'success' && needs.smoke-test-testpypi.result == 'success' && needs.preflight.result == 'success' }}
    environment:
      name: pypi
      url: https://pypi.org/project/fleet-rlm/
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify artifact identity before PyPI upload
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("dist")
          manifest = json.loads((root / "artifact-manifest.json").read_text())
          unsigned = {k: v for k, v in manifest.items() if k != "manifest_sha256"}
          assert manifest["manifest_sha256"] == hashlib.sha256(
              json.dumps(unsigned, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          for item in manifest["artifacts"]:
              assert hashlib.sha256((root / item["filename"]).read_bytes()).hexdigest() == item["sha256"]
          PY

      - name: Prepare PyPI distributions
        run: |
          mkdir -p publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publish-dist

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, package-gate, preflight]
    if: ${{ needs.publish-pypi.result == 'success' && needs.package-gate.result == 'success' && needs.preflight.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify artifact identity before release attachment
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("dist")
          manifest = json.loads((root / "artifact-manifest.json").read_text())
          unsigned = {k: v for k, v in manifest.items() if k != "manifest_sha256"}
          assert manifest["manifest_sha256"] == hashlib.sha256(
              json.dumps(unsigned, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          for item in manifest["artifacts"]:
              assert hashlib.sha256((root / item["filename"]).read_bytes()).hexdigest() == item["sha256"]
          PY

      - name: Create Git tag (if not already present)
        run: |
          TAG="${{ needs.preflight.outputs.tag_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "✅ Tag $TAG already exists on remote — skipping creation."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Build GitHub release notes from CHANGELOG
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.normalized_version }}
        run: |
          python <<'PY'
          import os
          import pathlib
          import re
          import sys

          version = os.environ["RELEASE_VERSION"]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          section_header = re.compile(
              rf"^## \[(?P<version>{re.escape(version)})\] - (?P<date>.+)$",
              re.MULTILINE,
          )
          match = section_header.search(changelog)
          if not match:
              print(f"::error::Could not find CHANGELOG section for version {version}")
              sys.exit(1)

          next_header = re.compile(r"^## \[", re.MULTILINE)
          next_match = next_header.search(changelog, match.end())
          section = (
              changelog[match.start() : next_match.start()].strip()
              if next_match
              else changelog[match.start() :].strip()
          )
          lines = section.splitlines()
          section_body = "\n".join(lines[1:]).strip()
          release_date = match.group("date").strip()

          body = "\n".join(
              [
                  f"# fleet-rlm v{version}",
                  "",
                  f"Released {release_date}.",
                  "",
                  section_body,
                  "",
                  "### Installation",
                  "",
                  "```bash",
                  f"pip install fleet-rlm=={version}",
                  "```",
              ]
          ).rstrip() + "\n"

          pathlib.Path("release_notes.md").write_text(body, encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag_version }}
          name: Release ${{ needs.preflight.outputs.tag_version }}
          draft: false
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: release_notes.md

      - name: Publish deployment observability summary
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag_version }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.normalized_version }}
          DEPLOYMENT_METRICS_URL: ${{ vars.DEPLOYMENT_METRICS_URL }}
          DEPLOYMENT_ALERTS_URL: ${{ vars.DEPLOYMENT_ALERTS_URL }}
          DEPLOYMENT_POSTHOG_DASHBOARD_URL: ${{ vars.DEPLOYMENT_POSTHOG_DASHBOARD_URL }}
          DEPLOYMENT_HEALTHCHECK_URL: ${{ vars.DEPLOYMENT_HEALTHCHECK_URL }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          python scripts/deployment_observability.py \
            --environment pypi \
            --package-name fleet-rlm \
            --package-url "https://pypi.org/project/fleet-rlm/${RELEASE_VERSION}/" \
            --release-tag "$RELEASE_TAG" \
            --release-version "$RELEASE_VERSION" \
            --annotate-posthog \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --smoke-check "Smoke-test-testpypi passed before publish: installed wheel fleet_rlm.main:app served /openapi.json with credential-free lifespan disabled."
