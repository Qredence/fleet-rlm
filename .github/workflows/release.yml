name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0 or v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    outputs:
      normalized_version: ${{ steps.version.outputs.normalized_version }}
      tag_version: ${{ steps.version.outputs.tag_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev --python 3.12

      - name: Normalize and validate version against pyproject.toml
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          NORMALIZED_VERSION="${INPUT_VERSION#v}"
          TAG_VERSION="v${NORMALIZED_VERSION}"

          if [ -z "$NORMALIZED_VERSION" ]; then
            echo "::error::Version input cannot be empty"
            exit 1
          fi

          TOML_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

          if [ "$TOML_VERSION" != "$NORMALIZED_VERSION" ]; then
            echo "::error::Version mismatch: workflow input '$INPUT_VERSION' (normalized '$NORMALIZED_VERSION') != pyproject.toml '$TOML_VERSION'"
            exit 1
          fi

          echo "normalized_version=$NORMALIZED_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

          echo "✅ Version $TOML_VERSION matches workflow input '$INPUT_VERSION'"

      - name: Release hygiene checks
        run: |
          uv run python scripts/validate_release.py hygiene
          uv run python scripts/validate_release.py metadata

      - name: Security checks
        run: |
          # TODO: Remove this ignore once Pygments ships a patched release for
          # GHSA-5239-wwwm-4pmq / CVE-2026-4539.
          # TODO: Remove the pip ignore once the uvx pip-audit runtime no longer
          # pulls pip 26.0.1 / CVE-2026-3219.
          # TODO: Remove the DiskCache ignore once upstream ships a patched release
          # or DSPy removes the transitive dependency.
          uvx pip-audit --ignore-vuln GHSA-5239-wwwm-4pmq --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2025-69872
          uvx bandit -q -r src/fleet_rlm -x tests -lll

      - name: Lint with Ruff
        run: |
          uv run ruff check src tests scripts migrations
          uv run ruff format --check src tests scripts migrations

      - name: Type-check with ty
        run: uv run ty check src

      - name: Run tests
        env:
          FLEET_MLFLOW_TRACING_ENABLED: "false"
        run: >
          uv run pytest -q
          --timeout=120
          --timeout-method=thread

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "latest"

      - name: Clean previous builds
        run: rm -rf dist build

      - name: Build distributions
        env:
          FLEET_RLM_UI_BUILD_DONE: "1"
        run: uv build

      - name: Verify packaged backend assets
        env:
          FLEET_RLM_UI_BUILD_DONE: "1"
        run: uv run python scripts/validate_release.py wheel

      - name: Verify distributions
        run: uvx twine check dist/*

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload distributions
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  check-pypi-availability:
    name: Check PyPI Package Name
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check if package exists on PyPI
        run: |
          STATUS_CODE=$(curl -sS -o /dev/null -w "%{http_code}\n" https://pypi.org/pypi/fleet-rlm/json || true)
          echo "Status code: $STATUS_CODE"
          if [ "$STATUS_CODE" = "404" ]; then
            echo "✅ Package name 'fleet-rlm' is available on PyPI"
          else
            echo "⚠️  Package 'fleet-rlm' already exists on PyPI. Version conflicts may occur."
          fi

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build, check-pypi-availability]
    environment:
      name: testpypi
      url: https://test.pypi.org/project/fleet-rlm/
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke-test-testpypi:
    name: Smoke Test Built Artifact
    runs-on: ubuntu-latest
    needs: [publish-testpypi, preflight]
    steps:
      - name: Checkout code for the non-secret runtime policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install built wheel
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl

      - name: Test Python import
        run: |
          python -c "import fleet_rlm; print(f'✅ Package version: {fleet_rlm.__version__}')"

      - name: Smoke test installed backend API
        run: |
          SERVER_LOG=$(mktemp)
          OPENAPI_BODY=$(mktemp)
          POLICY_PATH=$(python - <<'PY'
          from pathlib import Path

          import fleet_rlm.config as config

          target = Path(config.__file__).resolve().parents[2] / "config" / "fleet.toml"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(Path("config/fleet.toml").read_text(encoding="utf-8"), encoding="utf-8")
          print(target)
          PY
          )

          # The installed wheel is the ASGI target. The policy is copied only
          # because runtime policy is intentionally external to the wheel; the
          # lifespan is disabled so this credential-free route smoke does not
          # construct Daytona or provider clients.
          python -m uvicorn fleet_rlm.main:app --lifespan off --host 127.0.0.1 --port 8765 >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            rm -f "$POLICY_PATH" "$OPENAPI_BODY" "$SERVER_LOG"
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/openapi.json >"$OPENAPI_BODY"; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8765/openapi.json >"$OPENAPI_BODY" || {
            cat "$SERVER_LOG"
            exit 1
          }

          python - "$OPENAPI_BODY" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["info"]["title"] == "fleet-rlm", f"unexpected title: {payload['info']}"
          assert payload["info"]["version"], f"missing version: {payload['info']}"
          assert "/api/sessions/{session_id}/turns" in payload["paths"]
          print(f"✅ Installed backend OpenAPI is reachable ({len(payload['paths'])} paths)")
          PY

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, smoke-test-testpypi]
    if: ${{ needs.build.result == 'success' && needs.smoke-test-testpypi.result == 'success' }}
    environment:
      name: pypi
      url: https://pypi.org/project/fleet-rlm/
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, preflight]
    if: ${{ needs.publish-pypi.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Create Git tag (if not already present)
        run: |
          TAG="${{ needs.preflight.outputs.tag_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "✅ Tag $TAG already exists on remote — skipping creation."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Build GitHub release notes from CHANGELOG
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.normalized_version }}
        run: |
          python <<'PY'
          import os
          import pathlib
          import re
          import sys

          version = os.environ["RELEASE_VERSION"]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          section_header = re.compile(
              rf"^## \[(?P<version>{re.escape(version)})\] - (?P<date>.+)$",
              re.MULTILINE,
          )
          match = section_header.search(changelog)
          if not match:
              print(f"::error::Could not find CHANGELOG section for version {version}")
              sys.exit(1)

          next_header = re.compile(r"^## \[", re.MULTILINE)
          next_match = next_header.search(changelog, match.end())
          section = (
              changelog[match.start() : next_match.start()].strip()
              if next_match
              else changelog[match.start() :].strip()
          )
          lines = section.splitlines()
          section_body = "\n".join(lines[1:]).strip()
          release_date = match.group("date").strip()

          body = "\n".join(
              [
                  f"# fleet-rlm v{version}",
                  "",
                  f"Released {release_date}.",
                  "",
                  section_body,
                  "",
                  "### Installation",
                  "",
                  "```bash",
                  f"pip install fleet-rlm=={version}",
                  "```",
              ]
          ).rstrip() + "\n"

          pathlib.Path("release_notes.md").write_text(body, encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag_version }}
          name: Release ${{ needs.preflight.outputs.tag_version }}
          draft: false
          prerelease: false
          files: dist/*
          body_path: release_notes.md

      - name: Publish deployment observability summary
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag_version }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.normalized_version }}
          DEPLOYMENT_METRICS_URL: ${{ vars.DEPLOYMENT_METRICS_URL }}
          DEPLOYMENT_ALERTS_URL: ${{ vars.DEPLOYMENT_ALERTS_URL }}
          DEPLOYMENT_POSTHOG_DASHBOARD_URL: ${{ vars.DEPLOYMENT_POSTHOG_DASHBOARD_URL }}
          DEPLOYMENT_HEALTHCHECK_URL: ${{ vars.DEPLOYMENT_HEALTHCHECK_URL }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          python scripts/deployment_observability.py \
            --environment pypi \
            --package-name fleet-rlm \
            --package-url "https://pypi.org/project/fleet-rlm/${RELEASE_VERSION}/" \
            --release-tag "$RELEASE_TAG" \
            --release-version "$RELEASE_VERSION" \
            --annotate-posthog \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --smoke-check "Smoke-test-testpypi passed before publish: installed wheel fleet_rlm.main:app served /openapi.json with credential-free lifespan disabled."
