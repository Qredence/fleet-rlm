commands:
  install: uv sync --all-extras
  test: make test
  test-daytona: uv run pytest tests/unit/integrations/daytona/ -q
  test-observability: uv run pytest tests/unit/integrations/observability/ -q
  test-integration: uv run pytest tests/integration/ -q
  test-db: uv run pytest tests/integration/test_db_repository.py -v
  lint: make lint
  typecheck: make typecheck
  format: make format
  format-check: make format-check
  check: make check

services: {}
