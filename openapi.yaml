    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
          description: Location path identifying where the validation error occurred.
        msg:
          type: string
          title: Message
          description: Human-readable validation failure message.
        type:
          type: string
          title: Error Type
          description: Pydantic validation error type identifier.
        input:
          title: Input
          description: Input value that failed validation, when available.
        ctx:
          type: object
          title: Context
          description: Optional structured validation context for templated error
            messages.
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VolumeFileContentResponse:
      properties:
        provider:
          type: string
          const: daytona
          title: Provider
          description: Runtime volume backend used to satisfy the request.
        path:
          type: string
          title: Path
          description: Normalized file path used for the preview request.
        mime:
          type: string
          title: Mime
          description: Detected MIME type for the returned content.
        size:
          type: integer
          title: Size
          description: File size in bytes reported by the provider.
        sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256
          description: SHA-256 hex digest of the full file bytes before truncation.
        encoding:
          anyOf:
          - type: string
          - type: 'null'
          title: Encoding
          description: 'Content encoding: ''utf-8'' for clean text, ''utf-8-lossy''
            when replacement characters were introduced, or ''binary'' for non-text
            files.'
        content:
          type: string
          title: Content
          description: UTF-8 text preview returned for the requested file. Empty for
            binary files.
        binary:
          type: boolean
          title: Binary
          description: True when the file was detected as binary; content will be
            empty.
          default: false
        truncated:
          type: boolean
          title: Truncated
          description: Whether the returned file content was truncated to respect
            max_bytes.
          default: false
      type: object
      required:
      - provider
      - path
      - mime
      - size
      - content
      title: VolumeFileContentResponse
      description: Response for runtime volume file-content preview endpoint.
    VolumeListItem:
      properties:
        id:
          type: string
          title: Id
          description: Volume identifier.
        name:
          type: string
          title: Name
          description: Volume name.
        state:
          type: string
          title: State
          description: Volume state (e.g. ready, creating).
          default: ''
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
          description: ISO-8601 creation timestamp when available.
      type: object
      required:
      - id
      - name
      title: VolumeListItem
      description: Single volume entry returned by the volume list endpoint.
    VolumeListResponse:
      properties:
        provider:
          type: string
          const: daytona
          title: Provider
          description: Runtime volume backend used to satisfy the request.
        volumes:
          items:
            $ref: '#/components/schemas/VolumeListItem'
          type: array
          title: Volumes
          description: Available persistent volumes.
      type: object
      required:
      - provider
      title: VolumeListResponse
      description: Response for the volume list endpoint.
    VolumeTreeNode:
      properties:
        id:
          type: string
          title: Id
          description: Stable node identifier used by the frontend tree view.
        name:
          type: string
          title: Name
          description: Display name for the file-system node.
        path:
          type: string
          title: Path
          description: Absolute path for the file-system node within the runtime volume.
        type:
          type: string
          enum:
          - volume
          - directory
          - file
          title: Type
          description: Kind of file-system node represented by this entry.
        children:
          items:
            $ref: '#/components/schemas/VolumeTreeNode'
          type: array
          title: Children
          description: Child nodes for directory or volume entries.
        size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size
          description: File size in bytes when the provider reports one.
        modified_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Modified At
          description: Last modified timestamp when the provider reports one.
      type: object
      required:
      - id
      - name
      - path
      - type
      title: VolumeTreeNode
      description: A single node in the volume file tree.
    VolumeTreeResponse:
      properties:
        provider:
          type: string
          const: daytona
          title: Provider
          description: Runtime volume backend used to satisfy the request.
        volume_name:
          type: string
          title: Volume Name
          description: Resolved volume name used for the listing request.
        root_path:
          type: string
          title: Root Path
          description: Normalized root path used for the listing request.
        allowed_roots:
          items:
            type: string
          type: array
          title: Allowed Roots
          description: Canonical volume roots that may be addressed by tree and file
            requests.
        nodes:
          items:
            $ref: '#/components/schemas/VolumeTreeNode'
          type: array
          title: Nodes
          description: Tree nodes rooted at the requested path.
        total_files:
          type: integer
          title: Total Files
          description: Total file count returned in the current response payload.
          default: 0
        total_dirs:
          type: integer
          title: Total Dirs
          description: Total directory count returned in the current response payload.
          default: 0
        truncated:
          type: boolean
          title: Truncated
          description: Whether the provider truncated the tree because of depth or
            payload limits.
          default: false
        max_depth:
          type: integer
          title: Max Depth
          description: Depth limit applied to the tree request.
        max_entries:
          type: integer
          title: Max Entries
          description: Entry limit applied to the tree request.
        entries_returned:
          type: integer
          title: Entries Returned
          description: Total node entries returned in this response.
      type: object
      required:
      - provider
      - volume_name
      - root_path
      - nodes
      - max_depth
      - max_entries
      - entries_returned
      title: VolumeTreeResponse
      description: Response for the volume tree listing endpoint.
    WebSocketTicketResponse:
      properties:
        ticket:
          type: string
          title: Ticket
          description: Opaque one-time WebSocket authentication ticket.
        expires_at:
          type: string
          format: date-time
          title: Expires At
          description: UTC timestamp when the ticket expires.
      type: object
      required:
      - ticket
      - expires_at
      title: WebSocketTicketResponse
      description: Short-lived one-time ticket used to authenticate browser WebSockets.
    ApiErrorResponse:
      description: Canonical HTTP error envelope returned by Fleet RLM API routes.
      properties:
        code:
          description: Stable machine-readable error code.
          title: Code
          type: string
        message:
          description: Human-readable non-secret error summary.
          title: Message
          type: string
        detail:
          anyOf:
          - {}
          - type: 'null'
          default: null
          description: Structured non-secret error details, when available.
          title: Detail
      required:
      - code
      - message
      title: ApiErrorResponse
      type: object
  securitySchemes:
    HTTPBearer:
      type: http
      description: Bearer token used when HTTP authentication is enabled. When auth
        is optional, requests without a token fall back to the configured default
        server identity.
      scheme: bearer
      bearerFormat: JWT
