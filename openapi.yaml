components:
  schemas:
    Action:
      properties:
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - request_id
      title: Action
      description: Client request identity used to avoid replaying a setup operation.
    ApiError:
      properties:
        detail:
          anyOf:
          - type: string
          - items:
              additionalProperties: true
              type: object
            type: array
          title: Detail
      type: object
      required:
      - detail
      title: ApiError
      description: Sanitized HTTP error detail or FastAPI's standard validation issue list.
    ApplyResult:
      properties:
        restart_required:
          type: boolean
          title: Restart Required
      type: object
      required:
      - restart_required
      title: ApplyResult
      description: Request for the owning launcher to restart with saved configuration.
    Attached:
      properties:
        mounted_path:
          type: string
          title: Mounted Path
        rel_path:
          type: string
          title: Rel Path
      type: object
      required:
      - mounted_path
      - rel_path
      title: Attached
      description: Location of an uploaded attachment in the workspace and the sandbox.
    Body_attach_file_sessions__session_id__attach_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_attach_file_sessions__session_id__attach_post
    Catalog:
      properties:
        catalog_xml:
          type: string
          title: Catalog Xml
      type: object
      required:
      - catalog_xml
      title: Catalog
      description: Session Skill catalog rendered as XML.
    ConfigEdit:
      properties:
        values:
          additionalProperties:
            type: string
            format: password
            writeOnly: true
          type: object
          maxProperties: 40
          title: Values
      additionalProperties: false
      type: object
      required:
      - values
      title: ConfigEdit
      description: Masked candidate values; responses never echo submitted credentials.
    ContextRequest:
      properties:
        path:
          type: string
          maxLength: 1024
          minLength: 1
          title: Path
        description:
          type: string
          maxLength: 2000
          title: Description
          default: ''
      additionalProperties: false
      type: object
      required:
      - path
      title: ContextRequest
      description: Workspace file to select as the Session's context.
    ContextSelected:
      properties:
        path:
          type: string
          title: Path
        size_bytes:
          type: integer
          title: Size Bytes
        sha256:
          type: string
          title: Sha256
      type: object
      required:
      - path
      - size_bytes
      - sha256
      title: ContextSelected
      description: Workspace file recorded as the Session's context, with its size and digest.
    CreateVolume:
      properties:
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Request Id
        name:
          type: string
          maxLength: 63
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
          title: Name
      additionalProperties: false
