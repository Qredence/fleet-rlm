        '422':
          description: Invalid setup request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
  /setup/apply:
    post:
      tags:
      - setup
      summary: Apply
      description: 'Fence new Turns and request a restart only when existing work is idle.


        Return restart_required=True on acceptance. Return 409 when setup is not

        ready or a Turn or workspace operation is active, leaving that work running.

        Concurrent attempts are serialized so a rejected request cannot reopen setup

        after an accepted restart.'
      operationId: apply_setup_apply_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResult'
        '401':
          description: Operator token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '403':
          description: Loopback connection required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '404':
          description: Setup or operation unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '409':
          description: Operation or configuration conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '422':
          description: Invalid setup request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
      security:
      - HTTPBearer: []
  /setup/experiments/drain:
    post:
      tags:
      - setup
      summary: Drain Experiments
      description: Fence experiment admission before a local owner waits to stop its services.
      operationId: drain_experiments_setup_experiments_drain_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentManagerStatus'
        '401':
          description: Operator token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '403':
          description: Loopback connection required
          content:
            application/json:
