                $ref: '#/components/schemas/SetupError'
        '409':
          description: Operation or configuration conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '422':
          description: Invalid setup request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
      security:
      - HTTPBearer: []
  /setup/models/test:
    post:
      tags:
      - setup
      summary: Model Test
      description: Start an optional small, potentially billed model request.
      operationId: model_test_setup_models_test_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Action'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
