          type: object
          title: Result
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - turn_id
      - status
      - result
      - updated_at
      title: TurnStatus
      description: Recorded status and result of one Turn.
    ValidationError:
      properties:
