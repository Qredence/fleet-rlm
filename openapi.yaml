        '422':
          description: Invalid setup request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
      security:
      - HTTPBearer: []
  /setup/experiments/status:
    get:
      tags:
      - setup
      summary: Experiment Status
      description: Observe cleanup through the same private, loopback-only operator capability.
      operationId: experiment_status_setup_experiments_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentManagerStatus'
        '401':
          description: Operator token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '403':
          description: Loopback connection required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '404':
          description: Setup or operation unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '409':
          description: Operation or configuration conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '422':
          description: Invalid setup request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
      security:
      - HTTPBearer: []
  /health:
    get:
      tags:
      - health
      summary: Health
      description: 'Return the API version and setup status or MLflow configuration.


        MLflow readiness reflects whether an experiment ID was initialized.

        Databricks workspace identity errors propagate as ValueError.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /sessions:
    get:
      tags:
      - sessions
      summary: List Sessions
      description: List stored Sessions with their update times and Turn counts.
      operationId: list_sessions_sessions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessions'
  /models:
    get:
      tags:
      - sessions
      summary: List Models
      description: Browse an explicit compatible endpoint; manual model selection is always available.
      operationId: list_models_models_get
      parameters:
      - name: scope
        in: query
        required: false
        schema:
          type: string
          description: Ignored compatibility parameter
          deprecated: true
          default: ''
          title: Scope
        description: Ignored compatibility parameter
        deprecated: true
      - name: role
        in: query
        required: false
        schema:
          enum:
          - root
          - sub
          - reflection
          - judge
          type: string
          default: root
          title: Role
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}:
    delete:
      tags:
      - sessions
      summary: Evict Session
      description: 'Stop a Session''s sandbox and release its runtime; stored history is kept.


        Returns 404 when this process holds no runtime for the Session, and 409 while a Turn is running.'
      operationId: evict_session_sessions__session_id__delete
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/config:
    get:
      tags:
      - sessions
      summary: Session Config
      description: Describe a Session's mode, models, context, configuration, and limits.
      operationId: session_config_sessions__session_id__config_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/model:
    put:
      tags:
      - sessions
      summary: Select Model
      description: 'Bind a model to a role, persist it, and swap in a new engine.


        Returns 409 while a Turn holds the Session lock.'
      operationId: select_model_sessions__session_id__model_put
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSelection'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/mode:
    get:
      tags:
      - sessions
      summary: Get Mode
      description: Return a Session's current execution mode.
      operationId: get_mode_sessions__session_id__mode_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mode'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - sessions
      summary: Set Mode
      description: 'Persist a new execution mode and apply it to the Session runtime.


        The current context is saved with the mode.'
      operationId: set_mode_sessions__session_id__mode_put
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mode'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/history:
    get:
      tags:
      - sessions
      summary: Get History
      description: Return a Session's stored Turns without claiming its runtime lease.
      operationId: get_history_sessions__session_id__history_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
