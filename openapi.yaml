      description: Bounded Skill discovery metadata — no instructions body.
    TurnListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TurnResponse'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        offset:
          type: integer
          title: Offset
        limit:
          type: integer
          title: Limit
        has_more:
          type: boolean
          title: Has More
      type: object
      required:
      - items
      - total
      - offset
      - limit
      - has_more
      title: TurnListResponse
