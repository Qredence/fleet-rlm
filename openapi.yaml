          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - decision
      - request_id
      title: ReviewJob
      description: An explicit human decision, never an implicit promotion after optimization.
    SessionConfig:
      properties:
        mode:
          type: string
          title: Mode
        models:
          additionalProperties:
            type: string
          type: object
          title: Models
        context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Context
        configuration:
          additionalProperties: true
          type: object
          title: Configuration
        limits:
          $ref: '#/components/schemas/Limits'
      type: object
      required:
      - mode
      - models
      - context
      - configuration
      - limits
      title: SessionConfig
