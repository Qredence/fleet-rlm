      description: Replay-captured Turns across every Session, newest first.
    ImproveReadiness:
      properties:
        ready:
          type: boolean
          title: Ready
        examples:
          type: integer
          title: Examples
        groups:
          type: integer
          title: Groups
        critical:
          type: integer
          title: Critical
        split_sizes:
          additionalProperties:
            type: integer
          type: object
          title: Split Sizes
        missing:
