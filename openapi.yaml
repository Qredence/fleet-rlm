  /api/sessions:
    post:
      tags:
      - sessions
      summary: Create Session
      description: "Create a session for the local user in the current workspace.\n\
        \nParameters:\n    body (SessionCreateRequest): Session creation data, including\
        \ the optional title.\n    identity (LocalScopeDep): The deterministic local\
        \ User and Workspace scope.\n    repo (SessionCatalogDep): Session repository\
        \ used to create the session.\n    prewarm (SessionPrewarmDep): Optional background\
        \ Sandbox pre-warm trigger.\n\nReturns:\n    SessionDetailResponse: The newly\
        \ created session details."
      operationId: create_session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - sessions
      summary: List Sessions
      operationId: list_sessions
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - active
            - archived
            type: string
          - type: 'null'
          title: Status
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Title contains
          title: Search
        description: Title contains
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
