                $ref: '#/components/schemas/ApiError'
        '409':
          description: The operation conflicts with the job or current manager state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: The request or job identity is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Improve storage or worker service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /improve/jobs/{run_id}/review:
    post:
      tags:
      - improve
      summary: Review Job
      description: Approve through the evidence-checking worker, or persist an explicit rejection.
      operationId: review_job_improve_jobs__run_id__review_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewJob'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobEnvelope'
        '404':
          description: The requested job does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The operation conflicts with the job or current manager state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: The request or job identity is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Improve storage or worker service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /improve/history:
    get:
      tags:
      - improve
      summary: Improve History
      description: List approved versions and completed evaluation jobs, newest first, for the quality
        trend.
      operationId: improve_history_improve_history_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImproveHistory'
        '404':
          description: The requested job does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The operation conflicts with the job or current manager state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: The request or job identity is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Improve storage or worker service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    Action:
      properties:
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - request_id
      title: Action
      description: Client request identity used to avoid replaying a setup operation.
    ApiError:
      properties:
        detail:
          anyOf:
          - type: string
          - items:
              additionalProperties: true
              type: object
            type: array
          title: Detail
      type: object
      required:
      - detail
      title: ApiError
      description: Sanitized HTTP error detail or FastAPI's standard validation issue list.
    ApplyResult:
      properties:
        restart_required:
          type: boolean
          title: Restart Required
      type: object
      required:
      - restart_required
      title: ApplyResult
      description: Request for the owning launcher to restart with saved configuration.
    Attached:
      properties:
        mounted_path:
          type: string
          title: Mounted Path
        rel_path:
          type: string
          title: Rel Path
      type: object
      required:
      - mounted_path
      - rel_path
      title: Attached
      description: Location of an uploaded attachment in the workspace and the sandbox.
    Body_attach_file_sessions__session_id__attach_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_attach_file_sessions__session_id__attach_post
    Catalog:
      properties:
        catalog_xml:
          type: string
          title: Catalog Xml
      type: object
      required:
      - catalog_xml
      title: Catalog
      description: Session Skill catalog rendered as XML.
    ConfigEdit:
      properties:
        values:
          additionalProperties:
            type: string
            format: password
            writeOnly: true
          type: object
          maxProperties: 40
          title: Values
      additionalProperties: false
      type: object
      required:
      - values
      title: ConfigEdit
      description: Masked candidate values; responses never echo submitted credentials.
    ContextRequest:
      properties:
        path:
          type: string
          maxLength: 1024
          minLength: 1
          title: Path
        description:
          type: string
          maxLength: 2000
          title: Description
          default: ''
      additionalProperties: false
      type: object
      required:
      - path
      title: ContextRequest
      description: Workspace file to select as the Session's context.
    ContextSelected:
      properties:
        path:
          type: string
          title: Path
        size_bytes:
          type: integer
          title: Size Bytes
        sha256:
          type: string
          title: Sha256
      type: object
      required:
      - path
      - size_bytes
      - sha256
      title: ContextSelected
      description: Workspace file recorded as the Session's context, with its size and digest.
    CreateVolume:
      properties:
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Request Id
        name:
          type: string
          maxLength: 63
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
          title: Name
      additionalProperties: false
      type: object
      required:
      - request_id
      - name
      title: CreateVolume
      description: Explicit request for a newly named workspace Volume.
    Deleted:
      properties:
        deleted:
          type: string
          title: Deleted
      type: object
      required:
      - deleted
      title: Deleted
      description: Acknowledgement of a deleted memory entry or workspace file.
    ExperimentManagerStatus:
      properties:
        accepting:
          type: boolean
          title: Accepting
        busy:
          type: boolean
          title: Busy
        experiments:
          items:
            $ref: '#/components/schemas/Job'
          type: array
          title: Experiments
      type: object
      required:
      - accepting
      - busy
      - experiments
      title: ExperimentManagerStatus
      description: Admission and active-run state observed by the local launcher.
    Exported:
      properties:
        exported:
          items:
            type: string
          type: array
          title: Exported
      type: object
      required:
      - exported
      title: Exported
      description: Skills exported from the Session's volume to local storage.
    FileStat:
      properties:
        path:
          type: string
          title: Path
        size_bytes:
          type: integer
          title: Size Bytes
        sha256:
          type: string
          title: Sha256
      type: object
      required:
      - path
      - size_bytes
      - sha256
      title: FileStat
      description: Size and SHA-256 digest of one workspace file.
    FileWritten:
      properties:
        path:
          type: string
          title: Path
        size_bytes:
          type: integer
          title: Size Bytes
        sha256:
          type: string
          title: Sha256
        mounted_path:
          type: string
          title: Mounted Path
      type: object
      required:
      - path
      - size_bytes
      - sha256
      - mounted_path
