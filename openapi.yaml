        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
      security:
      - HTTPBearer: []
  /setup/operations/{operation_id}/events:
    get:
      tags:
      - setup
      summary: Operation Events
      description: Replay retained progress and stream until one terminal outcome.
      operationId: operation_events_setup_operations__operation_id__events_get
      security:
      - HTTPBearer: []
      parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
          title: Operation Id
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: After
      responses:
        '200':
          description: Successful Response
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Operator token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '403':
          description: Loopback connection required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '404':
          description: Setup or operation unavailable
          content:
            application/json:
              schema:
