        output_preview:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Preview
          description: Compact preview of span outputs.
        start_time_unix_nano:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Time Unix Nano
          description: Span start timestamp (Unix nanoseconds, string-encoded).
        end_time_unix_nano:
          anyOf:
          - type: string
          - type: 'null'
          title: End Time Unix Nano
          description: Span end timestamp (Unix nanoseconds, string-encoded).
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
          description: Span duration in milliseconds when timestamps exist.
        input_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Input Tokens
          description: Input token count reported for this span.
        output_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Output Tokens
          description: Output token count reported for this span.
        total_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Tokens
          description: Total token count reported for this span.
        output_chars:
          anyOf:
          - type: integer
          - type: 'null'
          title: Output Chars
