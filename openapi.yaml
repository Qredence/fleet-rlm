    StartJob:
      properties:
        gepa_budget:
          anyOf:
          - type: string
            enum:
            - light
            - medium
            - heavy
          - type: 'null'
          title: Gepa Budget
          default: light
        max_metric_calls:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Max Metric Calls
        threads:
          type: integer
          maximum: 32.0
          minimum: 1.0
          title: Threads
          default: 4
        reflection_minibatch_size:
          type: integer
          minimum: 1.0
          title: Reflection Minibatch Size
          default: 3
        max_candidate_proposals:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Max Candidate Proposals
        validation_ratio:
          type: number
          maximum: 0.5
          minimum: 0.1
          title: Validation Ratio
          default: 0.35
        trace_search:
          type: boolean
          title: Trace Search
          default: false
        max_total_tokens:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Max Total Tokens
        kind:
          type: string
          enum:
          - optimize
          - evaluate_rescore
          - evaluate_replay
          - evaluate_synthetic
          title: Kind
          default: optimize
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - request_id
      title: StartJob
      description: A job kind, its validated controls, and a retry-safe caller identity.
    Status:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: Status
      description: Plain status acknowledgement, such as a cleared context.
    TunableComponent:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
      type: object
      required:
      - name
      - description
      title: TunableComponent
      description: One part of the program GEPA can rewrite, in plain words.
    TurnRequest:
      properties:
        task:
          type: string
          maxLength: 100000
          minLength: 1
          title: Task
        idempotency_key:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Idempotency Key
        requested_skills:
          items:
            type: string
            maxLength: 64
            minLength: 1
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: array
          maxItems: 3
          title: Requested Skills
        record_replay:
          type: boolean
          title: Record Replay
          description: Persist a bounded immutable snapshot of this Turn's inputs for explicitly reviewed
            GEPA data. A workspace over the snapshot limit skips capture instead of failing the Turn.
          default: true
        timeout_seconds:
          anyOf:
          - type: integer
            maximum: 0.0
            minimum: 0.0
          - type: integer
            maximum: 3600.0
            minimum: 10.0
          - type: 'null'
          title: Timeout Seconds
          description: Fleet deadline for this Turn in seconds. Omitted or null inherits the configured
            value; 0 disables the Fleet deadline; otherwise the value must be 10..3600.
      additionalProperties: false
      type: object
      required:
      - task
      title: TurnRequest
      description: User prompt sent to one Session's Fleet engine.
    TurnStatus:
      properties:
        turn_id:
          type: string
          title: Turn Id
        status:
          type: string
          title: Status
