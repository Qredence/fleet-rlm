        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/traces/feedback:
    post:
      tags:
      - traces
      summary: Create Trace Feedback
      description: Record human feedback and optional ground truth for an MLflow trace.
      operationId: create_trace_feedback_api_v1_traces_feedback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraceFeedbackRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceFeedbackResponse'
        '400':
          description: The feedback request did not include a valid trace identifier.
        '401':
          description: Authentication is required or the provided token is invalid.
        '403':
          description: The authenticated user is not allowed to annotate this trace.
        '404':
          description: No MLflow trace matched the provided identifier.
        '503':
          description: MLflow feedback services are unavailable or misconfigured.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    AuthMeResponse:
      properties:
        tenant_claim:
          type: string
          title: Tenant Claim
          description: Tenant or workspace claim resolved from auth.
        user_claim:
          type: string
          title: User Claim
          description: User claim resolved from auth.
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
          description: User email address when the auth provider returned one.
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Display name returned by the auth provider, when available.
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
          description: Persisted control-plane tenant identifier for admitted Entra
            users.
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
          description: Persisted control-plane user identifier for admitted Entra
            or Neon users.
      type: object
      required:
      - tenant_claim
      - user_claim
      title: AuthMeResponse
      description: Resolved identity payload returned to authenticated clients.
    Body_upload_dataset_api_v1_optimization_datasets_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: Dataset file to upload in JSON or JSONL format.
        module_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Module Slug
          description: Optional module slug used to validate required dataset keys.
      type: object
      required:
      - file
      title: Body_upload_dataset_api_v1_optimization_datasets_post
    DatasetDetailResponse:
      properties:
        id:
          type: string
          title: Id
          description: Unique dataset identifier.
        name:
          type: string
          title: Name
          description: Human-readable dataset name.
        row_count:
          type: integer
          title: Row Count
          description: Number of rows/examples in the dataset.
        format:
          type: string
          title: Format
          description: File format (json or jsonl).
        module_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Module Slug
          description: Associated module slug, when provided.
        created_at:
          type: string
          title: Created At
          description: ISO-8601 creation timestamp.
        sample_rows:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Sample Rows
          description: First rows from the dataset as preview.
        uri:
          type: string
          title: Uri
          description: Filesystem path to the dataset file.
      type: object
      required:
      - id
      - name
      - row_count
      - format
      - created_at
      - sample_rows
      - uri
      title: DatasetDetailResponse
      description: Dataset metadata with sample rows and URI.
    DatasetListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DatasetResponse'
          type: array
          title: Items
          description: Dataset list items.
        total:
          type: integer
          title: Total
          description: Total matching datasets.
        offset:
          type: integer
          title: Offset
          description: Current pagination offset.
        limit:
          type: integer
          title: Limit
          description: Current page size.
        has_more:
          type: boolean
          title: Has More
          description: Whether more results exist beyond this page.
      type: object
      required:
      - items
      - total
      - offset
      - limit
      - has_more
      title: DatasetListResponse
      description: Paginated dataset listing.
    DatasetResponse:
      properties:
        id:
          type: string
          title: Id
          description: Unique dataset identifier.
        name:
          type: string
          title: Name
          description: Human-readable dataset name.
        row_count:
          type: integer
          title: Row Count
          description: Number of rows/examples in the dataset.
        format:
          type: string
          title: Format
          description: File format (json or jsonl).
        module_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Module Slug
          description: Associated module slug, when provided.
        created_at:
          type: string
          title: Created At
          description: ISO-8601 creation timestamp.
      type: object
      required:
      - id
      - name
      - row_count
      - format
      - created_at
      title: DatasetResponse
      description: Metadata for a registered dataset.
    EvaluationResultItem:
      properties:
        id:
          type: string
          title: Id
          description: Unique evaluation result identifier.
        example_index:
          type: integer
          title: Example Index
          description: Zero-based index in the dataset.
        input_data:
          type: string
          title: Input Data
          description: JSON-serialized input fields.
        expected_output:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected Output
          description: Expected/gold output.
        predicted_output:
          anyOf:
          - type: string
          - type: 'null'
          title: Predicted Output
          description: Model predicted output.
        score:
          type: number
          title: Score
          description: Score for this example (0.0-1.0).
      type: object
      required:
      - id
      - example_index
      - input_data
      - score
      title: EvaluationResultItem
      description: A single per-example evaluation result.
    EvaluationResultsResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/EvaluationResultItem'
          type: array
          title: Items
          description: Evaluation result items.
        total:
          type: integer
          title: Total
          description: Total evaluation results for the run.
        offset:
          type: integer
          title: Offset
          description: Current pagination offset.
        limit:
          type: integer
          title: Limit
          description: Current page size.
        has_more:
          type: boolean
          title: Has More
          description: Whether more results exist beyond this page.
      type: object
      required:
      - items
      - total
      - offset
      - limit
      - has_more
      title: EvaluationResultsResponse
      description: Paginated evaluation results for a run.
    GEPAModuleInfo:
      properties:
        slug:
          type: string
          title: Slug
          description: Unique module identifier slug.
        label:
          type: string
          title: Label
          description: Human-readable module label.
        description:
          type: string
          title: Description
          description: Human-readable description of what this module optimizes.
          default: ''
        program_spec:
          type: string
          title: Program Spec
          description: DSPy program specification string.
        required_dataset_keys:
          items:
            type: string
          type: array
          title: Required Dataset Keys
          description: Dataset keys required for this module's examples.
        input_keys:
          items:
            type: string
          type: array
          title: Input Keys
          description: Dataset keys used as DSPy inputs for this optimization target.
        output_keys:
          items:
            type: string
          type: array
          title: Output Keys
          description: Dataset keys scored as DSPy outputs for this optimization target.
        runtime_module_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Runtime Module Name
          description: Runtime module registry name when this target adapts a runtime
            module.
        signature_class_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Signature Class Name
          description: DSPy signature class optimized by this target, when available.
        optimization_target_kind:
          type: string
          title: Optimization Target Kind
          description: Optimization target kind such as custom, runtime-signature,
            or skill.
          default: custom
        offline_only:
          type: boolean
          title: Offline Only
          description: Whether this module can only be optimized through offline optimization
            endpoints.
          default: true
      type: object
      required:
      - slug
      - label
      - program_spec
      - required_dataset_keys
      title: GEPAModuleInfo
      description: Metadata for a registered optimizable DSPy module.
    GEPAOptimizationRequest:
      properties:
        dataset_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Path
          description: Relative filesystem path to the dataset file.
        dataset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Id
          description: Registered dataset identifier to optimize against.
        program_spec:
          type: string
          title: Program Spec
          description: DSPy program specification string to optimize in module:attr
            form. Required when module_slug is not provided.
          default: ''
        module_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Module Slug
          description: Registered module slug for server-side dispatch. When provided,
            program_spec is auto-resolved from the module registry.
        skill_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Skill Name
          description: Bundled or mounted Fleet skill name to optimize as a markdown
            skill artifact.
        skill_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Skill Path
          description: Relative path to a SKILL.md-compatible markdown file to optimize.
        trace_bundle_paths:
          items:
            type: string
          type: array
          title: Trace Bundle Paths
          description: Optional offline trace bundle paths available to the RLM-GEPA
            instruction proposer.
        reflection_profile_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Reflection Profile Id
          description: Optional LLM provider profile id for the GEPA proposer/reflection
            model.
        reflection_model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Reflection Model Id
          description: Optional provider-native model id for the GEPA proposer/reflection
            model.
        output_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Path
          description: Optional filesystem path to save the optimized program.
        auto:
          type: string
          enum:
          - light
          - medium
          - heavy
          title: Auto
          description: Optimization intensity level.
          default: light
        max_metric_calls:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Max Metric Calls
          description: Optional GEPA metric-call budget override for short offline
            smoke runs.
        train_ratio:
          type: number
          title: Train Ratio
          description: Fraction of examples to use for training (remainder used for
            validation).
          default: 0.8
        optimizer:
          type: string
          const: gepa
          title: Optimizer
          description: Optimizer backend to use. GEPA is the only supported optimizer.
          default: gepa
      additionalProperties: false
      type: object
      title: GEPAOptimizationRequest
      description: Request body for triggering a GEPA prompt optimization run.
    GEPAOptimizationResponse:
      properties:
        ok:
          type: boolean
          title: Ok
          description: Whether the optimization run completed successfully.
          default: true
        optimizer:
          type: string
          title: Optimizer
          description: Optimizer backend that was used.
          default: GEPA
        program_spec:
          type: string
          title: Program Spec
          description: DSPy program specification that was optimized.
        train_examples:
          type: integer
          title: Train Examples
          description: Number of training examples used.
        validation_examples:
          type: integer
          title: Validation Examples
          description: Number of validation examples used.
        validation_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Validation Score
          description: Validation score from the optimized program, when available.
        output_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Path
          description: Filesystem path where the optimized program was saved.
        manifest_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Manifest Path
          description: Filesystem path to the optimization manifest, when available.
        feedback_summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Feedback Summary
          description: Short summary of validation feedback from the GEPA run.
        module_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Module Slug
          description: Module slug used for this optimization run, when server-side
            dispatch was used.
        reflection_profile_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Reflection Profile Id
          description: LLM provider profile id used for GEPA reflection/proposal,
            when selected.
        reflection_model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Reflection Model Id
          description: Model id used for GEPA reflection/proposal, when selected.
        distilled_trace_bundle_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Distilled Trace Bundle Path
          description: Distilled trace bundle used by the RLM-GEPA proposer.
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Error message when the optimization run failed.
      type: object
      required:
      - program_spec
      - train_examples
      - validation_examples
      title: GEPAOptimizationResponse
      description: Result payload after a GEPA optimization run completes.
    GEPAStatusResponse:
      properties:
        available:
          type: boolean
          title: Available
          description: Whether the MLflow-backed GEPA optimization path is available.
        module_optimization_available:
          type: boolean
          title: Module Optimization Available
          description: Whether registered module optimization can run in this environment.
          default: false
        mlflow_dataset_optimization_available:
          type: boolean
          title: Mlflow Dataset Optimization Available
          description: Whether MLflow-backed dataset/program optimization can run.
          default: false
        mlflow_logging_available:
          type: boolean
          title: Mlflow Logging Available
          description: Whether optional MLflow logging is available for optimization
            runs.
          default: false
        mlflow_configured:
          type: boolean
          title: Mlflow Configured
          description: Whether MLflow is enabled/configured in the environment.
          default: false
        mlflow_enabled:
          type: boolean
          title: Mlflow Enabled
          description: Whether MLflow is enabled and reachable.
        gepa_installed:
          type: boolean
          title: Gepa Installed
          description: Whether the GEPA teleprompt module is importable.
        guidance:
          items:
            type: string
          type: array
          title: Guidance
          description: Human-readable guidance when GEPA is not fully available.
      type: object
      required:
      - available
      - mlflow_enabled
      - gepa_installed
      title: GEPAStatusResponse
      description: Status payload for GEPA optimization availability.
    HTTPValidationError:
      description: Canonical HTTP error envelope returned for request validation failures.
      properties:
        code:
          description: Stable machine-readable error code.
          title: Code
          type: string
        message:
          description: Human-readable non-secret error summary.
          title: Message
          type: string
        detail:
          anyOf:
          - {}
          - type: 'null'
          default: null
          description: Structured non-secret error details, when available.
          title: Detail
      required:
      - code
      - message
      title: HTTPValidationError
      type: object
    HealthResponse:
      properties:
        status:
          type: string
          const: live
          title: Status
          description: Unambiguous liveness state for this service.
          default: live
        version:
          type: string
          title: Version
          description: Package version currently serving the API.
          default: 0.6.0
      type: object
      title: HealthResponse
      description: Response body for the lightweight health endpoint.
    LlmImportEnvResponse:
      properties:
        profile:
          $ref: '#/components/schemas/LlmProviderProfileResponse'
          description: Profile created from current DSPY_* env values.
        bindings:
          items:
            $ref: '#/components/schemas/LlmRoleBindingResponse'
          type: array
          title: Bindings
          description: Role bindings created from the imported environment values.
      type: object
      required:
      - profile
      title: LlmImportEnvResponse
    LlmModelCatalogEntry:
      properties:
        id:
          type: string
          title: Id
          description: Provider-native model identifier.
        label:
          type: string
          title: Label
          description: Display label for model dropdowns.
        litellm_model:
          type: string
          title: Litellm Model
          description: LiteLLM model identifier used by the runtime.
      type: object
      required:
      - id
      - label
      - litellm_model
      title: LlmModelCatalogEntry
    LlmModelCatalogResponse:
      properties:
        profile_id:
          type: string
          format: uuid
          title: Profile Id
          description: Provider profile that supplied the catalog.
        models:
          items:
            $ref: '#/components/schemas/LlmModelCatalogEntry'
          type: array
          title: Models
          description: Models available for assignment from this profile.
        cached:
          type: boolean
          title: Cached
          description: Whether the response came from the in-memory cache.
          default: true
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Provider fetch error when the catalog is empty or fell back
            to static models.
      type: object
      required:
      - profile_id
      title: LlmModelCatalogResponse
    LlmProviderProfileCreateRequest:
      properties:
        name:
          type: string
          title: Name
          description: Human-readable profile label.
        provider_type:
          type: string
          enum:
          - openai
          - anthropic
          - google
          - openai_compatible
          - litellm_proxy
          - anthropic_compatible
          title: Provider Type
          description: Provider integration type.
        api_base:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Base
          description: Optional API base URL override.
        api_key:
          type: string
          title: Api Key
          description: Provider API key to encrypt and store.
          default: ''
        metadata_json:
          additionalProperties: true
          type: object
          title: Metadata Json
          description: Optional provider-specific metadata.
      type: object
      required:
      - name
      - provider_type
      title: LlmProviderProfileCreateRequest
    LlmProviderProfileResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Stable provider profile identifier.
        name:
          type: string
          title: Name
          description: Human-readable profile label shown in Settings.
        provider_type:
          type: string
          enum:
          - openai
          - anthropic
          - google
          - openai_compatible
          - litellm_proxy
          - anthropic_compatible
          title: Provider Type
          description: Provider integration type.
        api_base:
          type: string
          title: Api Base
          description: Configured API base URL for the provider.
          default: ''
        api_key_masked:
