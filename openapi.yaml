openapi: 3.1.0
info:
  title: fleet-rlm
  version: 0.6.2
paths:
  /api/chat:
    post:
      tags:
      - chat
      summary: Chat
      description: Stream one chat Turn as an AI SDK UI 7 message stream.
      operationId: chat_api_chat_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Idempotency-Key
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Fleet-User-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: X-Fleet-User-Id
      - name: X-Fleet-Workspace-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: X-Fleet-Workspace-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: AI SDK UI 7 v1 UIMessage SSE stream
          content:
            text/event-stream:
              itemSchema:
                type: object
                properties:
                  data:
                    type: string
                  event:
                    type: string
                  id:
                    type: string
                  retry:
                    type: integer
                    minimum: 0
          headers:
            x-vercel-ai-ui-message-stream:
              description: AI SDK UI message stream protocol version
              schema:
                type: string
                const: v1
        '400':
          description: Invalid attachment reference
        '404':
          description: Session not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
