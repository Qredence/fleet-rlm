        id:
          type: string
          format: uuid
          title: Id
        session_id:
          type: string
          format: uuid
          title: Session Id
        run_id:
          type: string
          format: uuid
          title: Run Id
        kind:
          type: string
          title: Kind
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        media_type:
          type: string
          title: Media Type
        byte_size:
