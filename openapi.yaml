openapi: 3.1.0
info:
  title: fleet-rlm
  version: 0.7.11
paths:
  /api/sessions/{session_id}/turns:
    post:
      tags:
      - turns
      summary: Create Turn
      description: Stream one Turn, opening claim and preparation inside the SSE generator.
      operationId: create_turn
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTurnRequest'
      responses:
        '200':
          description: Fleet Turn SSE stream. It opens immediately with a transient
            turn_status prelude (phase=preparation) that repeats every runtime heartbeat
            until the Turn is claimed and prepared. Claim or preparation failures
            project closed turn_error + turn_finish events inside the stream, and
            cancellation projects one turn_cancelled event.
          content:
            text/event-stream:
              itemSchema:
                type: object
                properties:
                  data:
                    type: string
                  event:
                    type: string
                  id:
                    type: string
                  retry:
                    type: integer
                    minimum: 0
              schema:
                type: string
              x-event-data-schema:
                $ref: '#/components/schemas/FleetUIMessageChunk'
          headers:
            Cache-Control:
              schema:
                type: string
            X-Accel-Buffering:
              schema:
                type: string
            x-vercel-ai-ui-message-stream:
              schema:
                type: string
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Turn unavailable while composition installs dependencies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - sessions
      summary: List Session Turns
      operationId: list_session_turns
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: after_sequence
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: After Sequence
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTurnPageResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sessions/{session_id}/traces/feedback:
    post:
      tags:
