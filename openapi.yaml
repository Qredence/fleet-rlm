  /api/runs/{run_id}/cancel:
    post:
      tags:
      - runs
      summary: Cancel Run
      description: 'Request cancellation of an owned in-flight Run. Idempotent.


        Missing or foreign runs return 404 (never 403). Durable cancel intent is

        recorded when a SessionRepository is configured; the in-process registry

        always receives the signal for the local worker.'
      operationId: cancel_run_api_runs__run_id__cancel_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
