            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerifyRequest:
      properties:
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Request Id
        sections:
          items:
            type: string
            enum:
            - models
            - database
            - mlflow
            - daytona
          type: array
          maxItems: 4
          minItems: 1
          title: Sections
      additionalProperties: false
      type: object
      required:
      - request_id
      title: VerifyRequest
      description: Recheck all services or selected sections without changing provider state.
    VolumeInfo:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        state:
          type: string
          title: State
          default: unknown
      type: object
      required:
      - id
      - name
      title: VolumeInfo
      description: Safe provider identity of a workspace Volume.
    WorkspaceWriteRequest:
      oneOf:
      - properties:
          content:
            type: string
        required:
        - content
      - properties:
          content_base64:
            type: string
        required:
        - content_base64
      properties:
        content:
          anyOf:
          - type: string
            maxLength: 25000000
          - type: 'null'
          title: Content
        content_base64:
          anyOf:
          - type: string
            maxLength: 34000000
          - type: 'null'
          title: Content Base64
      additionalProperties: false
      type: object
      title: WorkspaceWriteRequest
      description: File content for a workspace write, as text or base64; supply exactly one.
