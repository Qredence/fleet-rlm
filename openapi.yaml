      - HTTPBearer: []
  /setup/verify:
    post:
      tags:
      - setup
      summary: Verify
      description: Start read-only checks for the requested sections, defaulting to all sections.
      operationId: verify_setup_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStarted'
        '401':
          description: Operator token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '403':
          description: Loopback connection required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '404':
          description: Setup or operation unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '409':
          description: Operation or configuration conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '422':
          description: Invalid setup request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
      security:
      - HTTPBearer: []
  /setup/daytona/volumes:
    get:
      tags:
      - setup
      summary: Volumes
      description: List workspace Volumes using server credentials.
      operationId: volumes_setup_daytona_volumes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VolumeInfo'
                type: array
                title: Response Volumes Setup Daytona Volumes Get
        '401':
          description: Operator token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '403':
          description: Loopback connection required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '404':
          description: Setup or operation unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '409':
          description: Operation or configuration conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '422':
          description: Invalid setup request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
      security:
      - HTTPBearer: []
    post:
      tags:
      - setup
      summary: Create Volume
      description: Start explicit creation of a persistent provider Volume.
      operationId: create_volume_setup_daytona_volumes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVolume'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
