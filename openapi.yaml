    SetupField:
      properties:
        name:
          type: string
          title: Name
        section:
          type: string
          title: Section
        secret:
          type: boolean
          title: Secret
        configured:
          type: boolean
          title: Configured
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
        source:
          type: string
          title: Source
        editable:
          type: boolean
          title: Editable
      type: object
      required:
      - name
      - section
      - secret
      - configured
      - value
      - source
      - editable
      title: SetupField
      description: One sanitized editable field and its effective source.
    SetupStatus:
      properties:
        backend:
          type: string
          title: Backend
        snapshot_name:
          type: string
          title: Snapshot Name
        env_path:
          type: string
          title: Env Path
        fields:
          items:
            $ref: '#/components/schemas/SetupField'
          type: array
          title: Fields
        checks:
          additionalProperties: true
          type: object
          title: Checks
        errors:
          items:
            type: string
          type: array
          title: Errors
        dirty:
          type: boolean
          title: Dirty
        busy:
          type: boolean
          title: Busy
        ready:
          type: boolean
          title: Ready
        restart_required:
          type: boolean
          title: Restart Required
      type: object
      required:
      - backend
      - snapshot_name
      - env_path
      - fields
      - checks
      - errors
      - dirty
      - busy
      - ready
      - restart_required
      title: SetupStatus
