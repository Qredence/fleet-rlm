        '422':
          description: Session update is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service is not ready, or Session retirement is pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
