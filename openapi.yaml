    patch:
      tags:
      - sessions
      summary: Patch Session
      description: "Update the title or status of a session within the local user's\
        \ workspace.\n\nParameters:\n    body (SessionPatchRequest): Fields to update;\
        \ at least one field is required.\n\nReturns:\n    SessionDetailResponse:\
        \ The updated session details.\n\nRaises:\n    HTTPException: If no fields\
        \ are provided, the title is blank, the status is invalid, or the\n      \
        \  session cannot be updated."
      operationId: update_session
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionPatchRequest'
      responses:
