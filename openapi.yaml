openapi: 3.1.0
info:
  title: Fleet-RLM Lite API
  version: 0.8.1
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /sessions:
    get:
      tags:
      - sessions
      summary: List Sessions
      description: List stored Sessions with their update times and Turn counts.
      operationId: list_sessions_sessions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessions'
  /models:
    get:
      tags:
      - sessions
      summary: List Models
      description: 'List the chat models in a discovery scope.


        An invalid scope or missing Gateway credentials returns 422.'
      operationId: list_models_models_get
      parameters:
      - name: scope
        in: query
        required: false
        schema:
          type: string
          default: system.ai
          title: Scope
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}:
    delete:
      tags:
      - sessions
      summary: Evict Session
      description: 'Stop a Session''s sandbox and release its runtime; stored history is kept.


        Returns 404 when this process holds no runtime for the Session, and 409 while a Turn is running.'
      operationId: evict_session_sessions__session_id__delete
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/config:
    get:
      tags:
      - sessions
      summary: Session Config
      description: Describe a Session's mode, models, context, configuration, and limits.
      operationId: session_config_sessions__session_id__config_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/model:
    put:
      tags:
      - sessions
      summary: Select Model
      description: 'Bind a model to a role, persist it, and swap in a new engine.


        Returns 409 while a Turn holds the Session lock.'
      operationId: select_model_sessions__session_id__model_put
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSelection'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/mode:
    get:
      tags:
      - sessions
      summary: Get Mode
      description: Return a Session's current execution mode.
      operationId: get_mode_sessions__session_id__mode_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mode'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - sessions
      summary: Set Mode
      description: 'Persist a new execution mode and apply it to the Session runtime.


        The current context is saved with the mode.'
      operationId: set_mode_sessions__session_id__mode_put
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mode'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/history:
    get:
      tags:
      - sessions
      summary: Get History
      description: Return a Session's stored Turns without claiming its runtime lease.
      operationId: get_history_sessions__session_id__history_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/turns/{turn_id}:
    get:
      tags:
      - sessions
      summary: Turn Status
      description: Return one durable Turn status, or 404 when the Turn is unknown.
      operationId: turn_status_sessions__session_id__turns__turn_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: turn_id
        in: path
        required: true
        schema:
          type: string
          title: Turn Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/context:
    put:
      tags:
      - sessions
      summary: Select Context
      description: 'Select a workspace file as the Session''s context and persist it.


        The response reports the file''s size and SHA-256 digest.'
      operationId: select_context_sessions__session_id__context_put
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSelected'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - sessions
      summary: Clear Context
      description: Clear the Session's selected context and persist the change.
      operationId: clear_context_sessions__session_id__context_delete
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/workspace/tree:
    get:
      tags:
      - workspace
      summary: List Files
      description: List a Session's workspace files and the artifacts among them.
      operationId: list_files_sessions__session_id__workspace_tree_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Files'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/files:
    get:
      tags:
      - workspace
      summary: List Files
      description: List a Session's workspace files and the artifacts among them.
      operationId: list_files_sessions__session_id__files_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Files'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/workspace/stat/{rel_path}:
    get:
      tags:
      - workspace
      summary: Workspace Stat
      description: Return the size and SHA-256 digest of one workspace file.
      operationId: workspace_stat_sessions__session_id__workspace_stat__rel_path__get
      parameters:
      - name: rel_path
        in: path
        required: true
        schema:
          type: string
          title: Rel Path
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileStat'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/workspace/files/{rel_path}:
    get:
      tags:
      - workspace
      summary: Read Workspace File
      description: 'Return one workspace file as a download, capped at 25 MB.


        An unavailable or invalid path returns 404.'
      operationId: read_workspace_file_sessions__session_id__workspace_files__rel_path__get
      parameters:
      - name: rel_path
        in: path
        required: true
        schema:
          type: string
          title: Rel Path
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - workspace
      summary: Write Workspace File
      description: 'Write one workspace file from text or base64 content, capped at 25 MB.


        Supplying both or neither of the content fields returns 422.'
      operationId: write_workspace_file_sessions__session_id__workspace_files__rel_path__put
      parameters:
      - name: rel_path
        in: path
        required: true
        schema:
          type: string
          title: Rel Path
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceWriteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWritten'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - workspace
      summary: Delete Workspace File
      description: 'Delete one workspace file.


        Failures return 404.'
      operationId: delete_workspace_file_sessions__session_id__workspace_files__rel_path__delete
      parameters:
      - name: rel_path
        in: path
        required: true
        schema:
          type: string
          title: Rel Path
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/attach:
    post:
      tags:
      - workspace
      summary: Attach File
      description: 'Store an uploaded attachment under files/ in the workspace.


        Uploads stream to disk and return 413 above the size limit.'
      operationId: attach_file_sessions__session_id__attach_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_attach_file_sessions__session_id__attach_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attached'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/memory:
    get:
      tags:
      - memory
      summary: List Memory
      description: List a Session's memory entries that match an optional query.
      operationId: list_memory_sessions__session_id__memory_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: q
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memories'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/memory/{memory_id}:
    put:
      tags:
      - memory
      summary: Put Memory
      description: Save one memory entry under the given ID.
      operationId: put_memory_sessions__session_id__memory__memory_id__put
      parameters:
      - name: memory_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Id
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySaved'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - memory
      summary: Remove Memory
      description: Delete one memory entry by ID.
      operationId: remove_memory_sessions__session_id__memory__memory_id__delete
      parameters:
      - name: memory_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Id
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /skills:
    get:
      tags:
      - skills
      summary: Get Skills Catalog
      description: Sync local Skills to the Session's volume and return the catalog XML.
      operationId: get_skills_catalog_skills_get
      parameters:
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          default: default
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /skills/pull:
    post:
      tags:
      - skills
      summary: Pull Skills To Local
      description: Export the Session's volume Skills to local storage.
      operationId: pull_skills_to_local_skills_pull_post
      parameters:
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          default: default
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exported'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /skills/push:
    post:
      tags:
      - skills
      summary: Push Skills
      description: Push local Skills to the Session's volume and return the count.
      operationId: push_skills_skills_push_post
      parameters:
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          default: default
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pushed'
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/turn:
    post:
      tags:
      - turns
      summary: Stream Turn
      description: 'Run one Turn and stream its activity as Server-Sent Events.


        The stream always ends with one outcome event.

        A client disconnect cancels the Turn; the Session stays locked until sandbox work has drained.'
      operationId: stream_turn_sessions__session_id__turn_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
      responses:
        '200':
          description: Server-Sent Events for Turn status, activity, completion, or failure.
          content:
            text/event-stream:
              itemSchema:
                type: object
                properties:
                  data:
                    type: string
                  event:
                    type: string
                  id:
                    type: string
                  retry:
                    type: integer
                    minimum: 0
              schema:
                type: string
        '409':
          description: A Turn or workspace change holds the Session lock; retry when it completes
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Attached:
      properties:
        mounted_path:
          type: string
          title: Mounted Path
        rel_path:
          type: string
          title: Rel Path
      type: object
      required:
      - mounted_path
      - rel_path
      title: Attached
      description: Location of an uploaded attachment in the workspace and the sandbox.
    Body_attach_file_sessions__session_id__attach_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_attach_file_sessions__session_id__attach_post
    Catalog:
      properties:
        catalog_xml:
          type: string
          title: Catalog Xml
      type: object
      required:
      - catalog_xml
      title: Catalog
      description: Session Skill catalog rendered as XML.
    ContextRequest:
      properties:
        path:
          type: string
          maxLength: 1024
          minLength: 1
          title: Path
        description:
          type: string
          maxLength: 2000
          title: Description
          default: ''
      additionalProperties: false
      type: object
      required:
      - path
      title: ContextRequest
      description: Workspace file to select as the Session's context.
    ContextSelected:
      properties:
        path:
          type: string
          title: Path
        size_bytes:
          type: integer
          title: Size Bytes
        sha256:
          type: string
          title: Sha256
      type: object
      required:
      - path
      - size_bytes
      - sha256
      title: ContextSelected
      description: Workspace file recorded as the Session's context, with its size and digest.
    Deleted:
      properties:
        deleted:
          type: string
          title: Deleted
      type: object
      required:
      - deleted
      title: Deleted
      description: Acknowledgement of a deleted memory entry or workspace file.
    Exported:
      properties:
        exported:
          items:
            type: string
          type: array
          title: Exported
      type: object
      required:
      - exported
      title: Exported
      description: Skills exported from the Session's volume to local storage.
    FileStat:
      properties:
        path:
          type: string
          title: Path
        size_bytes:
          type: integer
          title: Size Bytes
        sha256:
          type: string
          title: Sha256
      type: object
      required:
      - path
      - size_bytes
      - sha256
      title: FileStat
      description: Size and SHA-256 digest of one workspace file.
    FileWritten:
      properties:
        path:
          type: string
          title: Path
        size_bytes:
          type: integer
          title: Size Bytes
        sha256:
          type: string
          title: Sha256
        mounted_path:
          type: string
          title: Mounted Path
      type: object
      required:
      - path
      - size_bytes
      - sha256
      - mounted_path
      title: FileWritten
      description: Result of a workspace write, including the sandbox mounted path.
    Files:
      properties:
        session_id:
          type: string
          title: Session Id
        files:
          items:
            type: string
          type: array
          title: Files
        artifacts:
          items:
            type: string
          type: array
          title: Artifacts
      type: object
      required:
      - session_id
      - files
      - artifacts
      title: Files
      description: Workspace file paths for one Session, with the artifacts among them.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          title: Status
        version:
          type: string
          title: Version
        mlflow:
          $ref: '#/components/schemas/MlflowHealth'
      type: object
      required:
      - status
      - version
      - mlflow
      title: Health
      description: Service status, version, and effective MLflow destination.
    History:
      properties:
        session_id:
          type: string
          title: Session Id
        turns:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Turns
      type: object
      required:
      - session_id
      - turns
      title: History
      description: Stored Turn records for one Session.
    Limits:
      properties:
        lm_calls:
          type: integer
          title: Lm Calls
        depth:
          type: integer
          title: Depth
        children:
          type: integer
          title: Children
        active_children:
          type: integer
          title: Active Children
        timeout_seconds:
          type: integer
          title: Timeout Seconds
      type: object
      required:
