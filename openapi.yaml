                $ref: '#/components/schemas/SetupError'
        '422':
          description: Invalid setup request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
      security:
      - HTTPBearer: []
    post:
      tags:
      - setup
      summary: Create Volume
      description: Start explicit creation of a persistent provider Volume.
      operationId: create_volume_setup_daytona_volumes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVolume'
        required: true
      responses:
        '200':
          description: Successful Response
