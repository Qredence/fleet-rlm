            maximum: 10000.0
            minimum: 1.0
          - type: 'null'
          title: Min New Labels
        max_metric_calls:
          anyOf:
          - type: integer
            maximum: 100000.0
            minimum: 1.0
          - type: 'null'
          title: Max Metric Calls
