          type: string
          format: uuid
          title: Id
        title:
          type: string
          title: Title
        status:
          type: string
          title: Status
        checkpoint_version:
          type: integer
          title: Checkpoint Version
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
