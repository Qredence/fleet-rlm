      summary: Activate
      description: Activate an existing provider snapshot without rebuilding it.
      operationId: activate_setup_daytona_snapshot_activate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Action'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStarted'
        '401':
          description: Operator token required
          content:
            application/json:
              schema:
