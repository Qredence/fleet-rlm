        mlflow_session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Mlflow Session Id
          description: Optional MLflow trace session id hint. The server validates
            the hint against authorized runtime session ids for the resolved durable
            session before export.
      additionalProperties: false
      type: object
      title: SessionTraceExportRequest
      description: Request body for exporting a session's linked MLflow traces.
    SessionTraceExportResponse:
      properties:
        ok:
          type: boolean
          title: Ok
          description: Whether trace export completed.
          default: true
        session_id:
          type: string
          title: Session Id
          description: Durable session identifier.
        trace_count:
          type: integer
          title: Trace Count
          description: Number of MLflow traces exported.
        json_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Json Path
          description: Path to the full JSON trace artifact.
        jsonl_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Jsonl Path
          description: Path to the full JSONL trace artifact.
        distilled_bundle_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Distilled Bundle Path
          description: Path to the distilled GEPA evidence bundle.
        skipped_trace_ids:
          items:
            type: string
          type: array
          title: Skipped Trace Ids
          description: Trace identifiers that could not be resolved/exported.
        errors:
          items:
            type: string
          type: array
          title: Errors
          description: Non-fatal export errors.
        summary:
          additionalProperties: true
          type: object
          title: Summary
          description: Distilled trace export summary.
      type: object
      required:
      - session_id
      - trace_count
      title: SessionTraceExportResponse
      description: Trace export artifact paths for a session.
    SessionTraceItem:
      properties:
        trace_id:
          type: string
          title: Trace Id
          description: Provider trace identifier (for example an MLflow trace id).
        client_request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Request Id
          description: Optional Fleet client request id correlated with the trace.
        turn_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Turn Id
          description: Chat turn id when the trace was recorded.
        provider:
          type: string
          title: Provider
          description: External trace provider (for example mlflow).
        experiment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Experiment Id
          description: Provider experiment id when known.
        experiment_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Experiment Name
          description: Provider experiment name when known.
        observed_at:
          type: string
          title: Observed At
          description: ISO-8601 timestamp when the trace was observed.
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Provider-specific metadata payload stored with the trace row.
      type: object
      required:
      - trace_id
      - provider
      - observed_at
      title: SessionTraceItem
      description: External trace metadata linked to a durable session.
    SessionTraceListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SessionTraceItem'
          type: array
          title: Items
          description: Trace rows linked to the session.
        total:
          type: integer
          title: Total
          description: Total matching traces.
        offset:
          type: integer
          title: Offset
          description: Pagination offset.
        limit:
          type: integer
          title: Limit
          description: Page size.
        has_more:
          type: boolean
          title: Has More
          description: Whether additional pages are available.
      type: object
      required:
      - items
      - total
      - offset
      - limit
      - has_more
      title: SessionTraceListResponse
      description: Paginated external traces for a session.
    SessionTracePerformanceSpanSummary:
      properties:
        span_id:
          type: string
          title: Span Id
          description: Span identifier.
        name:
          type: string
          title: Name
          description: Span name.
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
          description: Span duration in milliseconds.
        input_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Input Tokens
          description: Input token count.
        output_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Output Tokens
          description: Output token count.
        total_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Tokens
          description: Total token count.
        output_chars:
          anyOf:
          - type: integer
          - type: 'null'
          title: Output Chars
          description: Output payload character count.
      type: object
      required:
      - span_id
      - name
      title: SessionTracePerformanceSpanSummary
      description: Compact span reference used in trace performance summaries.
    SessionTracePerformanceSummary:
      properties:
        total_duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Duration Ms
          description: Root trace duration in milliseconds.
        llm_duration_ms:
          type: integer
          title: Llm Duration Ms
          description: Total duration of LLM/chat-model spans.
          default: 0
        repl_duration_ms:
          type: integer
          title: Repl Duration Ms
          description: Total duration of REPL execution spans.
          default: 0
        tool_duration_ms:
          type: integer
          title: Tool Duration Ms
          description: Total duration of non-REPL tool spans.
          default: 0
        root_overhead_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Root Overhead Ms
          description: Root duration minus known LLM, REPL, and tool durations.
        input_tokens:
          type: integer
          title: Input Tokens
          description: Summed input tokens from span usage.
          default: 0
        output_tokens:
          type: integer
          title: Output Tokens
          description: Summed output tokens from span usage.
          default: 0
        total_tokens:
          type: integer
          title: Total Tokens
          description: Summed total tokens from span usage.
          default: 0
        token_total_mismatch:
          type: boolean
          title: Token Total Mismatch
          description: Whether total_tokens differs from input_tokens + output_tokens.
          default: false
        adapter_fallback_count:
          type: integer
          title: Adapter Fallback Count
          description: Detected adapter fallback or retry signals.
          default: 0
        parse_error_count:
          type: integer
          title: Parse Error Count
          description: Detected parser/adapter parse error signals.
          default: 0
        selected_skills:
          items:
            type: string
          type: array
          title: Selected Skills
          description: Selected RLM skill names.
        rlm_action_max_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rlm Action Max Tokens
          description: Configured RLM action-generation token budget.
        rlm_max_output_chars:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rlm Max Output Chars
          description: Configured RLM REPL output character budget.
        slowest_llm_span:
          anyOf:
          - $ref: '#/components/schemas/SessionTracePerformanceSpanSummary'
          - type: 'null'
          description: Slowest detected LLM/chat-model span.
        largest_output_span:
          anyOf:
          - $ref: '#/components/schemas/SessionTracePerformanceSpanSummary'
          - type: 'null'
