openapi: 3.1.0
info:
  title: fleet-rlm
  version: 0.6.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      description: Report a lightweight server health signal and package version.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Health status could not be determined.
  /ready:
    get:
      tags:
      - health
      summary: Ready
      description: 'Report whether critical startup dependencies are ready for requests.


        Verifies DB connectivity with a short-timeout ping so a sleeping Neon

        compute reports ``degraded`` instead of ``ready``.'
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: A critical runtime dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Get Me
      description: Return the authenticated identity and any admitted control-plane
        IDs.
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '403':
          description: The authenticated tenant or user is not admitted to Fleet RLM.
        '503':
          description: Authentication or repository services are not configured yet.
      security:
      - HTTPBearer: []
  /api/v1/auth/ws-ticket:
    post:
      tags:
      - auth
      summary: Create Ws Ticket
      description: Exchange an authenticated HTTP identity for a one-time WebSocket
        ticket.
      operationId: create_ws_ticket_api_v1_auth_ws_ticket_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketTicketResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '403':
          description: The authenticated tenant or user is not admitted to Fleet RLM.
        '503':
          description: Authentication or repository services are not configured yet.
      security:
      - HTTPBearer: []
  /api/v1/info:
    get:
      tags:
      - info
      summary: Service information
      description: Return a stable snapshot of build metadata and active feature flags
        for the running instance. Useful for operator introspection and client capability
        negotiation without tailing server logs.
      operationId: get_service_info_api_v1_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfoResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '503':
          description: Service configuration is unavailable because server startup
            is incomplete.
      security:
      - HTTPBearer: []
  /api/v1/sessions/state:
    get:
      tags:
      - sessions
      summary: List Session State
      description: Return lightweight summaries of active/restored in-memory session
        state.
      operationId: list_session_state_api_v1_sessions_state_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStateResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '503':
          description: Session state is unavailable because server startup is incomplete.
      security:
      - HTTPBearer: []
  /api/v1/sessions:
    get:
      tags:
      - sessions
      summary: List session history
      description: Paginated list of durable session transcripts with search and status
        filters.
      operationId: list_sessions_endpoint_api_v1_sessions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Full-text search on title
          title: Search
        description: Full-text search on title
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by status (active, archived)
          title: Status
        description: Filter by status (active, archived)
      - name: created_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filter sessions created on or after this date (ISO 8601)
          title: Created After
        description: Filter sessions created on or after this date (ISO 8601)
      - name: created_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filter sessions created on or before this date (ISO 8601)
          title: Created Before
        description: Filter sessions created on or before this date (ISO 8601)
      - name: model_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by exact model name
          title: Model Name
        description: Filter by exact model name
      - name: model_provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by exact model provider
          title: Model Provider
        description: Filter by exact model provider
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Page size
          default: 20
          title: Limit
        description: Page size
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Pagination offset
          default: 0
          title: Offset
        description: Pagination offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '403':
          description: The caller does not have permission to access this resource.
        '503':
          description: Session services are unavailable because server startup is
            incomplete.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}:
    get:
      tags:
      - sessions
      summary: Get session detail
      description: Return session metadata and turn count for a specific session.
      operationId: get_session_detail_api_v1_sessions__session_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the session to inspect.
          title: Session Id
        description: Identifier of the session to inspect.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '403':
          description: The caller does not have permission to access this resource.
        '503':
          description: Session services are unavailable because server startup is
            incomplete.
        '404':
          description: Session not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - sessions
      summary: Patch session metadata
      description: Update session title and/or metadata_json. Returns the updated
        session snapshot.
      operationId: patch_session_endpoint_api_v1_sessions__session_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the session to update.
          title: Session Id
        description: Identifier of the session to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '403':
          description: The caller does not have permission to access this resource.
        '503':
          description: Session services are unavailable because server startup is
            incomplete.
        '404':
          description: Session not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - sessions
      summary: Archive session
      description: Soft-delete (archive) a session. Returns success when archived,
        404 if not found or not owned.
      operationId: delete_session_endpoint_api_v1_sessions__session_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the session to archive.
          title: Session Id
        description: Identifier of the session to archive.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDeleteResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '403':
          description: The caller does not have permission to access this resource.
        '503':
          description: Session services are unavailable because server startup is
            incomplete.
        '404':
          description: Session not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/turns:
    get:
      tags:
      - sessions
      summary: Get session turns
      description: Paginated turn-by-turn transcript for a session.
      operationId: get_session_turns_api_v1_sessions__session_id__turns_get
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the session whose turns to list.
          title: Session Id
        description: Identifier of the session whose turns to list.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Page size
          default: 50
          title: Limit
        description: Page size
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Pagination offset
          default: 0
          title: Offset
        description: Pagination offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnListResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '403':
          description: The caller does not have permission to access this resource.
        '503':
          description: Session services are unavailable because server startup is
            incomplete.
        '404':
          description: Session not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/traces:
    get:
      tags:
      - sessions
      summary: List session traces
      description: Paginated external traces (for example MLflow child delegations)
        linked to a session.
      operationId: get_session_traces_api_v1_sessions__session_id__traces_get
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the session whose traces to list.
          title: Session Id
        description: Identifier of the session whose traces to list.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Page size
          default: 50
          title: Limit
        description: Page size
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Pagination offset
          default: 0
          title: Offset
        description: Pagination offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTraceListResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '403':
          description: The caller does not have permission to access this resource.
        '503':
          description: Session services are unavailable because server startup is
            incomplete.
        '404':
          description: Session not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/trace-debug:
    get:
      tags:
      - sessions
      summary: Inspect session MLflow trace mapping
      description: Resolve one MLflow trace for the session and classify each span
        against the workspace chat component model.
      operationId: get_session_trace_debug_api_v1_sessions__session_id__trace_debug_get
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the session whose trace to inspect.
          title: Session Id
        description: Identifier of the session whose trace to inspect.
      - name: trace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional explicit MLflow trace id to inspect.
          title: Trace Id
        description: Optional explicit MLflow trace id to inspect.
      - name: client_request_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional Fleet client request id used to resolve the trace.
          title: Client Request Id
        description: Optional Fleet client request id used to resolve the trace.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTraceDebugResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '403':
          description: The caller does not have permission to access this resource.
        '503':
          description: Session services are unavailable because server startup is
            incomplete.
        '404':
          description: Session not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/trace-export:
    post:
      tags:
      - sessions
      summary: Export session MLflow traces
      description: Write full MLflow trace JSON/JSONL artifacts and a distilled GEPA
        evidence bundle.
      operationId: export_session_traces_endpoint_api_v1_sessions__session_id__trace_export_post
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the session whose traces to export.
          title: Session Id
        description: Identifier of the session whose traces to export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionTraceExportRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTraceExportResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '403':
          description: The caller does not have permission to access this resource.
        '503':
          description: Session services are unavailable because server startup is
            incomplete.
        '404':
          description: Session not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/stats:
    get:
      tags:
      - sessions
      summary: Get session usage stats
      description: Aggregated token counts, latency, and model breakdown for all turns
        in a session.
      operationId: get_session_stats_api_v1_sessions__session_id__stats_get
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the session whose stats to retrieve.
          title: Session Id
        description: Identifier of the session whose stats to retrieve.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatsResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '403':
          description: The caller does not have permission to access this resource.
        '503':
          description: Session services are unavailable because server startup is
            incomplete.
        '404':
          description: Session not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/restore:
    post:
      tags:
      - sessions
      summary: Restore session
      description: Unarchive (restore) a soft-deleted session. Returns success when
        restored, 404 if not found, 409 if already active.
      operationId: restore_session_endpoint_api_v1_sessions__session_id__restore_post
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the session to restore.
          title: Session Id
        description: Identifier of the session to restore.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRestoreResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '403':
          description: The caller does not have permission to access this resource.
        '503':
          description: Session services are unavailable because server startup is
            incomplete.
        '404':
          description: Session not found.
        '409':
          description: Session is already active.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/export:
    post:
      tags:
      - sessions
      summary: Export session as GEPA dataset
      description: Convert a session's turn history into a JSONL dataset suitable
        for GEPA optimization. Requires a target module slug to determine the column
        mapping.
      operationId: export_session_endpoint_api_v1_sessions__session_id__export_post
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: Identifier of the session to export as a dataset.
          title: Session Id
        description: Identifier of the session to export as a dataset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionExportRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '403':
          description: The caller does not have permission to access this resource.
        '503':
          description: Session services are unavailable because server startup is
            incomplete.
        '404':
          description: Session not found.
        '400':
          description: Invalid export parameters.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runtime/settings:
    get:
      tags:
      - runtime
      summary: Get Runtime Settings
      description: Return the effective runtime settings snapshot used by the local
        server.
      operationId: get_runtime_settings_api_v1_runtime_settings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSettingsSnapshot'
        '401':
          description: Authentication is required or the provided token is invalid.
        '503':
          description: Runtime services are unavailable because server startup is
            incomplete.
      security:
      - HTTPBearer: []
    patch:
      tags:
      - runtime
      summary: Patch Runtime Settings
      description: Persist allowed runtime setting changes and hot-apply them in-process.
      operationId: patch_runtime_settings_api_v1_runtime_settings_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeSettingsUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSettingsUpdateResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '503':
          description: Runtime services are unavailable because server startup is
            incomplete.
        '400':
          description: The supplied runtime setting values failed validation.
        '403':
          description: Runtime settings can only be updated when APP_ENV=local.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/runtime/tests/lm:
    post:
      tags:
      - runtime
      summary: Test Lm Connection
      description: Verify that the planner and delegate language-model configuration
        can load.
      operationId: test_lm_connection_api_v1_runtime_tests_lm_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConnectivityTestResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '503':
          description: Runtime services are unavailable because server startup is
            incomplete.
      security:
      - HTTPBearer: []
  /api/v1/runtime/tests/daytona:
    post:
      tags:
      - runtime
      summary: Test Daytona Connection
      description: Run the Daytona preflight and connectivity check exposed in runtime
        diagnostics.
      operationId: test_daytona_connection_api_v1_runtime_tests_daytona_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConnectivityTestResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '503':
          description: Runtime services are unavailable because server startup is
            incomplete.
      security:
      - HTTPBearer: []
  /api/v1/runtime/status:
    get:
      tags:
      - runtime
      summary: Get Runtime Status
      description: Return the combined runtime readiness, model, and provider diagnostics
        snapshot.
      operationId: get_runtime_status_api_v1_runtime_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatusResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '503':
          description: Runtime services are unavailable because server startup is
            incomplete.
      security:
      - HTTPBearer: []
  /api/v1/runtime/volume/tree:
    get:
      tags:
      - runtime
      summary: Get Volume Tree
      description: List the runtime volume tree for the active workspace and provider.
      operationId: get_volume_tree_api_v1_runtime_volume_tree_get
      security:
      - HTTPBearer: []
      parameters:
      - name: root_path
        in: query
        required: false
        schema:
          type: string
          description: Directory path to list within the selected runtime volume.
          default: /
          title: Root Path
        description: Directory path to list within the selected runtime volume.
      - name: max_depth
        in: query
        required: false
        schema:
          type: integer
          maximum: 10
          minimum: 1
          description: Maximum directory depth to traverse while building the file
            tree.
          default: 3
          title: Max Depth
        description: Maximum directory depth to traverse while building the file tree.
      - name: max_entries
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Maximum total node entries to return while building the file
            tree.
          default: 200
          title: Max Entries
        description: Maximum total node entries to return while building the file
          tree.
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - const: daytona
            type: string
          - type: 'null'
          description: Optional runtime volume backend override. Defaults to the active
            sandbox provider.
          title: Provider
        description: Optional runtime volume backend override. Defaults to the active
          sandbox provider.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeTreeResponse'
        '401':
          description: Authentication is required or the provided token is invalid.
        '503':
          description: Runtime services are unavailable because server startup is
            incomplete.
        '400':
          description: The requested root path is invalid.
        '403':
          description: The requested root is outside the canonical runtime volume
            roots.
        '502':
          description: The runtime volume provider failed to list the requested path.
        '504':
          description: Volume listing timed out before the backend returned a result.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runtime/volume/file:
    get:
      tags:
      - runtime
      summary: Get Volume File Content
