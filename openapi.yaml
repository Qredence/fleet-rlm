          title: Byte Size
        checksum_sha256:
          type: string
          title: Checksum Sha256
      type: object
      required:
      - id
      - session_id
      - run_id
      - kind
      - media_type
      - byte_size
      - checksum_sha256
      title: ArtifactResponse
      description: Public artifact metadata — no host or Volume paths.
    AttachmentResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        filename:
          type: string
          title: Filename
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
        byte_size:
          type: integer
          title: Byte Size
        checksum_sha256:
          type: string
          title: Checksum Sha256
      type: object
      required:
      - id
      - filename
      - byte_size
      - checksum_sha256
      title: AttachmentResponse
      description: Public attachment metadata — no host or Volume paths.
    Body_upload_file_api_files_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_file_api_files_post
    CancelRunResponse:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        cancelled:
          type: boolean
          title: Cancelled
        already_cancelled:
          type: boolean
          title: Already Cancelled
      type: object
      required:
      - run_id
      - cancelled
      - already_cancelled
      title: CancelRunResponse
    ChatRequest:
      properties:
        message:
          type: string
          maxLength: 100000
          minLength: 1
          title: Message
        session_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Session Id
        attachment_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Attachment Ids
      type: object
      required:
      - message
      title: ChatRequest
      description: Body for POST /api/chat.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SessionCreateRequest:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Title
      type: object
      title: SessionCreateRequest
    SessionDetailResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        title:
          type: string
          title: Title
        status:
          type: string
          title: Status
        checkpoint_version:
          type: integer
          title: Checkpoint Version
        turn_count:
          type: integer
          title: Turn Count
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
      type: object
      required:
