      operationId: append_workspace_file_api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceFileAppendRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileEntryResponse'
        '400':
          description: Workspace file request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Workspace file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Workspace files are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Workspace file precondition did not match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/volume/tree:
    get:
      tags:
      - volume
      summary: List Volume Tree
      operationId: list_volume_tree_api
      parameters:
      - name: root
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
          default: .
          title: Root
      - name: max_depth
        in: query
        required: false
        schema:
          type: integer
          maximum: 32
          minimum: 1
          default: 8
          title: Max Depth
      - name: max_files
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          default: 2000
          title: Max Files
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeTreeResponse'
        '400':
          description: Volume tree request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Workspace Volume is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags:
      - health
      summary: Get Health
      description: 'Liveness: the process is serving HTTP regardless of composition
        state.'
      operationId: get_health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLivenessResponse'
  /health/ready:
    get:
      tags:
      - health
      summary: Get Readiness
      description: 'Readiness: composition installed and the configured database answers.'
      operationId: get_readiness
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadinessResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
