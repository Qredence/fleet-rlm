    SkillCardResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        scope:
          type: string
          title: Scope
        version:
          type: string
          title: Version
        trust:
          type: string
          title: Trust
        affordances:
