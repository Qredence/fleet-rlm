openapi: 3.1.0
info:
  title: Fleet-RLM Lite API
  version: 0.12.0
paths:
  /setup/status:
    get:
      tags:
      - setup
      summary: Status
      description: Return current readiness without triggering provider checks.
      operationId: status_setup_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
        '401':
          description: Operator token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '403':
          description: Loopback connection required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '404':
          description: Setup or operation unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '409':
          description: Operation or configuration conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '422':
          description: Invalid setup request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
      security:
      - HTTPBearer: []
  /setup/config:
    delete:
      tags:
      - setup
      summary: Discard Config
      description: Discard unsaved edits without changing the saved dotenv file.
      operationId: discard_config_setup_config_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
        '401':
          description: Operator token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '403':
          description: Loopback connection required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '404':
          description: Setup or operation unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '409':
          description: Operation or configuration conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '422':
          description: Invalid setup request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
      security:
      - HTTPBearer: []
    patch:
      tags:
      - setup
      summary: Edit Config
      description: Stage candidate edits without persisting them.
      operationId: edit_config_setup_config_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigEdit'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
        '401':
          description: Operator token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '403':
          description: Loopback connection required
          content:
            application/json:
