openapi: 3.1.0
info:
  title: fleet-rlm
  version: 0.7.6
paths:
  /api/sessions/{session_id}/turns:
    post:
      tags:
      - turns
      summary: Create Turn
      description: Stream one Turn, opening claim and preparation inside the SSE generator.
      operationId: create_turn
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTurnRequest'
      responses:
        '200':
          description: 'AI SDK UI v1 UIMessage SSE stream. It opens immediately with
            a transient data-status prelude (phase=preparation) that repeats every
            runtime heartbeat until the Turn is claimed and prepared. Claim or preparation
            failures no longer change the HTTP status: they project closed error +
            finish chunks inside the stream, and cancellation projects one abort chunk.'
          content:
            text/event-stream:
              itemSchema:
                type: object
                properties:
                  data:
                    type: string
                  event:
                    type: string
                  id:
                    type: string
                  retry:
                    type: integer
                    minimum: 0
              schema:
                type: string
              x-event-data-schema:
                $ref: '#/components/schemas/FleetUIMessageChunk'
          headers:
            Cache-Control:
              schema:
                type: string
            X-Accel-Buffering:
              schema:
                type: string
            x-vercel-ai-ui-message-stream:
              schema:
                type: string
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Turn unavailable while composition installs dependencies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - sessions
      summary: List Session Turns
      operationId: list_session_turns
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: after_sequence
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: After Sequence
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTurnPageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sessions:
    post:
      tags:
      - sessions
      summary: Create Session
      description: "Create a session for the authenticated user in the current workspace.\n\
        \nParameters:\n    body (SessionCreateRequest): Session creation data, including\
        \ the optional title.\n    identity (LocalScopeDep): Authenticated user and\
        \ workspace scope.\n    repo (SessionCatalogDep): Session repository used\
        \ to create the session.\n    prewarm (SessionPrewarmDep): Optional background\
        \ Sandbox pre-warm trigger.\n\nReturns:\n    SessionDetailResponse: The newly\
        \ created session details."
      operationId: create_session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - sessions
      summary: List Sessions
      operationId: list_sessions
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - active
            - archived
            type: string
          - type: 'null'
          title: Status
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Title contains
          title: Search
        description: Title contains
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sessions/{session_id}:
    get:
      tags:
      - sessions
      summary: Get Session
      operationId: get_session
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - sessions
      summary: Patch Session
      description: "Update the title or status of a session within the authenticated\
        \ user's workspace.\n\nParameters:\n    body (SessionPatchRequest): Fields\
        \ to update; at least one field is required.\n\nReturns:\n    SessionDetailResponse:\
        \ The updated session details.\n\nRaises:\n    HTTPException: If no fields\
        \ are provided, the title is blank, the status is invalid, or the\n      \
        \  session cannot be updated."
      operationId: update_session
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/attachments:
    post:
      tags:
      - attachments
      summary: Upload Attachment
      operationId: create_attachment
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_attachment'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/attachments/{attachment_id}:
    get:
      tags:
      - attachments
      summary: Get Attachment
      operationId: get_attachment
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attachment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/artifacts/{artifact_id}:
    get:
      tags:
      - artifacts
      summary: Get Artifact
      operationId: get_artifact
      parameters:
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Artifact Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/artifacts/{artifact_id}/content:
    get:
      tags:
      - artifacts
      summary: Download Artifact
      description: "Download an artifact within the caller's workspace scope.\n\n\
        Parameters:\n    artifact_id (UUID): Identifier of the artifact to download.\n\
        \nReturns:\n    Response: The artifact content with its media type and download\
        \ filename.\n\nRaises:\n    HTTPException: If the artifact is missing or artifact\
        \ storage is unavailable."
      operationId: download_artifact
      parameters:
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Artifact Id
      responses:
        '200':
          description: Artifact bytes with integrity headers
          headers:
            Content-Disposition:
              schema:
                type: string
            ETag:
              description: SHA-256 of the artifact bytes, quoted (e.g. "hex")
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
            X-Content-Type-Options:
              schema:
                type: string
        '404':
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Artifact storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/skills:
    get:
      tags:
      - skills
      summary: List Skills
      description: "List skill metadata available to the caller, optionally ranked\
        \ by a search query.\n\nParameters:\n    q (str | None): Optional query used\
        \ to rank skills by matching terms in their names or descriptions.\n\nReturns:\n\
        \    list[SkillCardResponse]: Response-formatted skill cards."
      operationId: list_skills
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional ranking query
          title: Q
        description: Optional ranking query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillCardResponse'
                title: Response List Skills
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/skills/{skill_id}:
    get:
      tags:
      - skills
      summary: Get Skill
      operationId: get_skill
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Skill Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillCardResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/runs/{run_id}/cancellation:
    put:
      tags:
      - runs
      summary: Request Run Cancellation
      description: "Request cancellation for a run.\n\nParameters:\n    run_id (UUID):\
        \ The identifier of the run to cancel.\n    identity (LocalScopeDep): The\
        \ authenticated user's workspace scope.\n    lifecycle (RunLifecycleDep):\
        \ The run lifecycle service.\n\nReturns:\n    CancellationResponse: The run\
        \ identifier and resulting cancellation state."
      operationId: request_run_cancellation
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/settings:
    get:
      tags:
      - settings
      summary: Get Settings Policy
      operationId: get_settings_policy
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsPolicyResponse'
    patch:
      tags:
      - settings
      summary: Patch Settings Policy
      description: "Update the settings policy's default profile or one atomic batch\
        \ of fields.\n\nParameters:\n    body (SettingsPolicyPatchRequest): The requested\
        \ profile, legacy field, or\n        batch update, including the expected\
        \ revision.\n\nReturns:\n    SettingsPolicyResponse: The updated settings\
        \ policy.\n\nRaises:\n    HTTPException: If the revision conflicts, the update\
        \ is invalid, or the policy is unavailable."
      operationId: update_settings_policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPolicyPatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsPolicyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/files:
    get:
      tags:
      - workspace-files
      summary: List Workspace Files
      operationId: list_workspace_files_api
      parameters:
      - name: path
        in: query
        required: false
        schema:
          type: string
          description: Workspace-relative path
          default: .
          title: Path
        description: Workspace-relative path
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
          title: Limit
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: After
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/files/stat:
    get:
      tags:
      - workspace-files
      summary: Stat Workspace File
      operationId: stat_workspace_file_api
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
          title: Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileEntryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/files/content:
    get:
      tags:
      - workspace-files
      summary: Read Workspace File
      operationId: read_workspace_file_api
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
          title: Path
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: max_chars
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          default: 10000
          title: Max Chars
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileReadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - workspace-files
      summary: Write Workspace File
      operationId: write_workspace_file_api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceFileWriteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileEntryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - workspace-files
      summary: Delete Workspace File
      operationId: delete_workspace_file_api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceFileDeleteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileDeleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - workspace-files
      summary: Patch Workspace File
      operationId: patch_workspace_file_api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceFilePatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileEntryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/files/append:
    post:
      tags:
      - workspace-files
      summary: Append Workspace File
      operationId: append_workspace_file_api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceFileAppendRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileEntryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/volume/tree:
    get:
      tags:
      - volume
      summary: List Volume Tree
      operationId: list_volume_tree_api
      parameters:
      - name: root
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
          default: .
          title: Root
      - name: max_depth
        in: query
        required: false
        schema:
          type: integer
          maximum: 32
          minimum: 1
          default: 8
          title: Max Depth
      - name: max_files
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          default: 2000
          title: Max Files
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeTreeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags:
      - health
      summary: Get Health
      description: 'Liveness: the process is serving HTTP regardless of composition
        state.'
      operationId: get_health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLivenessResponse'
  /health/ready:
    get:
      tags:
      - health
      summary: Get Readiness
      description: 'Readiness: composition installed and the configured database answers.'
      operationId: get_readiness
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadinessResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ArtifactResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        session_id:
          type: string
          format: uuid
          title: Session Id
        run_id:
          type: string
          format: uuid
          title: Run Id
        kind:
          type: string
          enum:
          - text
          - markdown
          - json
          title: Kind
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        media_type:
          type: string
          title: Media Type
        byte_size:
          type: integer
          title: Byte Size
        checksum_sha256:
          type: string
          title: Checksum Sha256
      type: object
      required:
      - id
      - session_id
      - run_id
      - kind
      - media_type
      - byte_size
      - checksum_sha256
      title: ArtifactResponse
      description: Public artifact metadata — no host or Volume paths.
    AttachmentResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        filename:
          type: string
          title: Filename
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
        byte_size:
          type: integer
          title: Byte Size
        checksum_sha256:
          type: string
          title: Checksum Sha256
      type: object
      required:
      - id
      - filename
      - byte_size
      - checksum_sha256
      title: AttachmentResponse
      description: Public attachment metadata — no host or Volume paths.
    Body_create_attachment:
      properties:
        attachment:
          type: string
          contentMediaType: application/octet-stream
          title: Attachment
      type: object
      required:
      - attachment
      title: Body_create_attachment
    CancellationResponse:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        state:
          type: string
          enum:
          - requested
          - already_requested
          - already_terminal
          title: State
      type: object
      required:
      - run_id
      - state
      title: CancellationResponse
    CreateTurnRequest:
      properties:
        text:
          type: string
          maxLength: 100000
          minLength: 1
          title: Text
        attachment_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Attachment Ids
        skill_selections:
          items:
            $ref: '#/components/schemas/SkillSelectionRequest'
          type: array
          maxItems: 4
          title: Skill Selections
      additionalProperties: false
      type: object
      required:
      - text
      title: CreateTurnRequest
      description: Canonical body for POST /api/sessions/{session_id}/turns.
    DataArtifactUIMessagePart:
      properties:
        data:
          $ref: '#/components/schemas/JsonValue'
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        type:
          type: string
          const: data-artifact
          title: Type
          default: data-artifact
      additionalProperties: false
      type: object
      required:
      - data
      title: DataArtifactUIMessagePart
    DataAttachmentUIMessagePart:
      properties:
        data:
          $ref: '#/components/schemas/JsonValue'
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        type:
          type: string
          const: data-attachment
          title: Type
          default: data-attachment
      additionalProperties: false
      type: object
      required:
      - data
      title: DataAttachmentUIMessagePart
    DataRLMCodeUIMessagePart:
      properties:
        data:
          $ref: '#/components/schemas/JsonValue'
        type:
          type: string
          const: data-rlm-code
          title: Type
          default: data-rlm-code
      additionalProperties: false
      type: object
      required:
      - data
      title: DataRLMCodeUIMessagePart
    DataRLMOutputUIMessagePart:
      properties:
        data:
          $ref: '#/components/schemas/JsonValue'
        type:
          type: string
          const: data-rlm-output
          title: Type
          default: data-rlm-output
      additionalProperties: false
      type: object
      required:
      - data
      title: DataRLMOutputUIMessagePart
    DataSkillUIMessagePart:
      properties:
        data:
          $ref: '#/components/schemas/JsonValue'
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        type:
          type: string
          const: data-skill
          title: Type
          default: data-skill
      additionalProperties: false
      type: object
      required:
      - data
      title: DataSkillUIMessagePart
    DataStatusUIMessagePart:
      properties:
        data:
          $ref: '#/components/schemas/JsonValue'
