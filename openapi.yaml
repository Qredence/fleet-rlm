        '422':
          description: Invalid setup request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupError'
      security:
      - HTTPBearer: []
  /setup/daytona/snapshot/build:
    post:
      tags:
      - setup
      summary: Build
      description: Start explicit snapshot construction from the packaged recipe.
      operationId: build_setup_daytona_snapshot_build_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Action'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStarted'
        '401':
