# Canonical non-secret process defaults for fleet-rlm.
# Precedence: typed defaults < this file < environment aliases < CLI overrides.
# Credentials belong in the environment or encrypted database storage, never here.

llm:
  roles:
    planner:
      model: null
      temperature: 0.0
      max_tokens: 2048
      request_timeout_s: 30
    delegate:
      model: null
      temperature: 0.0
      max_tokens: 4096
      request_timeout_s: 120
    delegate_small:
      model: null
      temperature: 0.0
      max_tokens: 2048
      request_timeout_s: 60
    judge:
      model: null
      temperature: 0.0
      max_tokens: 1024
      request_timeout_s: 60

rlm:
  max_iters: 20
  max_llm_calls: 50
  max_output_chars: 10000
  verbose: false
  recursion:
    max_depth: 2
    delegate_max_calls_per_turn: 8
    child_isolation_mode: auto
    child_fork_fallback: clean
daytona:
  api_url: null
  target: null
  volume_name: null
  execution_timeout_s: 900
  secret_name: LITELLM
  pool:
    max_concurrent_sandboxes: 5
  lifecycle:
    session_lifecycle: delete

persistence:
  database_required: false

observability:
  mlflow:
    enabled: false
    tracking_uri: null
    experiment_name: null
    auto_start: true

api:
  host: 0.0.0.0
  port: 8000
  auth_mode: dev
  cors_origins: [http://localhost:5173]
