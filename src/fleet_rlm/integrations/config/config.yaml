defaults:
  - _self_

llm:
  max_iters: 60
  model: ${oc.env:DSPY_LM_MODEL,openai/gemini-3-flash-preview}
  temperature: 1
  delegate_model: ${oc.env:DSPY_DELEGATE_LM_MODEL,null}
  delegate_small_model: ${oc.env:DSPY_DELEGATE_LM_SMALL_MODEL,null}
  max_tokens: ${oc.env:DSPY_LM_MAX_TOKENS,64000}
  delegate_max_tokens: ${oc.env:DSPY_DELEGATE_LM_MAX_TOKENS,64000}
  api_base: ${oc.env:DSPY_LM_API_BASE,null}
  adapter: ${oc.env:DSPY_ADAPTER,null}
  adapter_use_native_function_calling: ${oc.env:DSPY_ADAPTER_USE_NATIVE_FUNCTION_CALLING,false}
  rlm_max_iterations: 30
  guardrail_mode: "off"
  min_substantive_chars: 20

api_keys:
  llm_api_key: ${oc.env:DSPY_LLM_API_KEY,null}
  legacy_lm_api_key: ${oc.env:DSPY_LM_API_KEY,null}
  delegate_lm_api_key: ${oc.env:DSPY_DELEGATE_LM_API_KEY,null}
  daytona_api_key: ${oc.env:DAYTONA_API_KEY,null}
  posthog_api_key: ${oc.env:POSTHOG_API_KEY,null}

sandbox:
  provider: "daytona"
  image: "python:3.13-slim-bookworm"
  timeout: ${oc.env:TIMEOUT,900}
  secret_name: "LITELLM"
  daytona_api_url: ${oc.env:DAYTONA_API_URL,null}
  daytona_target: ${oc.env:DAYTONA_TARGET,null}
  async_execute: ${oc.env:INTERPRETER_ASYNC_EXECUTE,true}

volumes:
  name: ${oc.env:VOLUME_NAME,null}

database:
  url: ${oc.env:DATABASE_URL,null}
  admin_url: ${oc.env:DATABASE_ADMIN_URL,null}
  required: ${oc.env:DATABASE_REQUIRED,false}
  echo: ${oc.env:DB_ECHO,false}
  validate_on_startup: ${oc.env:DB_VALIDATE_ON_STARTUP,false}

memory:
  core_memory_limits:
    persona: 2000
    human: 2000
    scratchpad: 1000
  archival_path: "/data/memory"

rlm_settings:
  max_depth: 2
  max_iters: 60
  deep_max_iters: 60
  enable_adaptive_iters: true
  max_iterations: 60
  max_llm_calls: 50
  max_output_chars: 100000
  delegate_max_calls_per_turn: 8
  delegate_result_truncation_chars: 8000
  child_isolation_mode: ${oc.env:RLM_CHILD_ISOLATION_MODE,auto}
  child_fork_fallback: ${oc.env:RLM_CHILD_FORK_FALLBACK,clean}
  stdout_summary_threshold: 10000
  stdout_summary_prefix_len: 200
  verbose: True

analytics:
  posthog:
    enabled: ${oc.env:POSTHOG_ENABLED,true}
    api_key: ${oc.env:POSTHOG_API_KEY,null}
    host: ${oc.env:POSTHOG_HOST,https://eu.i.posthog.com}
    flush_interval: ${oc.env:POSTHOG_FLUSH_INTERVAL,10.0}
    flush_at: ${oc.env:POSTHOG_FLUSH_AT,10}
    enable_dspy_optimization: ${oc.env:POSTHOG_ENABLE_DSPY_OPTIMIZATION,false}
    input_truncation_chars: ${oc.env:POSTHOG_INPUT_TRUNCATION,10000}
    output_truncation_chars: ${oc.env:POSTHOG_OUTPUT_TRUNCATION,5000}
    redact_sensitive: ${oc.env:POSTHOG_REDACT_SENSITIVE,true}
  mlflow:
    enabled: ${oc.env:MLFLOW_ENABLED,true}
    tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,http://127.0.0.1:5001}
    experiment: ${oc.env:MLFLOW_EXPERIMENT,fleet-rlm}
    active_model_id: ${oc.env:MLFLOW_ACTIVE_MODEL_ID,null}
    dspy_log_traces_from_compile: ${oc.env:MLFLOW_DSPY_LOG_TRACES_FROM_COMPILE,false}
    dspy_log_traces_from_eval: ${oc.env:MLFLOW_DSPY_LOG_TRACES_FROM_EVAL,true}
    dspy_log_compiles: ${oc.env:MLFLOW_DSPY_LOG_COMPILES,false}
    dspy_log_evals: ${oc.env:MLFLOW_DSPY_LOG_EVALS,false}
