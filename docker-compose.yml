services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow-data:/mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts

volumes:
  mlflow-data:
