sonar.projectKey=Qredence_fleet-rlm
sonar.organization=qredence
sonar.sourceEncoding=UTF-8

# Keep analysis scope explicit rather than relying on the configuration beta.
sonar.scanner.autoconfig.enabled=false
sonar.sources=src/fleet_rlm,scripts
sonar.tests=tests
sonar.python.version=3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage/coverage.xml
# Repository tooling is analyzed, while coverage measures the shipped package.
sonar.coverage.exclusions=scripts/**

# The aggregate CircleCI quality job must wait for SonarQube's result.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
