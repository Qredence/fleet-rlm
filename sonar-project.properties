sonar.projectKey=Qredence_fleet-rlm
sonar.organization=qredence
sonar.sourceEncoding=UTF-8

# Keep analysis scope explicit rather than relying on the configuration beta.
sonar.scanner.autoconfig.enabled=false
sonar.sources=src/fleet_rlm,scripts
sonar.tests=tests
sonar.python.version=3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage/coverage.xml
# Repository tooling is analyzed, while coverage measures the shipped package.
sonar.coverage.exclusions=scripts/**

# The aggregate CircleCI quality job must wait for SonarQube's result.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# These standalone helpers execute generated Python/CLI requests inside Daytona,
# with the same filesystem authority as the calling REPL (not on the host).
# See docs/reference/sandbox-environment.md, "Bundled Skills" and AGENTS.md.
# S8707 models argparse as HTTP input and flags intentional sandbox file access.
# Keep the exceptions to the reviewed helper files; all other rules still apply.
sonar.issue.ignore.multicriteria=skillDelegationPaths,skillDocumentPaths,skillEditPaths,skillSearchPaths,skillRepoPaths,skillAuthorPaths,skillTablePaths,skillGitArgs,skillTempDirs
sonar.issue.ignore.multicriteria.skillDelegationPaths.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.skillDelegationPaths.resourceKey=src/fleet_rlm/bundled_skills/delegation/scripts/delegation_tools.py
sonar.issue.ignore.multicriteria.skillDocumentPaths.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.skillDocumentPaths.resourceKey=src/fleet_rlm/bundled_skills/document-extraction/scripts/doc_tools.py
sonar.issue.ignore.multicriteria.skillEditPaths.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.skillEditPaths.resourceKey=src/fleet_rlm/bundled_skills/file-editing/scripts/edit_tools.py
sonar.issue.ignore.multicriteria.skillSearchPaths.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.skillSearchPaths.resourceKey=src/fleet_rlm/bundled_skills/long-context-search/scripts/context_search.py
sonar.issue.ignore.multicriteria.skillRepoPaths.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.skillRepoPaths.resourceKey=src/fleet_rlm/bundled_skills/repository-inspection/scripts/fetch_repo.py
sonar.issue.ignore.multicriteria.skillAuthorPaths.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.skillAuthorPaths.resourceKey=src/fleet_rlm/bundled_skills/skill-creator/scripts/skill_tools.py
sonar.issue.ignore.multicriteria.skillTablePaths.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.skillTablePaths.resourceKey=src/fleet_rlm/bundled_skills/tabular-analysis/scripts/tabular_tools.py

# Git commands use argv lists without a shell. URLs, refs, path filters and
# numeric limits are validated before command construction; repo_dir is an
# intentional sandbox path passed as the separate value of Git's -C option.
sonar.issue.ignore.multicriteria.skillGitArgs.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.skillGitArgs.resourceKey=src/fleet_rlm/bundled_skills/repository-inspection/scripts/fetch_repo.py

# /tmp is only a parent: acquisition uses tempfile.mkdtemp (private, unique
# directories), never predictable shared filenames. cleanup_repo mentions /tmp
# to refuse deletion of that protected root. CLI --dest-root follows the same
# mkdtemp path. See repository-inspection/references/security-policy.md.
sonar.issue.ignore.multicriteria.skillTempDirs.ruleKey=python:S5443
sonar.issue.ignore.multicriteria.skillTempDirs.resourceKey=src/fleet_rlm/bundled_skills/repository-inspection/scripts/fetch_repo.py
