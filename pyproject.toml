[project]
name = "fleet-rlm"
version = "0.5.3"
description = "Recursive Language Models with DSPy + Daytona and an integrated Web UI for secure long-context code execution"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
authors = [{ name = "Qredence" }]
keywords = [
    "dspy",
    "llm",
    "daytona",
    "recursive-language-model",
    "rlm",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # dspy 3.2.0 hardened RLM/interpreter (kwargs-only tool dispatch, JSONRPC
    # bridge returns structured errors, subprocess replays tool/mount registration).
    # Includes `optuna` extra since MIPROv2 (used in mlflow_optimization.py) now
    # requires it explicitly — optuna was demoted to optional in 3.2.0 (#9397).
    "dspy[optuna]==3.2.0",
    "daytona>=0.171.0,<1",
    "hydra-core>=1.3,<2",
    "markitdown[all]>=0.1.0,<1",
    "pypdf>=6.10.2,<7",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.13.1,<3",
    "prompt-toolkit>=3.0.50,<4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3,<7",
    "rich>=14.3.3,<15",
    "structlog>=25.5.0,<26",
    "sqlmodel>=0.0.24",
    "aiosqlite>=0.20.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "typer>=0.21.1,<1",
    "posthog>=7.14.0",
    "asyncpg>=0.31.0,<1",
    "sqlalchemy[asyncio]>=2.0.49,<3",
    "psycopg>=3.3.2,<4",
    "fastapi[standard]==0.136.1",
    "uvicorn>=0.42.0,<1",
    "PyJWT>=2.12.1,<3",
    "mlflow>=3.12.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.0",
    "boto3>=1.43.4",
]

[project.urls]
Homepage = "https://github.com/qredence/fleet-rlm"
Repository = "https://github.com/qredence/fleet-rlm"
Issues = "https://github.com/qredence/fleet-rlm/issues"
Documentation = "https://fleet-rlm.readthedocs.io/"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]
server = [
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.3.2,<4",
    "scalar-fastapi>=1.8.2,<2",
    "uvicorn[standard]>=0.42.0,<1",
]
full = [
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.3.2,<4",
    "scalar-fastapi>=1.8.2,<2",
    "uvicorn[standard]>=0.42.0,<1",
]
evaluation = [
    "appnope==0.1.4",
    "asttokens==3.0.1",
    "comm==0.2.3",
    "debugpy==1.8.20",
    "decorator==5.2.1",
    "executing==2.2.1",
    "ipykernel==7.2.0",
    "ipython==9.13.0",
    "ipython-pygments-lexers==1.1.1",
    "jedi==0.19.2",
    "jupyter-client==8.8.0",
    "jupyter-core==5.9.1",
    "matplotlib-inline==0.2.1",
    "nest-asyncio==1.6.0",
    "parso==0.8.6",
    "pexpect==4.9.0",
    "psutil==7.2.2",
    "ptyprocess==0.7.0",
    "pure-eval==0.2.3",
    "pyzmq==27.1.0",
    "stack-data==0.6.3",
    "tornado==6.5.5",
    "traitlets==5.14.3",
]

[project.scripts]
fleet = "fleet_rlm.cli.main:main"
fleet-rlm = "fleet_rlm.cli.fleet_cli:main"

[tool.fastapi]
entrypoint = "asgi:app"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
    "ty>=0.0.34",
]

[tool.uv]
override-dependencies = [
    # LiteLLM 1.83.x pins older vulnerable releases; keep the resolver on
    # patched floors until upstream relaxes its metadata.
    "aiohttp>=3.13.4",
    "python-dotenv>=1.2.2",
    # GitPython <3.1.47 has two command-injection CVEs (Dependabot alerts).
    # mlflow-skinny is the only dependent; 3.1.47 is a drop-in upgrade.
    "gitpython>=3.1.47",
    # DSPy 3.2.0 pins litellm<=1.82.6 but >=1.83.7 is required to resolve 7 CVEs.
    # scorers.py no longer calls litellm directly (uses dspy.settings.lm instead),
    # so the only litellm consumer is DSPy itself — its stable completion() path
    # is unaffected by the 1.82→1.83 bump.
    "litellm>=1.83.7",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["fleet_rlm*"]
namespaces = false

[tool.setuptools.package-data]
"fleet_rlm.integrations.config" = ["*.yaml", "*.yml"]
"fleet_rlm" = ["py.typed"]
"fleet_rlm.ui" = ["dist/**/*", "dist/*"]
"fleet_rlm.scaffold" = [
    "skills/README.md",
    "skills/**/SKILL.md",
    "skills/**/*.md",
    "skills/**/*.py",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: unit test suite",
    "ui: UI/server test suite",
    "integration: integration test suite",
    "db: database-backed integration tests",
    "e2e: end-to-end test suite",
    "benchmark: performance/throughput benchmark tests",
    "live_llm: tests that require a live configured LM / LiteLLM backend",
    "live_daytona: tests that require a live Daytona backend and explicit opt-in",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    ".ruff_cache",
    "__pycache__",
    "node_modules",
    "build",
    "dist",
    ".egg-info",
]

[tool.ruff.lint]
# Essential rules: F (pyflakes), E/W (pycodestyle), I (isort), N (pep8-naming),
# B (flake8-bugbear), UP (pyupgrade), A (flake8-builtins),
# Q (flake8-quotes), T (flake8-print), D (pydocstyle), ARG (unused-arguments),
# RUF (ruff-specific), SIM (simplify), LOG (flake8-logging-usage).
# Several families are selected for targeted rules but temporarily ignored
# below until the existing repo-wide backlog is remediated.
# Note: COM (trailing commas) handled by formatter, so excluded to avoid conflicts
select = [
    "F",     # Pyflakes
    "E",     # Pycodestyle errors
    "W",     # Pycodestyle warnings
    "I001",  # Isort - import sorting
    "N",     # pep8-naming
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "A",     # flake8-builtins
    "Q",     # flake8-quotes
    "T20",   # flake8-print
    "D",     # pydocstyle
    "ARG",   # flake8-unused-arguments
    "RUF",   # ruff-specific rules
    "SIM",   # flake8-simplify
    "LOG",   # flake8-logging-usage
]

# Ignore specific rules that conflict or are too strict
ignore = [
    "D",      # Existing docstring backlog; keep docs quality checks separate.
    "E501",   # Line too long (handled by formatter)
    "ANN401", # Dynamically typed expressions (Any) allowed in certain contexts
    "A002",   # Existing builtin-shadowing backlog in tests.
    "ARG001", # Unused function arguments (common in callbacks/handlers)
    "ARG002", # Unused method arguments (common in inheritance)
    "ARG005", # Existing callback/lambda test fixture backlog.
    "B008",   # Existing Typer/default-call backlog.
    "B009",   # Existing dynamic getattr backlog in tests.
    "B010",   # Existing dynamic setattr backlog.
    "B904",   # Existing exception chaining backlog.
    "B905",   # Existing zip(strict=...) backlog.
    "T201",   # Existing CLI/script print backlog.
    "TRY003", # Avoid specifying long messages outside exception class (sometimes required)
    "UP037",  # Existing quoted annotation backlog.
    "UP041",  # Existing asyncio timeout alias backlog.
    "UP045",  # Existing Optional[...] annotation backlog.
    "UP012",  # Existing redundant encode() encoding backlog.
    "UP017",  # Existing datetime.timezone.utc backlog.
    "UP028",  # Existing yield-from simplification backlog.
    "UP033",  # Existing lru_cache(None) backlog.
    "UP034",  # Existing extraneous-parentheses backlog.
    "UP035",  # Existing deprecated import backlog.
    "UP042",  # Existing str + Enum backlog.
    "N802",   # Existing uppercase runtime callback name backlog.
    "N806",   # Existing uppercase local test-double backlog.
    "N818",   # Existing exception-name compatibility backlog.
    "LOG014", # Existing logging exc_info backlog.
    "LOG015", # Existing root logger backlog.
    "RUF001", # Existing intentional unicode CLI glyph backlog.
    "RUF003", # Existing intentional unicode comment backlog.
    "RUF010", # Existing explicit f-string conversion backlog.
    "RUF012", # Existing mutable class attribute test backlog.
    "RUF021", # Existing mixed boolean precedence backlog.
    "RUF022", # Existing __all__ ordering backlog.
    "RUF043", # Existing pytest match-pattern backlog.
    "RUF059", # Existing unused unpacked variable backlog.
    "RUF100", # Existing stale noqa backlog.
    "SIM102", # Existing collapsible-if backlog.
    "SIM103", # Existing return-condition simplification backlog.
    "SIM105", # Existing suppressible-exception backlog.
    "SIM108", # Existing ternary simplification backlog.
    "SIM110", # Existing any(...) simplification backlog.
    "SIM114", # Existing duplicate-branch simplification backlog.
    "SIM117", # Existing nested-with backlog.
    "SIM118", # Existing dict.keys() membership backlog.
    "SIM300", # Existing yoda-condition backlog.
]

# Per-file ignores for specific directories
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Allow star imports and unused imports in __init__
"tests/**" = ["ARG001", "ARG002", "D100", "D101", "D102", "D103"]  # Less strict for tests
"scripts/**" = ["D100", "D101", "D102", "D103"]  # Less strict for scripts
"setup.py" = ["D100"]  # Less strict for setup file

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = []

[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google-style docstrings

[tool.ruff.lint.isort]
known-first-party = ["fleet_rlm"]
known-third-party = ["dspy", "daytona"]
force-single-line = false

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ty.src]
exclude = [
    "tests/",
    "scripts/",
    "notebooks/",
    "test_modal_guard.py",
    "setup.py",
]

[tool.deptry]
# Exclude test directories and node_modules from import scanning
extend_exclude = ["node_modules/"]
# Ignore unused dependencies (DEP002) - many are transitive or used in optional extras
# Ignore missing dependencies (DEP001) - many are transitive deps of installed packages
ignore = ["DEP001", "DEP002"]
# Mark dev extra as development dependencies
pep621_dev_dependency_groups = ["dev"]
# Known first-party modules
known_first_party = ["fleet_rlm"]

[tool.deptry.package_module_name_map]
hydra-core = "hydra"
pydantic-settings = "pydantic_settings"
prompt-toolkit = "prompt_toolkit"
python-dotenv = "dotenv"
pyyaml = "yaml"
PyJWT = "jwt"
scalar-fastapi = "scalar_fastapi"
