[project]
name = "fleet-rlm"
version = "0.8.1"
description = "Lightweight session-isolated DSPy RLM runtime on Daytona with Postgres persistence, Skills, and MLflow evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
authors = [{ name = "Qredence" }]
keywords = [
    "dspy",
    "llm",
    "daytona",
    "recursive-language-model",
    "rlm",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # Flex is experimental; the lock pins DSPy 3.4.1 and GEPA 0.1.4 contracts.
    "dspy[typesafe]>=3.4.1,<3.5",
    "daytona==0.224.0",
    "mlflow==3.17.2",
    "databricks-sdk>=0.153.0,<1",
    "psycopg[binary]>=3.3.6,<4",
    "fastapi[standard]==0.162.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.54.0,<1",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3,<7",
    "httpx>=0.28.1,<1",
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.50,<4",
    "psycopg-pool>=3.2.6,<4",
    "textual>=8.2.8",
    "textual-serve>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/qredence/fleet-rlm"
Repository = "https://github.com/qredence/fleet-rlm"
Issues = "https://github.com/qredence/fleet-rlm/issues"
Documentation = "https://docs.qredence.ai/"

[project.scripts]
fleet = "fleet_rlm.cli:main"
fleet-rlm = "fleet_rlm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# The single dev dependency list (PEP 735). Local workflows install it via
# `uv sync --dev`; there is deliberately no published `dev` extra.
dev = [
    # `[tool.pytest]` needs pytest 9; keep Ruff in step with `.pre-commit-config.yaml`.
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17.1",
    "ty>=0.0.89",
    "pre-commit>=4.7.0",
    "pip-audit>=2.10.1,<3",
    "twine>=7.0.0,<8",
    "coverage>=7.6,<8",
]
# Notebook tooling; opt in with `uv sync --locked --group benchmarks`.
benchmarks = [
    "datasets>=5.1.0",
    "ipykernel>=7.4.0",
    "longcot @ git+https://github.com/LongHorizonReasoning/longcot@fb9649423f15f5b0091f8e988b100596cac592ca",
    "pandas>=3.0.6,<4",
    "python-dateutil>=2.9.0,<3",
]

[tool.uv]
# Solve the lock only for platforms Fleet actually targets (macOS dev, Linux
# CI/containers). Entries must be disjoint per uv's universal resolver. This
# keeps marker resolution deterministic across contributors and CI images;
# Windows is intentionally not covered by the lock.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
override-dependencies = [
    # LiteLLM 1.83.x pins older vulnerable releases; keep the resolver on
    # patched floors until upstream relaxes its metadata.
    "aiohttp>=3.14.4",
    # cryptography >=44.0.0,<50.0.0 exposes a PKCS#7 Bleichenbacher oracle.
    "cryptography>=50.0.0",
    # idna.encode() bypass advisory; force a patched release family.
    "idna>=3.16",
    # Mako <=1.3.11 allows TemplateLookup traversal with Windows backslash URIs.
    "mako>=1.3.12",
    # GitPython <3.2.1 is affected by CVE-2026-114145.
    "gitpython>=3.2.1",
    # Starlette <1.3.1 has form-limit DoS and request URL hostname parsing advisories.
    "starlette>=1.3.1",
    # litellm is installed only as DSPy's transitive dependency — fleet-rlm does
    # NOT declare it as a direct dep in `[project].dependencies` and does not
    # import it from `src/`. This override floor is the policy mechanism:
    # DSPy 3.4.0 accepts litellm>=1.65.8, but CVE-2026-114612 needs the 1.101.3
    # remediation. Pin it exactly so the fix moves nothing else; later releases
    # also downgrade filelock, which is a separate change to review.
    "litellm==1.101.3",
    # dnspython <2.9.0 has an advisory reachable through DNS resolution.
    "dnspython>=2.9.0",
    # urllib3 <2.7.0 has redirect header leak and streaming decompression issues.
    "urllib3>=2.7.0",
    # multidict <=6.9.0 has a memory leak in attacker-controlled item-view operations.
    "multidict>=6.9.1,<7",
    # Werkzeug <3.1.9 has a Windows path traversal issue in safe_join.
    "werkzeug>=3.1.9",
    # sqlparse <0.6.0 has multiple SQL parsing DoS and code-generation flaws.
    "sqlparse>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_rlm"]
force-include = { "src/fleet_rlm/sandbox/snapshots/snapshot-requirements.txt" = "fleet_rlm/sandbox/snapshots/snapshot-requirements.txt" }

# Ship only what builds and tests the package; agent, editor, and CI config stay out.
# Hatch always adds pyproject.toml, the readme, and the license files.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "config", "docs", "scripts", "openapi.yaml", "CHANGELOG.md"]

[tool.pytest]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-q"]
# strict_config, strict_markers, strict_parametrization_ids, strict_xfail; uv.lock pins pytest.
strict = true
asyncio_mode = "strict"

# Ruff infers the target version from `requires-python` and keeps its default excludes
# plus `.gitignore`.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Enforced across the repository. Exceptions are scoped to files whose public role makes
# the otherwise-disallowed construct intentional. The formatter owns quotes and trailing
# commas, so Q and COM are not selected. pydocstyle (D) applies to src/ public API.
select = [
    "F",     # Pyflakes
    "E",     # Pycodestyle errors
    "W",     # Pycodestyle warnings
    "I",     # Isort - import sorting
    "N",     # pep8-naming
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "A",     # flake8-builtins
    "T20",   # flake8-print
    "ARG",   # flake8-unused-arguments
    "RUF",   # ruff-specific rules
    "SIM",   # flake8-simplify
    "LOG",   # flake8-logging-usage
    "D",     # pydocstyle - public API in src/ carries hover docs
]
# Magic methods and `__init__` are described by the class docstring instead.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Scripts, notebooks, and `fleet optimize` intentionally print status output.
# Tests and scripts are not documented API, so pydocstyle does not apply to them.
[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T201", "D"]
"notebooks/**/*.ipynb" = ["T201"]
"tests/**/*.py" = ["D"]
"src/fleet_rlm/optimize/gepa.py" = ["T201"]
"src/fleet_rlm/optimize/dataset.py" = ["T201"]

[tool.ruff.format]
docstring-code-format = true

# ty infers the Python version from `requires-python`. `ty check` with no paths, the
# editor, pre-commit, and CI all check the same tree. Tests rely on duck-typed fakes and
# stay unchecked.
[tool.ty.src]
include = ["src"]

[tool.ty.rules]
deprecated = "error"
unused-ignore-comment = "error"

[tool.coverage.run]
branch = true
source = ["src/fleet_rlm"]

[tool.coverage.report]
fail_under = 80
show_missing = true
