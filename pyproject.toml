[project]
name = "fleet-rlm"
version = "0.7.0"
description = "RLM-native FastAPI backend with DSPy and Daytona"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
authors = [{ name = "Qredence" }]
keywords = [
    "dspy",
    "llm",
    "daytona",
    "recursive-language-model",
    "rlm",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # dspy 3.3.0b1 adds SandboxSerializable (#9411) used for native RLM
    # large-input handling. Pinned exactly: pre-release, and the runtime relies
    # on RLM internals that are private API.
    "dspy==3.3.0b1",
    # Sandboxed execution.
    "daytona==0.200.0",
    # Persistence and migrations.
    "aiosqlite>=0.20.0",
    "alembic>=1.18.5,<2",
    "asyncpg>=0.31.0,<1",
    "psycopg>=3.3.4,<4",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3,<7",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "tomli>=2.4.1; python_version < '3.11'",
    # Web API surface. Pinned exactly to 0.139.0 (latest PyPI release, Jul 1
    # 2026) for reproducible installs; bump deliberately when a newer release is
    # validated against the runtime + test suite.
    "fastapi[standard]==0.139.0",
    "uvicorn>=0.47.0,<1",
    "httpx2>=2.5.0",
    # MLflow 3 tracing: DSPy autolog + Databricks tracking backend.
    "mlflow>=3.14,<4",
    "tomlkit>=0.13,<1",
]

[project.urls]
Homepage = "https://github.com/qredence/fleet-rlm"
Repository = "https://github.com/qredence/fleet-rlm"
Issues = "https://github.com/qredence/fleet-rlm/issues"
Documentation = "https://fleet-rlm.readthedocs.io/"

[project.scripts]
fleet = "fleet_rlm.cli.main:fleet_main"
fleet-rlm = "fleet_rlm.cli.main:fleet_rlm_main"

[project.optional-dependencies]
# Keep this list mirrored with [dependency-groups].dev for packaged installs
# and local uv workflows.
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.15.20",
    "ty>=0.0.57",
]
server = [
    "psycopg[binary]>=3.3.4,<4",
    "uvicorn[standard]>=0.47.0,<1",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.fastapi]
entrypoint = "fleet_rlm.main:app"

[dependency-groups]
# Mirrors the published dev extra for local workspace management via uv.
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.15.20",
    "ty>=0.0.50",
]

[tool.uv]
override-dependencies = [
    # LiteLLM 1.83.x pins older vulnerable releases; keep the resolver on
    # patched floors until upstream relaxes its metadata.
    "aiohttp>=3.13.4",
    # idna.encode() bypass advisory; force a patched release family.
    "idna>=3.16",
    # Mako <=1.3.11 allows TemplateLookup traversal with Windows backslash URIs.
    "mako>=1.3.12",
    "python-dotenv>=1.2.2",
    # GitPython <=3.1.49 allows config_writer() newline injection.
    "gitpython>=3.1.50",
    # Starlette <1.3.1 has form-limit DoS and request URL hostname parsing advisories.
    "starlette>=1.3.1",
    # litellm is installed only as DSPy's transitive dependency — fleet-rlm does
    # NOT declare it as a direct dep in `[project].dependencies` and does not
    # import it from `src/`. This override pin is the policy mechanism: DSPy
    # 3.2.x pins litellm<=1.82.6 but >=1.83.7 is required to resolve 7 CVEs,
    # and DSPy's stable completion() path is unaffected by the 1.82→1.83 bump.
    "litellm>=1.87.0",
    # urllib3 <2.7.0 has redirect header leak and streaming decompression issues.
    "urllib3>=2.7.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["fleet_rlm*"]
namespaces = false

[tool.setuptools.package-data]
"fleet_rlm" = [
    "py.typed",
    "skills/bundled/README.md",
    "skills/bundled/**/SKILL.md",
    "skills/bundled/**/*.md",
    "skills/bundled/**/*.py",
    "skills/bundled/**/*.txt",
    "skills/bundled/**/*.json",
    "skills/bundled/**/*.yaml",
    "skills/bundled/**/*.yml",
    "skills/bundled/**/*.toml",
    "skills/bundled/**/*.csv",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
junit_family = "xunit1"
addopts = "-q --strict-markers --timeout=30"
timeout_method = "thread"
markers = [
    "unit: fast isolated tests",
    "integration: cross-boundary tests",
    "contracts: stable behavioral invariants",
    "db: requires live database",
    "e2e: full stack smoke tests",
    "benchmark: performance/throughput benchmark tests",
    "deno: requires the pinned Deno runtime but no provider network access",
    "live_llm: tests that require a live configured LM / LiteLLM backend",
    "live_daytona: tests that require a live Daytona backend and explicit opt-in",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    ".ruff_cache",
    "__pycache__",
    "node_modules",
    "build",
    "dist",
    ".egg-info",
]

[tool.ruff.lint]
# Selected families: F (pyflakes), E/W (pycodestyle), I (isort), N (pep8-naming),
# B (flake8-bugbear), UP (pyupgrade), A (flake8-builtins), Q (flake8-quotes),
# T20 (flake8-print), ARG (unused-arguments), RUF (ruff-specific), SIM (simplify),
# LOG (flake8-logging-usage).
# Several selected families are partially suppressed in `ignore` until the
# repo-wide backlog is remediated one rule (or small cluster) at a time.
# pydocstyle (D) is not selected; enable only after a dedicated docstring pass.
# Note: COM (trailing commas) handled by formatter, so excluded to avoid conflicts
select = [
    "F",     # Pyflakes
    "E",     # Pycodestyle errors
    "W",     # Pycodestyle warnings
    "I001",  # Isort - import sorting
    "N",     # pep8-naming
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "A",     # flake8-builtins
    "Q",     # flake8-quotes
    "T20",   # flake8-print
    "ARG",   # flake8-unused-arguments
    "RUF",   # ruff-specific rules
    "SIM",   # flake8-simplify
    "LOG",   # flake8-logging-usage
]

# Permanent policy: E501 (formatter-owned). Remaining entries are temporary
# backlog suppressions — prefer fix+re-enable or per-file scope over growth.
ignore = [
    "E501",   # Line too long (handled by formatter)
    "A002",   # Existing builtin-shadowing backlog in tests.
    "ARG001", # Unused function arguments (common in callbacks/handlers)
    "ARG002", # Unused method arguments (common in inheritance)
    "ARG005", # Existing callback/lambda test fixture backlog.
    "B008",   # Existing Typer/default-call backlog.
    "B009",   # Existing dynamic getattr backlog in tests.
    "B010",   # Existing dynamic setattr backlog.
    "B904",   # Existing exception chaining backlog.
    "B905",   # Existing zip(strict=...) backlog.
    "T201",   # Existing CLI/script print backlog.
    "UP037",  # Existing quoted annotation backlog.
    "UP041",  # Existing asyncio timeout alias backlog.
    "UP045",  # Existing Optional[...] annotation backlog.
    "UP012",  # Existing redundant encode() encoding backlog.
    "UP017",  # Existing datetime.timezone.utc backlog.
    "UP028",  # Existing yield-from simplification backlog.
    "UP033",  # Existing lru_cache(None) backlog.
    "UP034",  # Existing extraneous-parentheses backlog.
    "UP035",  # Existing deprecated import backlog.
    "UP042",  # Existing str + Enum backlog.
    "N802",   # Existing uppercase runtime callback name backlog.
    "N806",   # Existing uppercase local test-double backlog.
    "N818",   # Existing exception-name compatibility backlog.
    "LOG014", # Existing logging exc_info backlog.
    "LOG015", # Existing root logger backlog.
    "RUF001", # Existing intentional unicode CLI glyph backlog.
    "RUF003", # Existing intentional unicode comment backlog.
    "RUF010", # Existing explicit f-string conversion backlog.
    "RUF012", # Existing mutable class attribute test backlog.
    "RUF021", # Existing mixed boolean precedence backlog.
    "RUF022", # Existing __all__ ordering backlog.
    "RUF043", # Existing pytest match-pattern backlog.
    "RUF059", # Existing unused unpacked variable backlog.
    "RUF100", # Existing stale noqa backlog.
    "SIM102", # Existing collapsible-if backlog.
    "SIM103", # Existing return-condition simplification backlog.
    "SIM105", # Existing suppressible-exception backlog.
    "SIM108", # Existing ternary simplification backlog.
    "SIM110", # Existing any(...) simplification backlog.
    "SIM114", # Existing duplicate-branch simplification backlog.
    "SIM117", # Existing nested-with backlog.
    "SIM118", # Existing dict.keys() membership backlog.
    "SIM300", # Existing yoda-condition backlog.
]

# Per-file ignores for specific directories
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Allow star imports and unused imports in __init__

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = []

# Applied when D is selected in a future docstring-enforcement mission.
[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google-style docstrings

[tool.ruff.lint.isort]
known-first-party = ["fleet_rlm"]
known-third-party = ["dspy", "daytona"]
force-single-line = false

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ty.src]
exclude = [
    "tests/",
    "scripts/",
    "notebooks/",
]

[tool.deptry]
# Exclude test directories and node_modules from import scanning
extend_exclude = ["node_modules/"]
# Ignore unused dependencies (DEP002) - many are transitive or used in optional extras
# Ignore missing dependencies (DEP001) - many are transitive deps of installed packages
ignore = ["DEP001", "DEP002"]
# Mark dev extra as development dependencies
pep621_dev_dependency_groups = ["dev"]
# Known first-party modules
known_first_party = ["fleet_rlm"]

[tool.deptry.package_module_name_map]
pydantic-settings = "pydantic_settings"
prompt-toolkit = "prompt_toolkit"
python-dotenv = "dotenv"
pyyaml = "yaml"
scalar-fastapi = "scalar_fastapi"
