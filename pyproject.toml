[project]
name = "fleet-rlm"
version = "0.8.0"
description = "Lightweight session-isolated DSPy RLM runtime on Daytona with Postgres persistence, Skills, and MLflow evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
authors = [{ name = "Qredence" }]
keywords = [
    "dspy",
    "llm",
    "daytona",
    "recursive-language-model",
    "rlm",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "dspy[typesafe]==3.4.1",
    "daytona==0.224.0",
    "mlflow==3.17.1",
    "databricks-sdk>=0.139.0,<1",
    "psycopg[binary]>=3.3.6,<4",
    "fastapi[standard]==0.142.2",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.54.0,<1",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3,<7",
    "httpx>=0.28.1,<1",
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.50,<4",
    "databricks-agents>=1.12.0",
]

[project.urls]
Homepage = "https://github.com/qredence/fleet-rlm"
Repository = "https://github.com/qredence/fleet-rlm"
Issues = "https://github.com/qredence/fleet-rlm/issues"
Documentation = "https://docs.qredence.ai/"

[project.scripts]
fleet = "fleet_rlm.cli:main"
fleet-rlm = "fleet_rlm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# The single dev dependency list (PEP 735). Local workflows install it via
# `uv sync --dev`; there is deliberately no published `dev` extra.
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "ty>=0.0.84",
    "pre-commit>=4.6.2",
]

[tool.uv]
# Solve the lock only for platforms Fleet actually targets (macOS dev, Linux
# CI/containers). Entries must be disjoint per uv's universal resolver. This
# keeps marker resolution deterministic across contributors and CI images;
# Windows is intentionally not covered by the lock.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
override-dependencies = [
    # LiteLLM 1.83.x pins older vulnerable releases; keep the resolver on
    # patched floors until upstream relaxes its metadata.
    "aiohttp>=3.14.3",
    # cryptography >=44.0.0,<50.0.0 exposes a PKCS#7 Bleichenbacher oracle.
    "cryptography>=50.0.0",
    # idna.encode() bypass advisory; force a patched release family.
    "idna>=3.16",
    # Mako <=1.3.11 allows TemplateLookup traversal with Windows backslash URIs.
    "mako>=1.3.12",
    # Duplicate of the direct floor below; retained so `uv lock --check`
    # stays green without a lock refresh (config-only change lane).
    "python-dotenv>=1.2.3",
    # GitPython <=3.1.57 allows unsafe git option forwarding and path access.
    "gitpython>=3.1.58",
    # Starlette <1.3.1 has form-limit DoS and request URL hostname parsing advisories.
    "starlette>=1.3.1",
    # litellm is installed only as DSPy's transitive dependency — fleet-rlm does
    # NOT declare it as a direct dep in `[project].dependencies` and does not
    # import it from `src/`. This override floor is the policy mechanism:
    # DSPy 3.4.0 accepts litellm>=1.65.8, but the CVE remediation family
    # requires >=1.83.7 and the reviewed floor is pinned below.
    "litellm>=1.87.0",
    # urllib3 <2.7.0 has redirect header leak and streaming decompression issues.
    "urllib3>=2.7.0",
    # sqlparse <0.6.0 has multiple SQL parsing DoS and code-generation flaws.
    "sqlparse>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_rlm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "strict"
markers = [
    "unit: fast isolated tests",
    "integration: cross-boundary tests",
    "live_daytona: requires an explicitly configured Daytona account and Volume",
    "live_llm: requires an explicitly configured model provider",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    ".ruff_cache",
    "__pycache__",
    "node_modules",
    "build",
    "dist",
    ".egg-info",
]

[tool.ruff.lint]
# Selected families: F (pyflakes), E/W (pycodestyle), I (isort), N (pep8-naming),
# B (flake8-bugbear), UP (pyupgrade), A (flake8-builtins), Q (flake8-quotes),
# T20 (flake8-print), ARG (unused-arguments), RUF (ruff-specific), SIM (simplify),
# LOG (flake8-logging-usage).
# Selected rules are enforced across the repository. Exceptions are scoped to
# files whose public role makes the otherwise-disallowed construct intentional.
# pydocstyle (D) is not selected; enable only after a dedicated docstring pass.
# Note: COM (trailing commas) handled by formatter, so excluded to avoid conflicts
select = [
    "F",     # Pyflakes
    "E",     # Pycodestyle errors
    "W",     # Pycodestyle warnings
    "I",     # Isort - import sorting
    "N",     # pep8-naming
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "A",     # flake8-builtins
    "Q",     # flake8-quotes
    "T20",   # flake8-print
    "ARG",   # flake8-unused-arguments
    "RUF",   # ruff-specific rules
    "SIM",   # flake8-simplify
    "LOG",   # flake8-logging-usage
]

# Scripts bootstrap the repo root onto sys.path, then print CLI output.
[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["T201"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = []

# Applied when D is selected in a future docstring-enforcement mission.
[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google-style docstrings

[tool.ruff.lint.isort]
known-first-party = ["fleet_rlm"]
force-single-line = false

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ty.src]
exclude = ["tests/", "scripts/"]
