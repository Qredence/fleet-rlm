[project]
name = "fleet-rlm"
version = "0.7.0"
description = "RLM-native FastAPI backend with DSPy and Daytona"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
authors = [{ name = "Qredence" }]
keywords = [
    "dspy",
    "llm",
    "daytona",
    "recursive-language-model",
    "rlm",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # dspy 3.3.x provides the native RLM and SandboxSerializable contracts used
    # by Fleet. Pin the 3.3 line: assert_dspy_version() accepts 3.3.x patches
    # and rejects other minors, and the runtime relies on the documented RLM
    # interface plus the private interpreter-injection seam isolated in
    # rlm.dspy_contract.
    "dspy>=3.3.0,<3.4",
    "packaging>=24,<27",
    # Sandboxed execution.
    "daytona==0.202.0",
    # Persistence and migrations.
    "aiosqlite>=0.20.0",
    "alembic>=1.18.5,<2",
    "asyncpg>=0.31.0,<1",
    "psycopg>=3.3.4,<4",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3,<7",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "tomli>=2.4.1; python_version < '3.11'",
    # Web API surface. Pinned exactly to 0.141.1 (latest PyPI release, Jul 29
    # 2026) for reproducible installs; bump deliberately when a newer release is
    # validated against the runtime + test suite.
    "fastapi[standard]==0.141.1",
    "uvicorn>=0.47.0,<1",
    "httpx2>=2.5.0",
    # Pooled HTTP client for the Daytona tool broker poll/fulfill loop:
    # connection reuse through the preview proxy. Transitive via the Daytona
    # SDK; declared direct because http_broker imports it.
    "httpx>=0.28,<1",
    # Host-side public URL Tools pin validated addresses and stream bounded
    # responses without inheriting ambient proxy configuration.
    "urllib3>=2.7,<3",
    # MLflow 3 tracing: DSPy autolog + Databricks tracking backend.
    "mlflow>=3.15,<4",
    "tomlkit>=0.13,<1",
]

[project.urls]
Homepage = "https://github.com/qredence/fleet-rlm"
Repository = "https://github.com/qredence/fleet-rlm"
Issues = "https://github.com/qredence/fleet-rlm/issues"
Documentation = "https://fleet-rlm.readthedocs.io/"

[project.scripts]
fleet = "fleet_rlm.cli.main:fleet_main"
fleet-rlm = "fleet_rlm.cli.main:fleet_rlm_main"

[project.optional-dependencies]
# Keep this list mirrored with [dependency-groups].dev for packaged installs
# and local uv workflows.
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1,<8",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]
server = [
    "psycopg[binary]>=3.3.4,<4",
    "uvicorn[standard]>=0.47.0,<1",
]
benchmark = [
    "databricks-agents>=1.5",
]
optimize = [
    # gepa pinned to the omni-capable commit below; see [tool.uv].
    "gepa>=0.1.1",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.fastapi]
entrypoint = "fleet_rlm.main:app"

[dependency-groups]
# Mirrors the published dev extra for local workspace management via uv.
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1,<8",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.uv]
override-dependencies = [
    # LiteLLM 1.83.x pins older vulnerable releases; keep the resolver on
    # patched floors until upstream relaxes its metadata.
    "aiohttp>=3.13.4",
    # idna.encode() bypass advisory; force a patched release family.
    "idna>=3.16",
    # Mako <=1.3.11 allows TemplateLookup traversal with Windows backslash URIs.
    "mako>=1.3.12",
    "python-dotenv>=1.2.2",
    # GitPython <=3.1.49 allows config_writer() newline injection.
    "gitpython>=3.1.50",
    # Starlette <1.3.1 has form-limit DoS and request URL hostname parsing advisories.
    "starlette>=1.3.1",
    # litellm is installed only as DSPy's transitive dependency — fleet-rlm does
    # NOT declare it as a direct dep in `[project].dependencies` and does not
    # import it from `src/`. This override pin is the policy mechanism: DSPy
    # 3.2.x pins litellm<=1.82.6 but >=1.83.7 is required to resolve 7 CVEs,
    # and DSPy's stable completion() path is unaffected by the 1.82→1.83 bump.
    "litellm>=1.87.0",
    # urllib3 <2.7.0 has redirect header leak and streaming decompression issues.
    "urllib3>=2.7.0",
    # Deliberate gepa override: the current dspy 3.3.0 lock declares
    # gepa[dspy]==0.1.1, but
    # the optimizer lane needs the omni API (optimize_best_of / gepa.oa
    # engines), which exists only on the gepa main branch as of 2026-08. This
    # pinned commit is what the 2026-07-22 omni blog documents. Fleet's Turn
    # path never invokes dspy.GEPA; coexistence of the current dspy 3.3.0 lock with this gepa
    # commit is validated by `make check` (2026-08 omni spike). Revisit when
    # the DSPy gepa[dspy] constraint moves or a PyPI release ships the omni API.
    "gepa @ git+https://github.com/gepa-ai/gepa@0310bb7b4952d4695718f9f557e450fd6781301e",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["fleet_rlm*"]
namespaces = false

[tool.setuptools.package-data]
"fleet_rlm" = [
    "py.typed",
    "daytona/snapshot-requirements.txt",
    "skills/bundled/README.md",
    "skills/bundled/**/SKILL.md",
    "skills/bundled/**/*.md",
    "skills/bundled/**/*.py",
    "skills/bundled/**/*.txt",
    "skills/bundled/**/*.json",
    "skills/bundled/**/*.yaml",
    "skills/bundled/**/*.yml",
    "skills/bundled/**/*.toml",
    "skills/bundled/**/*.csv",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
junit_family = "xunit1"
addopts = "-q --strict-markers --timeout=30"
timeout_method = "thread"
markers = [
    "unit: fast isolated tests",
    "integration: cross-boundary tests",
    "contracts: stable behavioral invariants",
    "db: requires live database",
    "e2e: full stack smoke tests",
    "benchmark: performance/throughput benchmark tests",
    "live_llm: tests that require a live configured LM / LiteLLM backend",
    "live_daytona: tests that require a live Daytona backend and explicit opt-in",
]

[tool.coverage.run]
branch = true
# Project-wide scope: all backend modules are measured, not only daytona/.
# The daytona subpackage remains visible per-file in the coverage report.
source = ["src/fleet_rlm"]

[tool.coverage.report]
# Project-wide floor.  Raised from the legacy daytona-only 70% gate after
# extending scope; current full-package coverage is ~82%.
fail_under = 75
precision = 1
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    ".ruff_cache",
    "__pycache__",
    "node_modules",
    "build",
    "dist",
    ".egg-info",
]

[tool.ruff.lint]
# Selected families: F (pyflakes), E/W (pycodestyle), I (isort), N (pep8-naming),
# B (flake8-bugbear), UP (pyupgrade), A (flake8-builtins), Q (flake8-quotes),
# T20 (flake8-print), ARG (unused-arguments), RUF (ruff-specific), SIM (simplify),
# LOG (flake8-logging-usage).
# Selected rules are enforced across the repository. Exceptions are scoped to
# files whose public role makes the otherwise-disallowed construct intentional.
# pydocstyle (D) is not selected; enable only after a dedicated docstring pass.
# Note: COM (trailing commas) handled by formatter, so excluded to avoid conflicts
select = [
    "F",     # Pyflakes
    "E",     # Pycodestyle errors
    "W",     # Pycodestyle warnings
    "I001",  # Isort - import sorting
    "N",     # pep8-naming
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "A",     # flake8-builtins
    "Q",     # flake8-quotes
    "T20",   # flake8-print
    "ARG",   # flake8-unused-arguments
    "RUF",   # ruff-specific rules
    "SIM",   # flake8-simplify
    "LOG",   # flake8-logging-usage
]

# Public package re-exports and standalone script stdout are intentional.
# Scripts bootstrap the repo root onto sys.path before sibling imports so they
# run both as package modules and as direct file paths.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"scripts/**/*.py" = ["E402", "T201"]
"src/fleet_rlm/skills/bundled/**/scripts/*.py" = ["T201"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = []

# Applied when D is selected in a future docstring-enforcement mission.
[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google-style docstrings

[tool.ruff.lint.isort]
known-first-party = ["fleet_rlm"]
known-third-party = ["dspy", "daytona"]
force-single-line = false

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ty.src]
exclude = [
    "tests/",
    "scripts/",
    "notebooks/",
]

[tool.deptry]
# Exclude test directories and node_modules from import scanning
extend_exclude = ["node_modules/"]
# Ignore unused dependencies (DEP002) - many are transitive or used in optional extras
# Ignore missing dependencies (DEP001) - many are transitive deps of installed packages
ignore = ["DEP001", "DEP002"]
# Mark dev extra as development dependencies
pep621_dev_dependency_groups = ["dev"]
# Known first-party modules
known_first_party = ["fleet_rlm"]

[tool.deptry.package_module_name_map]
pydantic-settings = "pydantic_settings"
python-dotenv = "dotenv"
pyyaml = "yaml"
