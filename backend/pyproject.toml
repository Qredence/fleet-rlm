[project]
name = "fleet-rlm"
version = "0.14.0"
description = "Stateless recursive agent workspace powered by DSPy 3.5 RLM, Daytona sandboxes, Neon Postgres 18, and MLflow"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Qredence" }]
keywords = [
    "dspy",
    "llm",
    "daytona",
    "recursive-language-model",
    "rlm",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.0",
    "dspy==3.5.0",
    "daytona[otel]==2.1.0",
    "boto3>=1.43.0,<2",
    "sqlalchemy[asyncio]>=2.1.9",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.2",
    "mlflow>=3.18.0",
    "cryptography>=50.0.2",
]

[project.urls]
Homepage = "https://github.com/qredence/fleet-rlm"
Repository = "https://github.com/qredence/fleet-rlm"
Issues = "https://github.com/qredence/fleet-rlm/issues"
Documentation = "https://docs.qredence.ai/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "import-linter>=2.1",
    "ty>=0.0.107",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ty.environment]
python-version = "3.13"

[tool.importlinter]
root_package = "fleet_rlm"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Backend dependency layers"
type = "layers"
layers = [
    "fleet_rlm.api | fleet_rlm.optimize",
    "fleet_rlm.ui_stream | (fleet_rlm.opt_runner)",
    "fleet_rlm.agent | fleet_rlm.skills | fleet_rlm.interpreter | fleet_rlm.db | fleet_rlm.storage",
    "fleet_rlm.llm_registry | fleet_rlm.opt_datasets",
    "fleet_rlm.config",
]

[[tool.importlinter.contracts]]
name = "Database, interpreter, storage, and skills are independent"
# A single layer of independent siblings supports modules that arrive in Phase 2.
type = "layers"
layers = ["fleet_rlm.db | (fleet_rlm.interpreter) | (fleet_rlm.skills) | (fleet_rlm.storage)"]

[[tool.importlinter.contracts]]
name = "Only the API imports the UI stream mapper"
type = "protected"
protected_modules = ["fleet_rlm.ui_stream"]
allowed_importers = ["fleet_rlm.api"]
as_packages = false

[[tool.importlinter.contracts]]
name = "Offline optimizer never imports the API or UI stream"
type = "forbidden"
source_modules = ["fleet_rlm.optimize"]
forbidden_modules = ["fleet_rlm.api", "fleet_rlm.ui_stream"]

[[tool.importlinter.contracts]]
name = "Only interpreter imports daytona"
type = "forbidden"
source_modules = [
    "fleet_rlm.api",
    "fleet_rlm.optimize",
    "fleet_rlm.ui_stream",
    "fleet_rlm.agent",
    "fleet_rlm.skills",
    "fleet_rlm.db",
    "fleet_rlm.storage",
    "fleet_rlm.llm_registry",
    "fleet_rlm.opt_datasets",
    "fleet_rlm.config",
]
forbidden_modules = ["daytona"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only api imports fastapi"
type = "forbidden"
source_modules = [
    "fleet_rlm.optimize",
    "fleet_rlm.ui_stream",
    "fleet_rlm.agent",
    "fleet_rlm.skills",
    "fleet_rlm.interpreter",
    "fleet_rlm.db",
    "fleet_rlm.storage",
    "fleet_rlm.llm_registry",
    "fleet_rlm.opt_datasets",
    "fleet_rlm.config",
]
forbidden_modules = ["fastapi"]

[[tool.importlinter.contracts]]
name = "Only storage imports the S3 SDK"
type = "forbidden"
source_modules = [
    "fleet_rlm.api",
    "fleet_rlm.optimize",
    "fleet_rlm.ui_stream",
    "fleet_rlm.agent",
    "fleet_rlm.skills",
    "fleet_rlm.interpreter",
    "fleet_rlm.db",
    "fleet_rlm.llm_registry",
    "fleet_rlm.opt_datasets",
    "fleet_rlm.config",
]
forbidden_modules = ["boto3", "botocore"]
allow_indirect_imports = true

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["src"]
only-include = ["src/fleet_rlm", "skills"]
exclude = ["skills/.*", "**/__pycache__"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"skills" = "fleet_rlm/bundled_skills"
