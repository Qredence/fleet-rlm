approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
model_verbosity = "low"

[features]
hooks = true
multi_agent = true
context_management.experimental_mode = true

[hooks]

# Migrated from deprecated .codex/hooks.json
[[hooks.PreToolUse]]
matcher = "Bash(git commit*)"

[agents]
max_threads = 8
max_depth = 1
job_max_runtime_seconds = 3600

[sandbox_workspace_write]
network_access = true
