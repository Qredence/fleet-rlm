approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
model_verbosity = "low"
[features]
hooks = true
multi_agent = true

[hooks]

# Migrated from deprecated .codex/hooks.json
[[hooks.PreToolUse]]
matcher = "Bash(git commit*)"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "make test"
timeout = 300

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "chunk validate"
timeout = 330

[agents]
max_threads = 8
max_depth = 1
job_max_runtime_seconds = 3600

[sandbox_workspace_write]
network_access = true
