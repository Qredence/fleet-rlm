version = 1
name = "fleet-rlm"

[setup]
script = ".codex/workspace-bootstrap.zsh"

[[actions]]
name = "Setup: Bootstrap Workspace"
icon = "run"
command = "zsh .codex/workspace-bootstrap.zsh"

[[actions]]
name = "App: Run API"
icon = "run"
command = "uv run fleet web"

[[actions]]
name = "App: Serve API on 8000"
icon = "run"
command = "uv run fleet-rlm serve-api --port 8000"

[[actions]]
name = "Terminal Client: Install"
icon = "run"
command = "pnpm --dir tools/fleet-tui install --frozen-lockfile"

[[actions]]
name = "Terminal Client: Run"
icon = "run"
command = "pnpm --dir tools/fleet-tui start"

[[actions]]
name = "Terminal Client: Test"
icon = "test"
command = "pnpm --dir tools/fleet-tui test"

[[actions]]
name = "Terminal Client: Typecheck"
icon = "check"
command = "pnpm --dir tools/fleet-tui typecheck"

[[actions]]
name = "Backend: Format"
icon = "check"
command = "make format"

[[actions]]
name = "Backend: Check"
icon = "check"
command = "make check"

[[actions]]
name = "Backend: Unit Tests"
icon = "test"
command = "make test-unit"

[[actions]]
name = "Repo: Docs Check"
icon = "docs"
command = "make check-docs"

[[actions]]
name = "Repo: Release Check"
icon = "check"
command = "make check-release"

[[actions]]
name = "Repo: Security Check"
icon = "shield"
command = "make check-security"

[[actions]]
name = "Repo: Dependency Check"
icon = "check"
command = "make check-deps"

[[actions]]
name = "OpenAPI: Check"
icon = "check"
command = "make api-check"

[[actions]]
name = "OpenAPI: Sync"
icon = "sync"
command = "make api-sync"

[[actions]]
name = "Release: Build Artifacts"
icon = "build"
command = "make build-release"

[[actions]]
name = "Cloud: FastAPI Preflight"
icon = "check"
command = "make cloud-preflight"

[[actions]]
name = "CLI: Help"
icon = "docs"
command = "make cli-help"
