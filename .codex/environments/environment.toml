version = 1
name = "fleet-rlm"

[setup]
script = '''
set -eu
uv sync --locked --dev
if [ ! -e config/fleet.toml ]; then
  common_dir=$(git rev-parse --path-format=absolute --git-common-dir)
  source_config="$(dirname "$common_dir")/config/fleet.toml"
  if [ -f "$source_config" ]; then
    cp "$source_config" config/fleet.toml
  else
    cp config/fleet.toml.example config/fleet.toml
  fi
fi
if [ ! -e .env ]; then
  common_dir=$(git rev-parse --path-format=absolute --git-common-dir)
  source_env="$(dirname "$common_dir")/.env"
  umask 077
  if [ -f "$source_env" ]; then
    cp "$source_env" .env
    chmod 600 .env
    echo "Copied local configuration from the main checkout."
  else
    cp .env.example .env
    chmod 600 .env
    echo "Created .env from the example; configure credentials before using live services."
  fi
fi
'''
