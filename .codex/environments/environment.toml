version = 1
name = "fleet-rlm"

[setup]
script = ".codex/workspace-bootstrap.zsh"

[[actions]]
name = "App: Run API"
icon = "run"
command = "uv run fleet web"

[[actions]]
name = "Terminal Client: Run"
icon = "run"
command = "cd tools/fleet-tui && pnpm start"

[[actions]]
name = "Backend: Unit Tests"
icon = "test"
command = "make test-unit"

[[actions]]
name = "Backend: Check"
icon = "check"
command = "make check"

[[actions]]
name = "Repo: Docs Check"
icon = "docs"
command = "make check-docs"

[[actions]]
name = "OpenAPI: Check"
icon = "check"
command = "make api-check"
