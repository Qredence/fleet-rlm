repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args:
          - --fix
          - --exit-non-zero-on-fix
        stages: [pre-commit]
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ty-check
        name: Type-check backend sources with ty
        entry: make typecheck
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: backend-fast-tests
        name: Run backend fast test lane
        entry: make test-fast
        language: system
        pass_filenames: false
        stages: [pre-push]
